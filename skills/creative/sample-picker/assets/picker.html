<!doctype html>
<html lang="en" data-theme="paper" data-text="regular" data-cards="grid">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample picker</title>
<!--
  Sample picker engine. One file, no outside requests, no dependencies.
  It shows a few RENDERED options for a visual or wording choice on the user's real content.
  The person shortlists, compares, tweaks, chooses, and copies a compact result back.

  To make a picker: replace the PICKER object between the PICKER-DATA markers with strict JSON
  (scripts/build_picker.py does this and validates first). For kind "custom", put one function per
  option id in RENDERERS, between the PICKER-RENDERERS markers.

  Delivery notes:
  - No form element, no submit event, no alert, confirm or prompt.
  - Storage is optional: host storage if present, then localStorage, then memory. The page says which.
  - The result is always offered in a text box as well as by copy and download, because a sandboxed
    frame can refuse both.
  - Text is always set as text. Nothing from the data is assembled as markup.
  - Everything inside a sample is inert display: specimen "buttons" and "inputs" are spans, so the
    only controls on the page are the picker's own.
  - picker.html#solo=OPTION-ID shows that option's sample alone, for measuring and screenshots.
-->
<style>
:root{
  --c-bg:#f4eee3;--c-surface:#fffaf1;--c-raised:#faf3e5;--c-ink:#2a2320;--c-muted:#655a50;--c-line:#d8ccba;
  --c-accent:#8f4319;--c-on-accent:#fffaf1;--c-warn:#8e2a1c;--c-ok:#2c6446;--c-focus:#1f5c8a;
  --target:44px;--bar:64px;--fs:16px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;
}
:root[data-theme="slate"]{--c-bg:#eef1f3;--c-surface:#fbfcfd;--c-raised:#f3f6f8;--c-ink:#1f2a30;--c-muted:#51606a;--c-line:#c8d2d8;--c-accent:#245a7a;--c-on-accent:#fbfcfd;--c-warn:#8a2a22;--c-ok:#27634a;--c-focus:#7a3c12}
:root[data-theme="ember"]{--c-bg:#231c18;--c-surface:#2d2520;--c-raised:#372d27;--c-ink:#f3e9dc;--c-muted:#c2b3a2;--c-line:#54463c;--c-accent:#f0a36b;--c-on-accent:#231c18;--c-warn:#ffac99;--c-ok:#9ed6b3;--c-focus:#9fd0f2}
:root[data-theme="night"]{--c-bg:#12171c;--c-surface:#1a2128;--c-raised:#222b33;--c-ink:#e8eef2;--c-muted:#a9b8c2;--c-line:#3a4853;--c-accent:#8cc4e8;--c-on-accent:#12171c;--c-warn:#ffb0a3;--c-ok:#9bd8b6;--c-focus:#f2c08a}
:root[data-text="large"]{--fs:18px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none !important}
body{margin:0;background:var(--c-bg);color:var(--c-ink);font:var(--fs)/1.5 var(--sans);padding-bottom:calc(var(--bar) + 16px)}
.wrap{max-width:1240px;margin:0 auto;padding:16px 16px 24px}
header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font:600 1.35rem/1.25 var(--serif);margin:0;overflow-wrap:anywhere}
.question{margin:2px 0 0;color:var(--c-muted);font-size:.95rem}
h2{font:600 1.15rem/1.3 var(--serif);margin:0;overflow-wrap:anywhere}
h2:focus{outline:none}
#main>h2{margin-bottom:8px}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
.btn,.seg{min-height:var(--target);min-width:var(--target);padding:0 14px;border:1px solid var(--c-line);background:var(--c-surface);border-radius:6px}
.btn:hover,.seg:hover{border-color:var(--c-ink)}
.btn.primary{background:var(--c-accent);border-color:var(--c-accent);color:var(--c-on-accent);font-weight:600}
.btn.quiet{border-color:transparent;background:transparent;color:var(--c-muted);text-decoration:underline;text-underline-offset:3px}
.btn.danger{border-color:var(--c-warn);color:var(--c-warn)}
.btn[aria-disabled="true"]{opacity:.55;cursor:default}
.seg[aria-pressed="true"],.btn[aria-pressed="true"]{border-color:var(--c-ink);box-shadow:inset 0 -3px 0 var(--c-accent);font-weight:600}
:focus-visible{outline:3px solid var(--c-focus);outline-offset:2px}
.status{min-height:1.5em;margin:8px 0;color:var(--c-muted);font-size:.9rem}
.lead{margin:0 0 12px;color:var(--c-muted);font-size:.95rem;max-width:70ch}
.muted{color:var(--c-muted)}
.warn{color:var(--c-warn);font-weight:600}

/* the three views live behind one bar: at the thumb on a phone, under the title on a wide screen */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--c-raised);border-top:2px solid var(--c-ink)}
.bar .seg{min-height:48px;padding:0 6px;overflow-wrap:anywhere}
.bar .seg[aria-current="page"]{border-color:var(--c-ink);box-shadow:inset 0 -3px 0 var(--c-accent);font-weight:600}
/* a control that takes keyboard focus is scrolled clear of the fixed bar (and of the compare tabs above it) */
html{scroll-padding-bottom:calc(var(--bar) + 20px)}
html:has(body.comparing){scroll-padding-bottom:calc(var(--bar) + 88px)}
@media (min-width:760px){
  html,html:has(body.comparing){scroll-padding-bottom:0}
  body{padding-bottom:24px}
  .bar{position:static;border-top:0;background:transparent;padding:12px 0 0;max-width:520px}
}

/* option cards */
.cards{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){:root[data-cards="grid"] .cards.multi{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}}
.card{min-width:0;border-top:3px solid transparent;padding-top:8px}
.card.short{border-top-color:var(--c-ink)}
.card.out{border-top:3px dashed var(--c-muted)}
.card h3,.cmp-col h3,.meta h3{font:600 1.05rem/1.3 var(--serif);margin:0}
#rig{height:0;overflow:hidden;visibility:hidden}
.mat{border:1px solid var(--c-line);border-radius:4px;overflow:hidden;background:var(--c-surface)}
.meta{padding:10px 2px 0}
.card-head{padding:0 2px 8px}
.name-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.tag{font-size:.8rem;font-weight:700;letter-spacing:.02em}
.tag.rec{color:var(--c-accent)}
.tag.out{color:var(--c-muted)}
.note{margin:2px 0 0}
.why{margin:2px 0 0;color:var(--c-muted);font-size:.9rem}
.facts{margin:6px 0 0;color:var(--c-muted);font-size:.85rem}
.facts .warn{font-size:inherit}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.acts .btn,.acts .seg{flex:1 1 120px}
.mynote{margin:6px 0 0;font-size:.9rem;font-style:normal;border-left:3px solid var(--c-line);padding-left:8px;overflow-wrap:anywhere}

.blank{padding:28px 4px;border-top:1px solid var(--c-line);border-bottom:1px solid var(--c-line)}
.blank p{margin:6px 0 14px;color:var(--c-muted);max-width:56ch}

/* detail */
.d-top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:10px}
.d-top h2{flex:1 1 200px}
.panel{margin-top:16px;border-top:1px solid var(--c-line);padding-top:12px}
.d-side>.acts:first-of-type{margin-top:10px}
@media (min-width:980px){
  .detail.split{display:grid;grid-template-columns:minmax(0,3fr) minmax(320px,2fr);gap:0 32px;align-items:start}
  .detail.split .d-main{position:sticky;top:12px}
}
.panel h3{font:600 1rem var(--sans);margin:0 0 4px}
.ctl{display:grid;gap:6px;margin-top:12px;max-width:560px}
.ctl .lab{font-size:.9rem;color:var(--c-muted)}
.ctl .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl input[type=range]{flex:1 1 200px;min-height:var(--target);accent-color:var(--c-accent)}
.ctl output{min-width:5ch;font-family:var(--mono);font-size:.9rem}
label.lab{display:block;font-size:.9rem;color:var(--c-muted);margin-bottom:4px}
textarea{width:100%;min-height:88px;padding:10px 12px;border:1px solid var(--c-line);border-radius:6px;background:var(--c-surface);line-height:1.4}
textarea[readonly]{font-family:var(--mono);font-size:.82rem;min-height:240px}
.factlist{margin:6px 0 0;padding:0;list-style:none;font-size:.9rem;display:grid;gap:2px}
.factlist li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dotted var(--c-line);padding:2px 0}
.factlist b{font-family:var(--mono);font-weight:600}

/* compare */
.cmp-pick{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.cmp{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
.cmp-col{min-width:0}
.cmp-col .name-row{margin-bottom:6px}
.cmp-tabs{position:fixed;left:0;right:0;bottom:var(--bar);z-index:4;display:flex;gap:6px;padding:8px 12px;background:var(--c-bg);border-top:1px solid var(--c-line)}
.cmp-tabs .seg{flex:1 1 0;min-height:48px;padding:0 6px;overflow-wrap:anywhere}
body.comparing{padding-bottom:calc(var(--bar) + 84px)}
@media (min-width:760px){
  .cmp.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cmp.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cmp-tabs{display:none}
  .cmp-col[hidden]{display:block !important}
  body.comparing{padding-bottom:24px}
}

/* page and session */
.choice{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.choice .lab{min-width:84px;color:var(--c-muted);font-size:.9rem}
.confirm{margin-top:10px;padding:12px;border:2px solid var(--c-warn);border-radius:6px;display:grid;gap:10px}
.confirm p{margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=file]{min-height:var(--target);max-width:100%}

/* ------------------------------------------------------------------------------------------
   Samples. Everything below draws an OPTION, not the picker. Colours come only from the option's
   own tokens (--o-*), never from the page chrome above.
   ------------------------------------------------------------------------------------------ */
.smp{--d:1;background:var(--o-bg);color:var(--o-text);font-family:var(--sans);font-size:var(--ctl-text-size,16px);line-height:1.5;padding:calc(16px * var(--d));overflow-wrap:anywhere}
.smp[data-ctl-density="compact"]{--d:.6}
.smp[data-ctl-density="roomy"]{--d:1.45}
.smp h3{margin:0;font:600 1.25em/1.25 var(--serif)}
.smp p{margin:0}

.smp-theme .t-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px}
.smp-theme .t-status{color:var(--o-ok);font-size:.85em;font-weight:600}
.smp-theme .t-body{margin-top:calc(8px * var(--d))}
.smp-theme .t-link{color:var(--o-accent);text-decoration:underline;text-underline-offset:3px;font-weight:600}
.smp-theme .t-panel{margin-top:calc(14px * var(--d));background:var(--o-surface);border:1px solid var(--o-line);border-radius:var(--ctl-radius,6px);padding:calc(12px * var(--d))}
.smp-theme .t-label{display:block;font-size:.85em;color:var(--o-muted)}
.smp-theme .t-input{display:block;margin-top:4px;background:var(--o-field);border:2px solid var(--o-danger);border-radius:var(--ctl-radius,6px);padding:calc(9px * var(--d)) 12px;min-height:calc(18px + 26px * var(--d))}
.smp-theme .t-err{display:block;margin-top:4px;color:var(--o-danger);font-size:.85em;font-weight:600}
.smp-theme table{width:100%;border-collapse:collapse;margin-top:calc(12px * var(--d));font-size:.9em}
.smp-theme th{text-align:left;font-weight:600;color:var(--o-muted);font-size:.85em;padding:calc(6px * var(--d)) 8px calc(6px * var(--d)) 0;border-bottom:1px solid var(--o-line)}
.smp-theme td{padding:calc(8px * var(--d)) 8px calc(8px * var(--d)) 0;border-bottom:1px solid var(--o-line)}
.smp-theme th:last-child,.smp-theme td:last-child{text-align:right;padding-right:0;font-variant-numeric:tabular-nums}
.smp-theme .t-btns{display:flex;flex-wrap:wrap;gap:calc(10px * var(--d)) 10px;margin-top:calc(14px * var(--d));align-items:flex-start}
.smp-theme .t-b{display:grid;gap:3px;justify-items:start}
.smp-theme .t-cap{font-size:.72em;color:var(--o-muted)}
.sb-btn{display:inline-block;background:var(--o-accent);color:var(--o-on-accent);border:1px solid var(--o-accent);border-radius:var(--ctl-radius,6px);padding:calc(9px * var(--d)) 14px;font-weight:600;line-height:1.3}
.sb-btn.hov{background:var(--o-accent-strong);border-color:var(--o-accent-strong);text-decoration:underline;text-underline-offset:3px}
.sb-btn.foc{outline:3px solid var(--o-focus);outline-offset:2px}
.sb-btn.dis{opacity:.5}
.sb-btn.sec{background:var(--o-surface);color:var(--o-text);border-color:var(--o-line)}

.smp-type .y-h{font-family:var(--y-hstack);font-weight:var(--y-hweight);font-size:calc(var(--y-hsize) * var(--ctl-scale-n,100) / 100);line-height:1.2;max-width:var(--ctl-measure,var(--y-measure))}
.smp-type .y-p{font-family:var(--y-stack);font-weight:var(--y-weight);font-size:calc(var(--y-size) * var(--ctl-scale-n,100) / 100);line-height:var(--y-leading);max-width:var(--ctl-measure,var(--y-measure));margin-top:.7em}

.frames{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;background:var(--c-surface);padding:12px}
.fr{min-width:0}
.fr.phone{flex:0 1 360px}
.fr.wide{flex:1 1 320px}
.fr-cap{font:600 .78rem var(--mono);color:var(--c-muted);margin:0 0 4px}
.fr-box{border:1px solid var(--c-line);overflow:hidden;position:relative}
.fr-box.cut{border-bottom:2px dashed var(--c-muted)}
.fr-in{transform-origin:top left;container-type:inline-size}
.smp-layout{padding:calc(14px * var(--d))}
.smp-layout .l-title{font:600 1.1em/1.3 var(--serif);margin:0 0 calc(10px * var(--d))}
.smp-layout .l-scroll{overflow-x:auto}
.smp-layout table{border-collapse:collapse;width:max-content;min-width:100%;font-size:.92em;overflow-wrap:normal}
.smp-layout td.ttl{min-width:16ch;max-width:30ch}
.smp-layout th{text-align:left;color:var(--o-muted);font-weight:600;font-size:.85em;padding:calc(7px * var(--d)) 10px;border-bottom:2px solid var(--o-line);white-space:nowrap}
.smp-layout td{padding:calc(9px * var(--d)) 10px;border-bottom:1px solid var(--o-line);vertical-align:top}
.smp-layout .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.smp-layout .l-st{font-weight:600;white-space:nowrap}
.smp-layout .l-st.alert{color:var(--o-danger)}
.smp-layout[data-ctl-stripes="on"] tbody tr:nth-child(even),.smp-layout[data-ctl-stripes="on"] .l-row:nth-child(even){background:var(--o-surface)}
.smp-layout .l-cards{display:grid;gap:calc(12px * var(--d));grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.smp-layout .l-card{background:var(--o-surface);border:1px solid var(--o-line);border-radius:6px;padding:calc(12px * var(--d))}
.smp-layout .l-card .l-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.smp-layout .l-card .l-name{font-weight:600}
.smp-layout .l-card .l-val{font:600 1.15em var(--mono);white-space:nowrap}
.smp-layout .l-card dl{margin:calc(8px * var(--d)) 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.88em}
.smp-layout .l-card dt{color:var(--o-muted)}
.smp-layout .l-card dd{margin:0;text-align:right}
.smp-layout .l-list{border-top:1px solid var(--o-line)}
.smp-layout .l-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 12px;padding:calc(7px * var(--d)) 4px;border-bottom:1px solid var(--o-line)}
.smp-layout .l-row .l-name{font-weight:600}
.smp-layout .l-row .l-val{font-family:var(--mono);font-weight:600;white-space:nowrap}
.smp-layout .l-row .l-meta{grid-column:1/-1;color:var(--o-muted);font-size:.85em}
@container (min-width:700px){
  .smp-layout .l-row{grid-template-columns:minmax(0,2fr) minmax(0,3fr) auto}
  .smp-layout .l-row .l-meta{grid-column:auto;grid-row:1;align-self:center}
  .smp-layout .l-row .l-name{grid-row:1}
  .smp-layout .l-row .l-val{grid-row:1;grid-column:3}
}

.smp-copy{padding:0}
.smp-copy .cp-nav{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:calc(10px * var(--d)) 16px;border-bottom:1px solid var(--o-line);font-size:.9em}
.smp-copy .cp-brand{font:600 1.05em var(--serif);margin-right:auto}
.smp-copy .cp-item{color:var(--o-muted)}
.smp-copy .cp-hero{padding:calc(28px * var(--d)) 16px calc(26px * var(--d));display:grid;gap:calc(12px * var(--d));justify-items:start;text-align:left}
.smp-copy[data-ctl-align="centre"] .cp-hero{justify-items:center;text-align:center}
.smp-copy .cp-h{font:600 var(--ctl-heading-size,30px)/1.15 var(--serif);letter-spacing:-.01em;margin:0;max-width:22ch}
.smp-copy .cp-sub{font-size:1.05em;color:var(--o-muted);max-width:46ch}
.smp-copy .cp-foot{font-size:.82em;color:var(--o-muted)}
.smp-copy[data-ctl-action="off"] .cp-acts{display:none}
.smp-copy .cp-acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.smp-copy .cp-notice{margin:16px;padding:calc(14px * var(--d));background:var(--o-surface);border:1px solid var(--o-line);border-left:4px solid var(--o-accent);border-radius:6px;display:grid;gap:8px;justify-items:start}
.smp-copy .cp-notice .cp-h{font-size:var(--ctl-heading-size,19px);max-width:none}

.smp-comp .k-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:calc(16px * var(--d)) 14px;align-items:start}
.smp-comp .k-cell{display:grid;gap:5px;justify-items:start}
.smp-comp .k-cap{font-size:.75em;color:var(--o-muted)}
.kb{display:inline-block;border-radius:var(--ctl-radius,var(--k-radius));padding:calc(var(--k-pad-y) * var(--d)) var(--k-pad-x);font-weight:var(--k-weight);line-height:1.3;border:var(--k-border) solid var(--o-accent);background:var(--o-accent);color:var(--o-on-accent)}
.kb.outline{background:transparent;color:var(--o-accent)}
.kb.soft{background:var(--o-surface);color:var(--o-text);border-color:var(--o-line)}
.kb.hov{text-decoration:underline;text-underline-offset:3px;background:var(--o-accent-strong);border-color:var(--o-accent-strong)}
.kb.outline.hov,.kb.soft.hov{background:var(--o-surface)}
.kb.foc{outline:3px solid var(--o-focus);outline-offset:2px}
.kb.prs{transform:translateY(1px);box-shadow:inset 0 2px 0 var(--o-text)}
.kb.dis{opacity:.5}
.kf{display:grid;gap:4px;width:100%}
.kf .kf-l{font-size:.85em;color:var(--o-muted)}
.kf .kf-i{display:block;background:var(--o-field);border:var(--k-border) solid var(--o-line);border-radius:var(--ctl-radius,var(--k-radius));padding:calc(var(--k-pad-y) * var(--d)) var(--k-pad-x);min-height:calc(1.5em + 2 * var(--k-pad-y) * var(--d))}
.kf .kf-i.ph{color:var(--o-muted)}
.kf.foc .kf-i{outline:3px solid var(--o-focus);outline-offset:1px}
.kf.err .kf-i{border-color:var(--o-danger);border-width:2px}
.kf .kf-e{color:var(--o-danger);font-size:.85em;font-weight:600}
.kf.dis{opacity:.5}

.smp-custom p{margin:0 0 6px}
body.solo{padding:0}
body.solo .wrap{max-width:none;padding:0}
@media (prefers-reduced-motion:no-preference){.btn,.seg{transition:border-color .12s ease}}
</style>
</head>
<body>
<div class="wrap" id="chrome">
  <header class="top">
    <div>
      <h1 id="title">Sample picker</h1>
      <p class="question" id="question"></p>
    </div>
    <button type="button" class="btn" id="page-toggle" aria-pressed="false">Page</button>
  </header>
  <nav class="bar" aria-label="Views">
    <button type="button" class="seg" id="nav-options">Options</button>
    <button type="button" class="seg" id="nav-compare">Compare</button>
    <button type="button" class="seg" id="nav-result">Result</button>
  </nav>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <main id="main"></main>
  <div id="rig" aria-hidden="true"></div>
</div>
<div id="solo"></div>

<script>
/* PICKER-DATA:START */
const PICKER = null;
/* PICKER-DATA:END */
/* PICKER-RENDERERS:START */
const RENDERERS = {};
/* PICKER-RENDERERS:END */
</script>
<script>
(function () {

        'No final choice yet. ' + (S.shortlist.length ? 'Shortlisted: ' + S.shortlist.map(function (id) { return opt(id).name; }).join(', ') + '.' : 'Nothing is shortlisted.') + ' You can still copy this back as work in progress.'}));

        el('button', {type: 'button', class: 'seg', id: 'r-mode-text', 'data-fk': 'r-mode-text', 'aria-pressed': String(V.mode === 'text'), text: 'Short text', on: {click: function () { V.mode = 'text'; V.copyNote = ''; render(); }}}),
        el('button', {type: 'button', class: 'seg', id: 'r-mode-json', 'data-fk': 'r-mode-json', 'aria-pressed': String(V.mode === 'json'), text: 'JSON', on: {click: function () { V.mode = 'json'; V.copyNote = ''; render(); }}})
      ]));
      main.appendChild(el('label', {class: 'lab', for: 'r-text', text: 'Paste this back to the assistant'}));
      var box = el('textarea', {id: 'r-text', 'data-fk': 'r-text', readonly: true, spellcheck: 'false', rows: '12'});
      box.value = V.mode === 'json' ? asciiJson(env, 1) : choiceBlock(env);
      main.appendChild(box);
      main.appendChild(el('div', {class: 'acts'}, [
        el('button', {type: 'button', class: 'btn primary', id: 'r-copy', 'data-fk': 'r-copy', text: 'Copy', on: {click: function () { copyOut(box); }}}),
        el('button', {type: 'button', class: 'btn', id: 'r-download', 'data-fk': 'r-download', text: 'Download as a file', on: {click: function () { download(asciiJson(envelope(), 1)); }}})
      ]));
      main.appendChild(el('p', {class: 'status', id: 'r-status', role: 'status', text: V.copyNote}));
      main.appendChild(el('p', {class: 'muted', text: store.words()}));
    },
    page: function (main) {
      main.appendChild(el('h2', {tabindex: '-1', text: 'Page and session'}));
      var seg = function (group, attr, value, label) {
        return el('button', {type: 'button', class: 'seg', 'data-fk': attr + '-' + value, 'aria-pressed': String(page[group] === value), text: label, on: {click: function () { page[group] = value; pageStore.write(); applyPage(); render(); }}}, []);
      };
      var mk = function (group, label, pairs) {
        var row = el('div', {class: 'choice', role: 'group', 'aria-label': label}, [el('span', {class: 'lab', text: label})]);
        pairs.forEach(function (p) { var b = seg(group, 'page-' + group, p[0], p[1]); b.setAttribute('data-page-' + group, p[0]); row.appendChild(b); });
        return row;
      };
      main.appendChild(el('section', {class: 'panel'}, [
        el('h3', {text: 'How this page looks'}),
        el('p', {class: 'muted', text: 'These change the page around the samples, never the samples.'}),
        mk('theme', 'Page theme', [['paper', 'Paper'], ['slate', 'Slate'], ['ember', 'Ember'], ['night', 'Night']]),
        mk('text', 'Page text', [['regular', 'Regular'], ['large', 'Large']]),
        mk('cards', 'Options', [['grid', 'Side by side'], ['single', 'One per row']]),
        el('div', {class: 'choice'}, [el('button', {type: 'button', class: 'btn quiet', id: 'page-reset', 'data-fk': 'page-reset', text: 'Reset page settings', on: {click: function () { page = clone(PAGE_DEFAULTS); pageStore.clear(); applyPage(); render(); }}})])
      ]));
      var imp = el('section', {class: 'panel'}, [
        el('h3', {text: 'Session'}),
        el('p', {id: 'storage-note', text: store.words()}),
        el('p', {class: 'muted', text: 'Your shortlist, notes, tweaks and choice are the session. The Result view holds it as JSON to copy or download. To carry on somewhere else, paste that JSON here.'}),
        el('label', {class: 'lab', for: 'i-text', text: 'Paste a saved session'}),
        el('textarea', {id: 'i-text', 'data-fk': 'i-text', rows: '4', spellcheck: 'false'}),
        el('label', {class: 'lab', for: 'i-file', text: 'Or choose a saved session file'}),
        el('input', {type: 'file', id: 'i-file', 'data-fk': 'i-file', accept: '.json,application/json,text/plain', on: {change: function () {
          var f = this.files && this.files[0]; if (!f) return;
          var r = new FileReader();
          r.onload = function () { $('i-text').value = String(r.result || ''); tryImport(); };
          r.onerror = function () { V.importNote = 'That file could not be read. Nothing was loaded.'; V.importBad = true; render(); };
          r.readAsText(f);
        }}}),
        el('div', {class: 'acts'}, [el('button', {type: 'button', class: 'btn', id: 'i-load', 'data-fk': 'i-load', text: 'Load the pasted session', on: {click: tryImport}})]),
        el('p', {class: 'status' + (V.importBad ? ' warn' : ''), id: 'i-status', role: 'status', text: V.importNote})
      ]);
      if (V.importing) {
        var d = V.importing;
        imp.appendChild(el('div', {class: 'confirm', id: 'i-confirm'}, [
          el('p', {text: (d.differs ? 'This session was saved for "' + d.differs + '". This page is "' + contentId() + '". ' : '') +
            (d.dropped.length ? 'It mentions ' + plural(d.dropped.length, 'option', 'options') + ' this page does not have (' + d.dropped.join(', ') + '), which would be left out. ' : '') + 'Load it anyway? It replaces the current session.'}),
          el('div', {class: 'row'}, [
            el('button', {type: 'button', class: 'btn', id: 'i-cancel', 'data-fk': 'i-cancel', text: 'Keep the current session', on: {click: function () { V.importing = null; V.importNote = 'Nothing was loaded. The current session is unchanged.'; V.importBad = false; render(); }}}),
            el('button', {type: 'button', class: 'btn danger', id: 'i-continue', 'data-fk': 'i-continue', text: 'Load it anyway', on: {click: function () { finishImport(V.importing); }}})
          ])
        ]));
      }
      main.appendChild(imp);
      var n = S.shortlist.length + S.rejected.length + Object.keys(S.notes).length + (S.chosen ? 1 : 0);
      var reset = el('section', {class: 'panel'}, [el('h3', {text: 'Start again'})]);
      if (V.confirming) {
        reset.appendChild(el('div', {class: 'confirm', id: 's-confirm'}, [
          el('p', {text: 'This clears ' + plural(S.shortlist.length, 'shortlisted option', 'shortlisted options') + ', ' + plural(S.rejected.length, 'ruled out option', 'ruled out options') + ', ' + plural(Object.keys(S.notes).length, 'note', 'notes') + (S.chosen ? ', the choice of ' + opt(S.chosen).name : '') + ' and the tweaks. Copy the result first if you want to keep it.'}),
          el('div', {class: 'row'}, [
            el('button', {type: 'button', class: 'btn', id: 's-reset-no', 'data-fk': 's-reset-no', text: 'Keep everything', on: {click: function () { V.confirming = false; render(); var b = $('s-reset'); if (b) b.focus(); }}}),
            el('button', {type: 'button', class: 'btn', id: 's-reset-export', 'data-fk': 's-reset-export', text: 'Open Result to copy it first', on: {click: function () { go('result'); }}}),
            el('button', {type: 'button', class: 'btn danger', id: 's-reset-yes', 'data-fk': 's-reset-yes', text: 'Clear the session', on: {click: function () {
              V.undo = clone(S); V.confirming = false;
              adopt({shortlist: [], rejected: [], chosen: null, notes: {}, controls: controlDefaults()});
              say('The session was cleared. Undo is on the Page view until you change something else.');
              render(); var u = $('s-undo'); if (u) u.focus();
            }}})
          ])
        ]));
      } else {
        reset.appendChild(el('div', {class: 'acts'}, [
          el('button', {type: 'button', class: 'btn', id: 's-reset', 'data-fk': 's-reset', 'aria-disabled': String(n === 0 && !tweaked()), text: 'Clear the session', on: {click: function () { if (n === 0 && !tweaked()) { say('There is nothing to clear.'); return; } V.confirming = true; render(); var k = $('s-reset-no'); if (k) k.focus(); }}}),
          V.undo ? el('button', {type: 'button', class: 'btn', id: 's-undo', 'data-fk': 's-undo', text: 'Undo: bring the last session back', on: {click: function () { var back = V.undo; V.undo = null; adopt(back); say('The earlier session is back.'); render(); }}}) : null
        ]));
      }
      main.appendChild(reset);
    }
  };
  function tweaked() { var d = controlDefaults(); return Object.keys(d).some(function (k) { return d[k] !== S.controls[k]; }); }
  function render() {
    var keep = document.activeElement && document.activeElement.getAttribute && document.activeElement.getAttribute('data-fk');
    var main = $('main');
    main.textContent = '';
    document.body.classList.toggle('comparing', V.view === 'compare' && S.shortlist.length >= 2);
    (VIEWS[V.view] || VIEWS.options)(main);
    syncNav();
    fitFrames();
    refreshFacts();
    if (keep) { var again = document.querySelector('[data-fk="' + keep + '"]'); if (again) again.focus(); }
  }

  // ---------- the result that is pasted back ----------
  function choiceBlock(env) {
    var d = env.data, L = ['=== sample-picker choice v1 ===', 'picker: ' + env.content_id, 'kind: ' + d.kind, 'status: ' + d.status, 'chosen: ' + (d.chosen || '(none)')];
    if (d.chosen) L.push('chosen-name: ' + asciiJson(d.chosen_name));
    Object.keys(d.controls).forEach(function (k) { L.push('control: ' + k + ' = ' + asciiJson(d.controls[k])); });
    L.push('shortlist: ' + (d.shortlist.length ? d.shortlist.join(', ') : '(none)'));
    L.push('rejected: ' + (d.rejected.length ? d.rejected.join(', ') : '(none)'));
    Object.keys(d.notes).forEach(function (k) { L.push('note: ' + k + ' = ' + asciiJson(d.notes[k])); });
    d.facts.forEach(function (f) { L.push('fact: ' + asciiJson(f.label) + ' = ' + asciiJson(f.value)); });
    L.push('saved: ' + env.saved_at);
    L.push('=== end ===');
    return L.join('\n');
  }
  function copyOut(box) {
    var done = function (ok) {
      V.copyNote = ok ? 'Copied. Paste it into the chat.' : 'Copying was refused here. The text above is selected: copy it with your device, then paste it into the chat.';
      var n = $('r-status'); if (n) n.textContent = V.copyNote;
      if (!ok) { box.focus(); box.select(); }
    };
    // In a frame that was not given clipboard-write, asking only makes the browser log an error before it
    // refuses. Where the policy can be read, read it first and go straight to the text box.
    var allowed = !!(navigator.clipboard && navigator.clipboard.writeText);
    try { var pol = document.permissionsPolicy || document.featurePolicy; if (pol && typeof pol.allowsFeature === 'function' && !pol.allowsFeature('clipboard-write')) allowed = false; } catch (e) {}
    try {
      if (allowed) navigator.clipboard.writeText(box.value).then(function () { done(true); }, function () { done(false); });
      else done(false);
    } catch (e) { done(false); }
  }
  function download(text) {
    var note = 'A download was asked for. If no file arrives, this page is not allowed to download here: switch to JSON above and copy it.';
    try {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], {type: 'application/json'}));
      a.download = P.id + '-choice.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { try { URL.revokeObjectURL(a.href); } catch (e) {} }, 2000);
    } catch (e) { note = 'This page cannot download here. Switch to JSON above and copy it.'; }
    V.copyNote = note; var n = $('r-status'); if (n) n.textContent = note;
  }
  function tryImport() {
    var r = readSession($('i-text').value);
    V.importing = null;
    if (!r.ok) { V.importNote = r.why; V.importBad = true; render(); return; }
    if (r.differs || r.dropped.length) { V.importing = r; V.importNote = ''; V.importBad = false; render(); var c = $('i-cancel'); if (c) c.focus(); return; }
    finishImport(r);
  }
  function finishImport(r) {
    V.undo = clone(S); V.importing = null;
    adopt(r.state);
    V.importNote = 'Loaded: ' + plural(r.state.shortlist.length, 'shortlisted option', 'shortlisted options') + ', ' + plural(Object.keys(r.state.notes).length, 'note', 'notes') + (r.state.chosen ? ', choice ' + opt(r.state.chosen).name : ', no final choice') + '. Undo is below.';
    V.importBad = false;
    render();
  }

  // ---------- page settings ----------
  var pageStore = {
    read: function () { try { return JSON.parse(localStorage.getItem(APP + ':page') || 'null'); } catch (e) { return null; } },
    write: function () { try { localStorage.setItem(APP + ':page', JSON.stringify(page)); } catch (e) {} },
    clear: function () { try { localStorage.removeItem(APP + ':page'); } catch (e) {} }
  };
  function applyPage() { ['theme', 'text', 'cards'].forEach(function (k) { document.documentElement.setAttribute('data-' + k, page[k]); }); }

  // ---------- start ----------
  function problem(title, text) {
    $('main').appendChild(el('div', {class: 'blank', role: 'alert'}, [el('h2', {text: title}), el('p', {text: text})]));
    document.querySelector('.bar').hidden = true; $('page-toggle').hidden = true;
  }
  function start() {
    var v = pageStore.read();
    if (v && ['paper', 'slate', 'ember', 'night'].indexOf(v.theme) >= 0) page.theme = v.theme;
    if (v && ['regular', 'large'].indexOf(v.text) >= 0) page.text = v.text;
    if (v && ['grid', 'single'].indexOf(v.cards) >= 0) page.cards = v.cards;
    applyPage();
    if (!P || !Array.isArray(P.options)) { problem('No picker in this file', 'This is the empty engine. Put the options and the real content between the PICKER-DATA markers, or run scripts/build_picker.py.'); return; }
    if (!P.options.length) { problem('The picker has no options', 'Nothing can be shown or chosen. Add at least two options that differ in a way you can name.'); return; }
    S.controls = controlDefaults();
    document.title = P.title;
    var solo = /[#&]solo=([^&]+)/.exec(location.hash || '');
    if (solo && opt(decodeURIComponent(solo[1]))) {
      document.body.classList.add('solo'); $('chrome').hidden = true;
      $('solo').appendChild(sample(opt(decodeURIComponent(solo[1])))); fitFrames();
      return;
    }
    $('title').textContent = P.title; $('question').textContent = P.question;
    store.init();
    render();
    store.read(store.key()).then(function (text) {
      if (!text) return;
      var r = readSession(String(text));
      if (r.ok && !r.differs) { S = r.state; applyControlsEverywhere(); render(); say('Your earlier session on this page is back: ' + plural(S.shortlist.length, 'shortlisted option', 'shortlisted options') + (S.chosen ? ', choice ' + opt(S.chosen).name : '') + '.'); }
    });
  }
  $('nav-options').addEventListener('click', function () { go('options'); });
  $('nav-compare').addEventListener('click', function () { go('compare'); });
  $('nav-result').addEventListener('click', function () { go('result'); });
  $('page-toggle').addEventListener('click', function () { go(V.view === 'page' ? 'options' : 'page'); });
  var resizeTimer = null;
  window.addEventListener('resize', function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(function () { fitFrames(); refreshFacts(); }, 150); });
  start();
})();
</script>
</body>
</html>
