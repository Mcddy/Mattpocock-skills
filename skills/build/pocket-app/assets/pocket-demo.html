<!doctype html>
<html lang="en" data-theme="paper" data-density="comfortable" data-text="standard">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist</title>
<!--
  Starter page for the pocket-app skill: a checklist that keeps its items without a server.
  It is a working tool and a skeleton to build from. To make another tool from it, change, in
  this order:
    1. APP, SCHEMA, CONTENT and INITIAL: the identity and the empty shape of the data
    2. validate: every rule the data must obey, each as a sentence a person can act on
    3. MIGRATIONS: empty at schema 1; add step N whenever the shape changes and SCHEMA goes to N + 1
    4. the changes (addItem, toggleItem, removeItem): each one is a store.update with a label
    5. render and the markup above it: the main object first, with real loading, empty,
       no-result and error states
  Leave the two pocket-embed blocks as they are; scripts/pocket_embed.py checks them.

  Delivery rules followed here: no form element, no alert, confirm or prompt, text set with
  textContent, storage optional, downloads paired with an on-page text box.
-->
<style>
:root{
  --bg:#f6f0e4;--surface:#fffcf5;--raised:#eee5d4;--ink:#27211b;--muted:#5f5548;--line:#d4c8b3;
  --accent:#1d5b55;--on-accent:#fffcf5;--accent-soft:#d8e7e1;
  --warn:#8a2a1c;--warn-soft:#f5ddd3;--ok:#2a6044;--focus:#1b4f87;
  --row-pad:16px;--gap:14px;--target:44px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;
}
:root[data-theme="sage"]{
  --bg:#edf1ec;--surface:#fbfdfa;--raised:#e1e8e1;--ink:#1c2620;--muted:#4c5b52;--line:#c3cfc5;
  --accent:#2c5884;--on-accent:#fbfdfa;--accent-soft:#d7e3ee;
  --warn:#8a2a22;--warn-soft:#f3dcd8;--ok:#27634a;--focus:#7a3c12;
}
:root[data-theme="dusk"]{
  --bg:#221c18;--surface:#2c2520;--raised:#382f29;--ink:#f3e9dc;--muted:#c4b6a5;--line:#57493e;
  --accent:#eba872;--on-accent:#221c18;--accent-soft:#4a3628;
  --warn:#ffad9a;--warn-soft:#4c2a23;--ok:#a1d7b5;--focus:#9dcff2;
}
:root[data-theme="ink"]{
  --bg:#101315;--surface:#181c20;--raised:#21272c;--ink:#eef2f4;--muted:#abb7bf;--line:#3c4851;
  --accent:#90c8ea;--on-accent:#101315;--accent-soft:#233846;
  --warn:#ffb4a7;--warn-soft:#452622;--ok:#9bd9b8;--focus:#f3c48b;
}
:root[data-density="compact"]{--row-pad:9px;--gap:10px}
:root[data-text="large"]{font-size:112.5%}
:root[data-text="larger"]{font-size:125%}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 var(--sans)}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 64px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:10px}
header.top>div{flex:1 1 0;min-width:0}
h1{font:600 1.8rem/1.15 var(--serif);margin:0;letter-spacing:-.01em}
.tally{color:var(--muted);margin:4px 0 0;font-size:.95rem}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button[aria-disabled="true"]{cursor:default;opacity:.55}
.btn,.pk-btn{min-height:var(--target);padding:6px 16px;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.btn:hover,.pk-btn:hover{border-color:var(--ink)}
.btn.primary,.pk-btn.pk-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:0 10px}
.pk-btn.pk-danger{border-color:var(--warn);color:var(--warn)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
input[type=text],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-height:var(--target);padding:0 12px;width:100%}
textarea{padding:10px 12px;line-height:1.45;resize:vertical}
[aria-invalid="true"]{border-color:var(--warn);border-width:2px}
label,.lab{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}

.display{margin-top:12px;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:12px}
.display[hidden]{display:none}
.choice{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.choice .lab{width:70px;margin:0;font-size:.9rem}
.seg{min-height:var(--target);padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:6px}
.seg[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent);font-weight:600}
.seg b{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:6px}
.seg[aria-pressed="true"] b{color:var(--ink)}

.topnote{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin:12px 0 0;padding:10px 12px;background:var(--warn-soft);border-radius:6px}
.topnote[hidden]{display:none}
.topnote p{margin:0;color:var(--warn);font-weight:600;flex:1 1 220px;overflow-wrap:anywhere}
.adder{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end;margin:18px 0 6px}
.err{color:var(--warn);font-size:.85rem;font-weight:600;margin-top:4px;grid-column:1/-1}
.err:empty{display:none}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin:10px 0 4px;min-height:var(--target)}
.status{margin:0;color:var(--muted);font-size:.95rem;flex:1 1 220px;overflow-wrap:anywhere}
.status.bad{color:var(--warn);font-weight:600}
.undo{display:flex;gap:8px;flex-wrap:wrap}
.undo .pk-btn{max-width:100%;overflow-wrap:anywhere;text-align:left;padding-top:6px;padding-bottom:6px;height:auto}
.items{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--gap);align-items:center;padding:var(--row-pad) 2px;border-bottom:1px solid var(--line)}
.item input[type=checkbox]{width:24px;height:24px;margin:10px;accent-color:var(--accent)}
.item label{margin:0;font-size:1rem;color:var(--ink);overflow-wrap:anywhere;min-height:var(--target);display:flex;align-items:center}
.item label{gap:8px}
.item.done .txt{color:var(--muted);text-decoration:line-through}
.item .state{font-size:.8rem;color:var(--muted);white-space:nowrap}
.blank{padding:34px 12px;text-align:center;border-bottom:1px solid var(--line)}
.blank h2{font:600 1.2rem var(--serif);margin:0 0 6px}
.blank p{margin:0 auto 14px;color:var(--muted);max-width:46ch;overflow-wrap:anywhere}
.ghost{height:calc(var(--target) + var(--row-pad) * 2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}
.ghost i{display:block;height:12px;border-radius:6px;background:var(--line)}

section.card{margin-top:30px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
section.card>h2{font:600 1.2rem var(--serif);margin:0 0 12px}
.foot{margin-top:24px;color:var(--muted);font-size:.875rem;max-width:66ch}

/* pocket-ui styles: the export, import and start-again panel */
.pk-panel{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.pk-note{margin:0;color:var(--muted);font-size:.95rem}
.pk-note[data-mode="memory"],.pk-note[data-state="conflict"],.pk-note[data-state="recovery"]{color:var(--warn);font-weight:600}
.pk-block{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;justify-items:start;border-top:1px solid var(--line);padding-top:14px}
.pk-block h3{font:600 1rem var(--sans);margin:0}
.pk-block label{margin:4px 0 0}
.pk-help{margin:0;color:var(--muted);font-size:.9rem;max-width:62ch}
.pk-text{font-family:var(--mono);font-size:.82rem;line-height:1.4;width:100%;word-break:break-all}
.pk-file{min-height:var(--target);max-width:100%;padding:8px 0}
.pk-out{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;width:100%}
.pk-out[hidden],.pk-alert[hidden]{display:none}
.pk-row{display:flex;flex-wrap:wrap;gap:8px}
.pk-msg{margin:0;font-size:.9rem;color:var(--muted);overflow-wrap:anywhere;max-width:66ch}
.pk-msg:empty{display:none}
.pk-msg.pk-bad{color:var(--warn);font-weight:600}
.pk-msg.pk-good{color:var(--ok);font-weight:600}
.pk-alert{background:var(--warn-soft);border-radius:6px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;width:100%}
.pk-alert p{margin:0;overflow-wrap:anywhere}
.pk-warn{margin:0;color:var(--warn);font-weight:600}

@media (max-width:640px){
  .choice .lab{width:100%}h1{font-size:1.5rem}}
@media (prefers-reduced-motion:no-preference){.btn,.pk-btn,.seg{transition:border-color .12s ease,background-color .12s ease}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Checklist</h1>
      <p class="tally" id="tally">Opening the saved list.</p>
    </div>
    <button type="button" class="btn" id="display-toggle" aria-expanded="false" aria-controls="display">Display</button>
  </header>

  <section class="display" id="display" hidden aria-label="Display choices">
    <div class="choice" role="group" aria-label="Theme">
      <span class="lab">Theme</span>
      <button type="button" class="seg" data-set="theme" data-value="paper">Paper</button>
      <button type="button" class="seg" data-set="theme" data-value="sage">Sage</button>
      <button type="button" class="seg" data-set="theme" data-value="dusk">Dusk</button>
      <button type="button" class="seg" data-set="theme" data-value="ink">Ink</button>
    </div>
    <div class="choice" role="group" aria-label="Row spacing">
      <span class="lab">Rows</span>
      <button type="button" class="seg" data-set="density" data-value="comfortable">Comfortable</button>
      <button type="button" class="seg" data-set="density" data-value="compact">Compact</button>
    </div>
    <div class="choice" role="group" aria-label="Text size">
      <span class="lab">Text</span>
      <button type="button" class="seg" data-set="text" data-value="standard">Standard</button>
      <button type="button" class="seg" data-set="text" data-value="large">Large</button>
      <button type="button" class="seg" data-set="text" data-value="larger">Larger</button>
    </div>
    <div class="choice">
      <button type="button" class="btn quiet" id="display-reset">Reset display</button>
      <span class="lab" id="display-note" style="width:auto"></span>
    </div>
  </section>

  <div class="topnote" id="top-note" hidden>
    <p id="top-note-text"></p>
    <button type="button" class="btn" id="top-note-go">Go to Export</button>
  </div>
  <div class="adder" id="adder">
    <div>
      <label for="new-item">Something to do</label>
      <input type="text" id="new-item" autocomplete="off" aria-describedby="e-new-item">
    </div>
    <button type="button" class="btn primary" id="add-go">Add</button>
    <div class="err" id="e-new-item"></div>
  </div>

  <div class="bar">
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="undo" id="undo-box"></div>
  </div>
  <div class="choice"><button type="button" class="seg" id="hide-done" aria-pressed="false">Hide what is done</button></div>

  <ul class="items" id="items" aria-label="Items"></ul>

  <section class="card" aria-labelledby="keep-h">
    <h2 id="keep-h">Keep your list</h2>
    <div id="keep"></div>
  </section>

  <p class="foot">This list lives in this page and, where the browser allows it, in this browser's storage. Nothing is sent anywhere. To move it to another device, export a copy here and import it there.</p>
</div>

<script>
/* pocket-embed: pocket-state.js begin */
/*
  pocket-state.js, revision 1.0.0

  State for a single-file tool that keeps its data without a server.
  Plain ASCII, no dependencies, no network requests. Paste the whole file into the page inside
  one script tag, before the page's own code. In a page it defines the global PocketState.
  Under Node it is a module: var PocketState = require('./pocket-state.js').

  var store = PocketState.create({
    app: 'reading-log',            stable id of the tool; an import from another app is refused
    schema: 2,                     whole number, starts at 1, goes up by one when the shape changes
    contentId: 'my-books@1',       what this state belongs to, with its version
    initial: {books: []},          a JSON value, or a function returning one
    migrations: {1: function (data) { return dataForSchema2; }},
    validate: function (data) { return []; }      list of problems; empty means the data is fine
  });

  Reading and changing
    store.get()                    the current data, frozen. Never edit it; use update
    store.update(fn, {label})      fn receives a private copy; edit it or return a new value.
                                   Returns {ok, changed} or {ok: false, reason, message, problems}.
                                   A refused update changes nothing. Each change is one undo step
    store.undo() / store.redo()    {ok, label}. store.history() lists the labels
    store.reset({label})           back to the initial data, as one undo step
    store.isInitial()              true while the data is exactly the initial data
    store.subscribe(fn)            fn({type}) on 'change', 'saved', 'persistence', 'external'.
                                   Returns a function that unsubscribes

  Keeping
    store.ready                    a promise for {mode, restored, migratedFrom, held}. It never rejects
    store.persistence()            {mode: 'host' | 'local' | 'memory', durable, state, text, savedAt,
                                   pending, reason}. text is a sentence to show the user. savedAt is
                                   the last time a layer that outlives the page took the data
    store.flush()                  save now; a promise for persistence(). It never rejects.
                                   The store also saves at once when the page is hidden or closed
    store.size()                   {bytes, warnBytes, over, text} for the saved envelope
    Storage is tried in this order: a host object with async get and set (window.storage), then
    localStorage, then memory. Every access is inside try and catch. A layer that fails later is
    left for the next one down, a 'persistence' event says so, and the layer is tried again on
    later saves.

  Export and import
    store.exportEnvelope()         {envelope, text, bytes, filename}
    store.inspect(text)            checks a file without changing anything
    store.importText(text, {onContentMismatch, allowContentMismatch, label})
                                   a promise for {ok: true, ...} or {ok: false, reason, message}.
                                   Order of checks: not empty, parses as JSON, is an envelope, app
                                   matches, schema is a whole number this page can read (older
                                   schemas go through the numbered migration steps in order, newer
                                   ones are refused), the data passes validate, then content_id.
                                   A failed import never changes the state. A good one is an undo step

  Other tabs and unreadable saves
    store.conflict()               set when another tab saved different data. Saving stops until
                                   store.resolveConflict('mine' | 'theirs') is called
    store.recovery()               set when the stored copy could not be read (for example it was
                                   written by a newer schema). It is left untouched and saving
                                   stops until store.discardStored() is called

  The only call that throws is create, and only for a mistake in its own arguments. Everything
  else returns a result object.
*/
(function (root) {
  'use strict';

  var VERSION = '1.0.0';
  var WORDS = {
    host: 'Saved in this app\'s storage',
    local: 'Saved in this browser',
    memory: 'Not saved: this page cannot store data here. Export to keep your work',
    loading: 'Opening saved data',
    conflict: 'Not saving: another tab changed this data. Choose which copy to keep',
    held: 'Not saving: the copy stored here could not be read and has been left as it was. Copy it out, or start fresh'
  };

  // ---------- small helpers ----------
  function msg(e) {
    try { return String((e && e.message) || e); } catch (x) { return 'unknown error'; }
  }
  function isPlain(v) {
    if (v === null || typeof v !== 'object' || Array.isArray(v)) return false;
    var p = Object.getPrototypeOf(v);
    return p === Object.prototype || p === null;
  }
  function whole(n) {
    return typeof n === 'number' && isFinite(n) && Math.floor(n) === n;
  }
  function thenable(v) {
    return !!v && typeof v.then === 'function';
  }
  // Run fn on a value now, or when it arrives if it is a promise. Keeps one code path for
  // storage that answers at once (localStorage, memory) and storage that answers later (a host).
  function when(v, fn) {
    return thenable(v) ? v.then(fn) : fn(v);
  }
  function utf8Bytes(text) {
    var n = 0, i, c;
    for (i = 0; i < text.length; i++) {
      c = text.charCodeAt(i);
      if (c < 0x80) n += 1;
      else if (c < 0x800) n += 2;
      else if (c >= 0xD800 && c <= 0xDBFF && i + 1 < text.length) { n += 4; i++; }
      else n += 3;
    }
    return n;
  }
  // Freeze a JSON value all the way down. Returns false if any part cannot be saved as JSON.
  function seal(value, depth) {
    var t = typeof value, i, keys, ok = true;
    if (value === null || t === 'string' || t === 'boolean') return true;
    if (t === 'number') return isFinite(value);
    if (depth > 100) return false;
    if (Array.isArray(value)) {
      for (i = 0; i < value.length; i++) if (!seal(value[i], depth + 1)) ok = false;
      Object.freeze(value);
      return ok;
    }
    if (isPlain(value)) {
      keys = Object.keys(value);
      for (i = 0; i < keys.length; i++) if (!seal(value[keys[i]], depth + 1)) ok = false;
      Object.freeze(value);
      return ok;
    }
    return false;
  }
  // The slow pass, run only after seal has said no, to name what is wrong and where.
  function unsafeParts(value, path, out, depth) {
    var t = typeof value, i, keys;
    if (out.length >= 5 || value === null || t === 'string' || t === 'boolean') return out;
    if (t === 'number') {
      if (!isFinite(value)) out.push(path + ' is not a finite number');
      return out;
    }
    if (depth > 100) { out.push(path + ' is nested too deeply or contains itself'); return out; }
    if (Array.isArray(value)) {
      for (i = 0; i < value.length; i++) unsafeParts(value[i], path + '[' + i + ']', out, depth + 1);
      return out;
    }
    if (isPlain(value)) {
      keys = Object.keys(value);
      for (i = 0; i < keys.length; i++) unsafeParts(value[keys[i]], path + '.' + keys[i], out, depth + 1);
      return out;
    }
    out.push(path + ' is ' + (t === 'object' ? 'an object that is not plain data' : (t === 'undefined' ? 'undefined' : 'a ' + t)) + ', which cannot be saved as JSON');
    return out;
  }
  function problemsOf(fn, data) {
    var out, i, list = [];
    if (typeof fn !== 'function') return list;
    try { out = fn(data); } catch (e) { return ['the validator threw: ' + msg(e)]; }
    if (!Array.isArray(out)) return ['the validator did not return a list of problems'];
    for (i = 0; i < out.length; i++) list.push(String(out[i]));
    return list;
  }
  function listed(problems) {
    var shown = problems.slice(0, 3).join('; ');
    return problems.length > 3 ? shown + '; and ' + (problems.length - 3) + ' more' : shown;
  }
  function fail(reason, message, extra) {
    var r = {ok: false, reason: reason, message: message}, k;
    if (extra) for (k in extra) if (Object.prototype.hasOwnProperty.call(extra, k)) r[k] = extra[k];
    return r;
  }
  function storageWhy(layerName, error) {
    var name = '', code = 0;
    try { name = String((error && error.name) || ''); code = Number((error && error.code) || 0); } catch (x) { name = ''; }
    if (name === 'QuotaExceededError' || name === 'NS_ERROR_DOM_QUOTA_REACHED' || code === 22 || code === 1014) {
      return layerName === 'host' ? 'this app\'s storage is full' : 'the browser\'s storage is full';
    }
    if (name === 'timeout') return 'this app\'s storage did not answer';
    return layerName === 'host' ? 'this app\'s storage refused the data' : 'the browser refused to store the data';
  }

  // ---------- storage layers ----------
  // Each layer answers {ok, value} to read and {ok, error} to write, and never throws.
  function memoryLayer() {
    var mem = {};
    return {
      name: 'memory',
      read: function (key) { return {ok: true, value: Object.prototype.hasOwnProperty.call(mem, key) ? mem[key] : null}; },
      write: function (key, text) { mem[key] = text; return {ok: true}; }
    };
  }
  function localLayer(ls) {
    return {
      name: 'local',
      read: function (key) {
        try { var v = ls.getItem(key); return {ok: true, value: typeof v === 'string' ? v : null}; } catch (e) { return {ok: false, error: e}; }
      },
      write: function (key, text) {
        try { ls.setItem(key, text); return {ok: true}; } catch (e) { return {ok: false, error: e}; }
      },
      probe: function (key) {
        try { ls.setItem(key, '1'); ls.removeItem(key); return true; } catch (e) { return false; }
      }
    };
  }
  function hostLayer(h, env, timeoutMs) {
    // Wrap a call that may throw, reject or never answer into a promise that always resolves.
    function settle(call) {
      return new Promise(function (resolve) {
        var done = false, timer = null;
        function finish(r) {
          if (done) return;
          done = true;
          if (timer !== null) { try { env.clearTimeout(timer); } catch (x) { timer = null; } }
          resolve(r);
        }
        try {
          timer = env.setTimeout(function () { finish({ok: false, error: {name: 'timeout'}}); }, timeoutMs);
          Promise.resolve(call()).then(function (v) { finish({ok: true, value: v}); }, function (e) { finish({ok: false, error: e}); });
        } catch (e) {
          finish({ok: false, error: e});
        }
      });
    }
    function textOf(v) {
      if (typeof v === 'string') return v;
      if (v && typeof v === 'object' && typeof v.value === 'string') return v.value;
      return null;
    }
    return {
      name: 'host',
      read: function (key) {
        return settle(function () { return h.get(key); }).then(function (r) {
          return r.ok ? {ok: true, value: textOf(r.value)} : {ok: false, error: r.error};
        });
      },
      write: function (key, text) {
        return settle(function () { return h.set(key, text); }).then(function (r) {
          return r.ok ? {ok: true} : {ok: false, error: r.error};
        });
