*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);font-size:15px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:rgba(var(--blue-rgb),.3)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--raised2);border-radius:20px}
::-webkit-scrollbar-track{background:transparent}
kbd{font-family:var(--mono);background:var(--raised);padding:1px 6px;border-radius:5px;font-size:11px}

/* ===== APP GRID (fixed viewport, no document scroll) ===== */
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:var(--topbar) 1fr var(--transport);overflow:hidden}
.app.no-transport{grid-template-rows:var(--topbar) 1fr 0}
.app.no-transport .transport{display:none}

/* ===== TOPBAR ===== */
.topbar{display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--border);
  background:var(--panel);z-index:30}
.icon-btn{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--tx-dim);
  background:var(--raised);border:1px solid var(--border);transition:all .15s;flex-shrink:0}
.icon-btn:hover{background:var(--raised2);color:var(--tx);border-color:var(--blue-deep)}
.icon-btn svg{width:19px;height:19px}
.crumb{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:13px;overflow:hidden}
.crumb .c-mod{color:var(--blue-glow);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44%}
.crumb .c-sep{color:var(--tx-faint);flex-shrink:0}
.crumb .c-page{color:var(--tx);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-progress{flex-shrink:0;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--tx-dim);font-family:var(--mono);font-weight:600}
.top-ring{width:26px;height:26px;flex-shrink:0}

/* ===== VIEWPORT + PAGES ===== */
.viewport{position:relative;overflow:hidden}
.page{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
@keyframes pgRight{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes pgLeft{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes pgUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.page.dir-right{animation:pgRight .32s var(--ease)}
.page.dir-left{animation:pgLeft .32s var(--ease)}
.page.dir-up{animation:pgUp .3s var(--ease)}
.page.dir-none{animation:none}

/* ===== HOME PAGE ===== */
.home{overflow-y:auto;padding:26px 22px 40px}
.home-hero{text-align:center;max-width:640px;margin:0 auto 26px}
.home-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:20px;background:var(--raised);border:1px solid var(--border);font-size:12px;color:var(--blue-glow);font-weight:600;margin-bottom:16px}
.home-badge .pulse{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
.home-hero h1{font-size:29px;font-weight:800;letter-spacing:-.5px;line-height:1.12;margin-bottom:10px}
.home-hero h1 .grad{color:var(--blue-glow)}
.home-hero p{font-size:14.5px;color:var(--tx-dim);line-height:1.55}
.home-cta{margin-top:20px}
.btn-primary{height:48px;padding:0 26px;border-radius:13px;font-size:15px;font-weight:700;background:var(--blue-deep);color:var(--on-accent);display:inline-flex;align-items:center;gap:10px;transition:all .18s var(--ease)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn-primary svg{width:18px;height:18px}
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:13px;max-width:900px;margin:0 auto}
.mod-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:17px;text-align:left;position:relative;overflow:hidden;transition:all .2s var(--ease)}
.mod-card::before{content:'';position:absolute;inset:0 auto 0 0;width:3px;background:var(--accent,var(--blue))}
.mod-card:hover{transform:translateY(-3px);border-color:var(--blue-deep);box-shadow:var(--shadow)}
.mod-card-top{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.mod-card-ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;background:var(--accent-bg,rgba(var(--blue-rgb),.14))}
.mod-card-ico svg{width:21px;height:21px;color:var(--accent,var(--blue-glow))}
.mod-card h3{font-size:15px;font-weight:700}
.mod-card .mc-sub{font-size:11.5px;color:var(--tx-faint);font-family:var(--mono);margin-top:2px}
.mod-card-foot{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--tx-faint);margin-top:11px}
.mc-prog{display:flex;align-items:center;gap:7px}
.mc-prog-bar{width:64px;height:5px;background:var(--raised);border-radius:20px;overflow:hidden}
.mc-prog-fill{height:100%;background:var(--accent,var(--blue));border-radius:20px;transition:width .5s}

/* ===== MODULE PAGE ===== */
.module{overflow-y:auto;padding:22px 20px 36px}
.module-head{max-width:760px;margin:0 auto 18px;display:flex;align-items:center;gap:14px}
.module-head .mh-ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--accent-bg,rgba(var(--blue-rgb),.14));flex-shrink:0}
.module-head .mh-ico svg{width:23px;height:23px;color:var(--accent,var(--blue-glow))}
.module-head h2{font-size:20px;font-weight:800;letter-spacing:-.3px}
.module-head p{font-size:13px;color:var(--tx-dim)}
.module-head .mh-play{margin-left:auto;flex-shrink:0}
.lesson-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:11px;max-width:760px;margin:0 auto}
.lcard{background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:14px 15px;text-align:left;display:flex;gap:12px;align-items:flex-start;transition:all .18s var(--ease)}
.lcard:hover{transform:translateY(-2px);border-color:var(--blue-deep);background:var(--raised)}
.lcard-num{width:28px;height:28px;border-radius:9px;background:var(--raised2);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--blue-glow);flex-shrink:0}
.lcard.done .lcard-num{background:rgba(var(--green-rgb),.16);color:var(--green)}
.lcard-body{min-width:0}
.lcard-title{font-size:13.5px;font-weight:600;color:var(--tx);line-height:1.25}
.lcard-tag{font-size:11px;color:var(--tx-faint);font-family:var(--mono);margin-top:3px}
.lcard-check{margin-left:auto;color:var(--green);opacity:0;flex-shrink:0}
.lcard-check svg{width:16px;height:16px}
.lcard.done .lcard-check{opacity:1}

/* ===== LESSON PLAYER: responsive (mobile stack / desktop two-column) ===== */
.lesson{height:100%;display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr auto;
  grid-template-areas:"head" "stage" "side";overflow:hidden}
.l-head{grid-area:head;padding:12px 18px 6px;display:flex;flex-direction:column;gap:2px}
.l-head .l-kick{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--blue-glow);font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px}
.l-head .l-kick .lk-mod{color:var(--tx-faint)}
.l-head h2{font-size:19px;font-weight:800;letter-spacing:-.3px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.l-stage{grid-area:stage;min-height:0;display:grid;place-items:center;padding:6px 16px;overflow:hidden}
.anim-canvas{width:100%;max-width:520px;max-height:100%;display:flex;align-items:center;justify-content:center}
.anim-canvas svg{max-height:100%;height:auto}
.l-side{grid-area:side;display:flex;flex-direction:column;gap:9px;min-height:0;
  padding:2px 16px calc(12px + env(safe-area-inset-bottom))}
.side-cap-wrap{display:flex;flex-direction:column;gap:9px}
.side-pips{display:flex;gap:6px;align-items:center;justify-content:center}
.dpip{width:8px;height:8px;border-radius:50%;background:var(--border);transition:all .25s}
.dpip.active{background:var(--blue);width:22px;border-radius:20px}
.dpip.past{background:var(--blue-deep)}
.side-caption{min-height:48px;display:flex;gap:11px;align-items:flex-start;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:11px 13px}
.dc-key{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--blue-glow);background:var(--code-bg);padding:4px 9px;border-radius:7px;flex-shrink:0;white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.dc-text{font-size:13.5px;color:var(--tx);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dc-text .hl{color:var(--blue-glow);font-weight:600}.dc-text b{font-weight:700}
.l-code{background:var(--code-bg);border:1px solid var(--border-soft);border-radius:11px;max-height:84px;overflow:auto;flex-shrink:0}
.l-code .cc-body{padding:8px 0;font-family:var(--mono);font-size:12.5px;line-height:1.55}
.l-code .code-line{display:flex;padding:0 14px}
.l-code .code-ln{color:var(--tx-faint);width:22px;flex-shrink:0;text-align:right;margin-right:12px;font-size:11px;user-select:none}
.l-code .code-txt{white-space:pre;color:var(--code-tx)}
.l-notes{display:none;flex-direction:column;gap:9px}
.side-chips{display:flex;gap:7px;flex-wrap:wrap}
.dchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:9px;background:var(--raised);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--tx-dim);transition:all .14s}
.dchip:hover{background:var(--raised2);color:var(--tx);border-color:var(--blue-deep)}
.dchip svg{width:14px;height:14px}
.dchip.purple{border-color:var(--purple);color:var(--purple)}

/* --- DESKTOP: two-column player, persistent rail --- */
@media (min-width:900px) and (min-height:560px){
  .lesson{grid-template-columns:1fr minmax(340px,420px);grid-template-rows:auto 1fr;
    grid-template-areas:"head side" "stage side";padding:0 clamp(0px,3vw,64px)}
  .l-head{padding:20px 8px 6px}
  .l-head h2{font-size:24px}
  .anim-canvas{max-width:680px}
  .l-side{border-left:1px solid var(--border);overflow-y:auto;justify-content:flex-start;
    padding:20px 6px 24px 22px;gap:14px}
  .side-caption{min-height:64px}
  .dc-text{-webkit-line-clamp:6;font-size:14.5px}
  .l-code{max-height:none}
  .l-notes{display:flex}
  .chip-notes{display:none}
  .side-order-cap{order:1}.side-order-notes{order:2}.side-order-code{order:3}.side-order-chips{order:4}
}

/* ===== TRANSPORT ===== */
.transport{display:flex;align-items:center;gap:11px;padding:0 14px;border-top:1px solid var(--border);
  background:var(--panel);z-index:30}
.tp-play{width:46px;height:46px;border-radius:14px;flex-shrink:0;background:var(--blue-deep);display:grid;place-items:center;transition:all .16s var(--ease)}
.tp-play:hover{transform:translateY(-2px)}
.tp-play svg{width:22px;height:22px;color:var(--on-accent)}
.tp-ic{width:40px;height:40px;border-radius:11px;flex-shrink:0;background:var(--raised);border:1px solid var(--border);display:grid;place-items:center;color:var(--tx-dim);transition:all .14s}
.tp-ic:hover{background:var(--raised2);color:var(--tx);border-color:var(--blue-deep)}
.tp-ic svg{width:17px;height:17px}
.tp-mid{flex:1;min-width:0}
.tp-meta{font-size:11.5px;color:var(--tx-dim);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-meta .auto-badge{color:var(--teal);font-weight:700}
.tp-meta .adot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal);animation:pulse 1.5s infinite;margin-right:4px;vertical-align:middle}
.tp-track{height:5px;background:var(--raised);border-radius:20px;overflow:hidden;margin-top:5px}
.tp-fill{height:100%;width:0;background:var(--blue);border-radius:20px;transition:width .3s var(--ease)}
.tp-speed{display:flex;background:var(--raised);border:1px solid var(--border);border-radius:11px;padding:3px;flex-shrink:0}
.tp-speed button{padding:6px 9px;border-radius:8px;font-size:11.5px;font-weight:700;color:var(--tx-dim);font-family:var(--mono);transition:all .12s}
.tp-speed button:hover{color:var(--tx)}
.tp-speed button.on{background:var(--blue-deep);color:var(--on-accent)}

/* ===== DRAWER (lesson nav) ===== */
.drawer{position:fixed;top:0;left:0;bottom:0;width:300px;max-width:86vw;background:var(--panel);border-right:1px solid var(--border);
  transform:translateX(-100%);visibility:hidden;transition:transform .3s var(--ease),visibility 0s .3s;z-index:80;display:flex;flex-direction:column}
.drawer.open{transform:none;visibility:visible;transition:transform .3s var(--ease);box-shadow:var(--shadow)}
.drawer-head{padding:16px 18px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:11px}
.drawer-head .dh-mark{width:36px;height:36px;border-radius:10px;background:var(--blue-deep);color:var(--on-accent);display:grid;place-items:center}
.drawer-head .dh-mark svg{width:19px;height:19px}
.drawer-head h3{font-size:14px;font-weight:700}
.drawer-head p{font-size:11px;color:var(--tx-dim)}
.drawer-scroll{flex:1;overflow-y:auto;padding:10px}
.dmod{margin-bottom:4px}
.dmod-head{width:100%;text-align:left;display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;font-size:12.5px;font-weight:650;transition:background .15s}
.dmod-head:hover{background:var(--raised)}
.dmod-num{width:22px;height:22px;border-radius:6px;background:var(--raised2);display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--blue-glow);font-family:var(--mono);flex-shrink:0}
.dmod-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmod-chev{width:15px;height:15px;color:var(--tx-faint);transition:transform .25s}
.dmod.open .dmod-chev{transform:rotate(90deg)}
.dmod-list{max-height:0;overflow:hidden;transition:max-height .3s var(--ease)}
.dmod.open .dmod-list{max-height:640px}
.ditem{width:calc(100% - 11px);text-align:left;display:flex;align-items:center;gap:9px;padding:7px 10px 7px 14px;margin:1px 0 1px 11px;border-left:2px solid var(--border-soft);border-radius:0 8px 8px 0;font-size:12px;color:var(--tx-dim);transition:all .14s}
.ditem:hover{background:var(--raised);color:var(--tx);border-left-color:var(--blue-deep)}
.ditem.active{background:rgba(var(--blue-rgb),.14);color:var(--blue-glow);border-left-color:var(--blue);font-weight:600}
.ditem-dot{width:6px;height:6px;border-radius:50%;background:var(--border);flex-shrink:0}
.ditem.done .ditem-dot{background:var(--green)}
.ditem.active .ditem-dot{background:var(--blue)}
.ditem-num{font-family:var(--mono);font-size:10px;color:var(--tx-faint);width:16px;flex-shrink:0}
.ditem-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:70;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.show{opacity:1;pointer-events:auto}

/* ===== SHEET (dialog for notes / output) ===== */
.sheet{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.sheet.show{pointer-events:auto}
.sheet-card{width:100%;max-width:560px;max-height:70dvh;background:var(--panel);border:1px solid var(--border);border-radius:20px 20px 0 0;
  transform:translateY(100%);transition:transform .32s var(--ease);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.sheet.show .sheet-card{transform:none}
.sheet-head{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--border-soft)}
.sheet-head h3{font-size:15px;font-weight:700;flex:1}
.sheet-head .icon-btn{width:34px;height:34px}
.sheet-body{overflow-y:auto;padding:16px 18px 26px}
@media(min-width:640px){
  .sheet{align-items:center}
  .sheet-card{border-radius:20px;max-height:76dvh;transform:translateY(20px) scale(.98);opacity:0;transition:all .3s var(--ease)}
  .sheet.show .sheet-card{transform:none;opacity:1}
}

/* callouts inside sheet */
.callout{border-radius:12px;padding:13px 15px;margin-bottom:11px;display:flex;gap:12px;font-size:13.5px;line-height:1.5}
.callout:last-child{margin-bottom:0}
.callout svg{width:19px;height:19px;flex-shrink:0;margin-top:1px}
.callout b{font-weight:700}
.callout.why{background:rgba(var(--blue-rgb),.09);border:1px solid rgba(var(--blue-rgb),.28)}
.callout.why svg{color:var(--blue-glow)}
.callout.trap{background:rgba(var(--amber-rgb),.08);border:1px solid rgba(var(--amber-rgb),.28)}
.callout.trap svg{color:var(--amber)}.callout.trap b{color:var(--amber)}
.callout.rubric{background:rgba(var(--purple-rgb),.09);border:1px solid rgba(var(--purple-rgb),.28)}
.callout.rubric svg{color:var(--purple)}.callout.rubric b{color:var(--purple)}
.callout-txt{color:var(--tx-dim)}.callout-txt strong{color:var(--tx)}
.out-pre{background:var(--code-bg);border:1px solid var(--border-soft);border-radius:11px;padding:13px;font-family:var(--mono);font-size:12.5px;color:var(--teal);white-space:pre-wrap;line-height:1.5}

/* toast */
.toast{position:fixed;bottom:calc(var(--transport) + 14px);left:50%;transform:translateX(-50%) translateY(220px);background:var(--raised2);border:1px solid var(--blue-deep);color:var(--tx);padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:9px;box-shadow:var(--shadow);z-index:100;transition:transform .4s var(--ease);pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast svg{width:17px;height:17px;color:var(--green)}

/* ===== responsive fit ===== */
@media(max-height:620px){
  :root{--topbar:48px}

}

<script>
/* =====================================================================
   PERCEPT ANIMATED-COURSE ENGINE  (page-based, responsive, autoplay)
   ---------------------------------------------------------------------
   PERCEPT fills COURSE, MODULES and LESSONS below for the chosen subject.
   Everything under "=== END COURSE DATA ===" is the generic engine. Do
   not edit it. The demo below is a live gallery: one lesson per renderer.
   Lesson schema:
     { m:moduleIndex, tag:'label', title:'...', sub:'one sentence',
       example:['line',...], lang:'code'|'text', exLabel:'Example',   // optional
       steps:[{k:'key', t:'html <b> <span class=hl>'}],               // 2 to 4 beats
       why:'', trap:'', insight:'',                                    // optional callouts
       caveat:'',                                                      // optional: what in this lesson is not verified, shown to the learner
       anim:{ r:'rendererName', ...params } }   // see animation-catalogue.md
   accent / color fields: a tone name (blue teal purple green amber red pink), which
   follows the reader's theme, or a six-digit hex, which stays fixed in every theme.
   COURSE.theme (optional): 'auto' | 'paper' | 'mist' | 'dusk' | 'midnight'. The starting theme
   until the reader picks one. Leave it out for auto (light, or dark if the device asks).
   CUSTOM_RENDERERS (optional): { name:{ build(anim), update(root,anim,step,total) } }.
   beats = steps.length. Each step reveals one visual chunk AND lights one line.
   ===================================================================== */
const COURSE = { title:"PERCEPT Demo", subtitle:"one animation per idea", totalTarget:64 };

const MODULES = [
  {n:1,title:"Structures",   sub:"how ideas are arranged", icon:"book",  accent:"blue"},
  {n:2,title:"Comparisons",  sub:"telling things apart",    icon:"scale", accent:"teal"},
  {n:3,title:"Change & Flow", sub:"process over time",       icon:"flow",  accent:"purple"},
  {n:4,title:"Quantities",   sub:"showing the numbers",      icon:"chart", accent:"pink"},
];

const LESSONS = [
  /* ---- M1 Structures ---- */
  {m:0,tag:'reveal',title:'A list of ideas, one at a time',
   sub:'The simplest animation: reveal points in sequence so each lands on its own.',
   steps:[{k:'first',t:'Show the <b>first</b> point alone.'},
          {k:'second',t:'Add the <b>second</b>: the eye follows.'},
          {k:'third',t:'Then the <span class="hl">third</span>. Nothing is dumped at once.'}],
   why:'Sequential reveal controls attention: the learner reads exactly what you are talking about.',
   anim:{r:'reveal',items:[{t:'Point one',d:'the setup'},{t:'Point two',d:'the build'},{t:'Point three',d:'the payoff'}]}},

  {m:0,tag:'hierarchy',title:'A dependency structure',
   sub:'When ideas unlock other ideas, draw the graph so the order is visible.',
   example:['A skill tree is a dependency graph','where each node unlocks only after','its prerequisites are mastered.'],
   lang:'text',exLabel:'The core idea',
   steps:[{k:'roots',t:'Start from the <b>roots</b>: no prerequisites.'},
          {k:'branch',t:'Each edge means "you need that <b>first</b>".'},
          {k:'top',t:'The <span class="hl">top</span> node needs everything below it.'}],
   insight:'A picture of prerequisites tells the learner what to study before what.',
   anim:{r:'hierarchy',nodes:['Basics','Core A','Core B','Advanced'],edges:[[0,1],[0,2],[1,3],[2,3]],caption:'unlock order'}},

  {m:0,tag:'stack',title:'Layers building up',
   sub:'Some concepts are strata: each layer rests on the one below.',
   steps:[{k:'base',t:'The <b>foundation</b> layer goes down first.'},
          {k:'mid',t:'The middle layer <b>depends</b> on it.'},
          {k:'top',t:'The top layer is what users <span class="hl">see</span>.'}],
   anim:{r:'stack',layers:[{t:'Hardware',d:'physical'},{t:'OS',d:'system'},{t:'App',d:'visible'}],caption:'a layered model'}},

  {m:0,tag:'grid',title:'A matrix of values',
   sub:'When two dimensions cross, a grid reveals the whole table cell by cell.',
   steps:[{k:'rows',t:'Rows are one dimension.'},
          {k:'cols',t:'Columns are the other.'},
          {k:'cells',t:'Each <span class="hl">cell</span> is their intersection.'}],
   anim:{r:'grid',cols:['Low','High'],rowLabels:['Cheap','Costly'],cells:[['ok','best'],['avoid','risky']],caption:'a 2×2 framing'}},

  /* ---- M2 Comparisons ---- */
  {m:1,tag:'compare',title:'A versus B',
   sub:'Most confusion is two neighbours blurred together. Separate them cleanly.',
   steps:[{k:'A',t:'The first concept, in its own terms.'},
          {k:'B',t:'The second, defined by how it <b>differs</b>.'},
          {k:'tell',t:'The one row that <span class="hl">settles</span> it.'}],
   trap:'Exams punish conflating these two. The distinguishing row is the whole game.',
   anim:{r:'compare',a:'Business Intelligence',b:'Data Science',
     rows:[['Looks at','the past','the future'],['Data','structured','mixed'],['Output','a report','a prediction']]}},

  {m:1,tag:'venn',title:'Overlapping sets',
   sub:'Two circles show what is shared and what is unique in one glance.',
   steps:[{k:'left',t:'The first set of things.'},
          {k:'right',t:'The second set.'},
          {k:'overlap',t:'The <span class="hl">overlap</span> is where they meet.'}],
   anim:{r:'venn',sets:[{label:'Statistics'},{label:'Computing'}],overlap:'Data Science',caption:'where fields meet'}},

  {m:1,tag:'bars',title:'Ranked bars',

const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const esc=s=>textHTML(s);
/* ---------- theme-aware colours ----------
   C holds the active theme's colours as six-digit hex, read from the CSS tokens.
   Renderers append a two-digit alpha suffix in places, so these must stay six-digit hex.
   The literals below are the default theme and are only used if the tokens cannot be read. */
const TONES=['blue','teal','purple','green','amber','red','pink'];
const LEGACY_TONE={'#5b9dff':'blue','#2dd4bf':'teal','#a78bfa':'purple','#4ade80':'green','#fbbf24':'amber','#f87171':'red','#f472b6':'pink'};
const C={blue:'#1B56B0',teal:'#0B6B63',purple:'#6336B8',green:'#145C30',amber:'#854F00',red:'#B42318',pink:'#A8235F',dim:'#5C5147',faint:'#6B6055',bd:'#D6CBB9',bdOff:'#E6DDCF'};
/* Plain fields are text. Colour fields accept only the documented palette/hex contract. */
function safeColor(v,fallback=C.blue){const s=String(v==null?'':v);return TONES.includes(s)?C[s]:(/^#[0-9a-fA-F]{6}$/.test(s)?s:fallback);}
function readTokens(){
  try{const cs=getComputedStyle(document.documentElement);
    const g=(n,f)=>{const v=(cs.getPropertyValue(n)||'').trim();return /^#[0-9a-fA-F]{6}$/.test(v)?v:f;};
    TONES.forEach(t=>{C[t]=g('--'+t,C[t]);});
    C.dim=g('--tx-dim',C.dim);C.faint=g('--tx-faint',C.faint);C.bd=g('--border',C.bd);C.bdOff=g('--border-soft',C.bdOff);
  }catch(e){}
}
/* accent and color fields in the course data may be a tone name (preferred) or a six-digit hex.
   Tone names follow the active theme. The authored value is kept so a theme change can resolve it again. */
function resolveTones(){
  const toneOf=v=>{const s=String(v).toLowerCase();return TONES.includes(s)?s:(LEGACY_TONE[s]||null);};
  const fix=o=>{if(!o||typeof o!=='object')return;if(Array.isArray(o)){o.forEach(fix);return;}
    ['accent','color'].forEach(k=>{const kk='_'+k;if(o[kk]===undefined&&typeof o[k]==='string')o[kk]=o[k];
      if(typeof o[kk]==='string'){const tn=toneOf(o[kk]);o[k]=tn?C[tn]:safeColor(o[kk]);}});
    Object.keys(o).forEach(k=>{if(k[0]!=='_')fix(o[k]);});};
  MODULES.forEach((m,i)=>{if(typeof m.accent!=='string'&&m._accent===undefined)m._accent=TONES[i%TONES.length];});
  fix(MODULES);fix(LESSONS);
}

/* ---------- display settings: theme and motion, selectable, saved, resettable ---------- */
const THEME_OPTS=[['auto','Auto','follows this device'],['paper','Paper','warm light'],['mist','Mist','cool light'],['dusk','Dusk','warm dark'],['midnight','Midnight','navy dark']];
const MOTION_OPTS=[['auto','Auto','follows this device'],['full','Full',''],['reduced','Reduced','near-instant transitions']];
const DEFAULT_THEME=THEME_OPTS.some(o=>o[0]===COURSE.theme)?COURSE.theme:'auto';
const PREFS={theme:DEFAULT_THEME,motion:'auto'};
const PREFS_KEY='percept:prefs';
function applyPrefs(){
  const r=document.documentElement;
  if(PREFS.theme==='auto')r.removeAttribute('data-percept-theme');else r.setAttribute('data-percept-theme',PREFS.theme);
  if(PREFS.motion==='auto')r.removeAttribute('data-percept-motion');else r.setAttribute('data-percept-motion',PREFS.motion);
  readTokens();resolveTones();
}
function readPrefs(raw){try{const p=JSON.parse(raw);
  if(p&&THEME_OPTS.some(o=>o[0]===p.theme))PREFS.theme=p.theme;
  if(p&&MOTION_OPTS.some(o=>o[0]===p.motion))PREFS.motion=p.motion;}catch(e){}}
async function savePrefs(){const d=JSON.stringify(PREFS);
  try{if(window.storage&&window.storage.set){await window.storage.set(PREFS_KEY,d);return;}}catch(e){}
  try{localStorage.setItem(PREFS_KEY,d);}catch(e){}}
async function restorePrefs(){
  try{if(window.storage&&window.storage.get){const r=await window.storage.get(PREFS_KEY);if(r&&r.value){readPrefs(r.value);return;}}}catch(e){}
  try{const r=localStorage.getItem(PREFS_KEY);if(r)readPrefs(r);}catch(e){}}
function setPref(k,v){
  if(!(k==='theme'?THEME_OPTS:k==='motion'?MOTION_OPTS:[]).some(o=>o[0]===v))return;
  PREFS[k]=v;applyPrefs();rerender();savePrefs();
}
function resetPrefs(){PREFS.theme=DEFAULT_THEME;PREFS.motion='auto';applyPrefs();rerender();savePrefs();}
function rerender(){
  if(ST.view==='lesson'&&ST.cur>=0){const cv=$('#animCanvas');if(cv&&curRend){cv.innerHTML=curRend.build(LESSONS[ST.cur].anim);applyStep(ST.step);}}
  else if(ST.view==='module')goModule(ST.mod,'none');
  else goHome('none');
}
function openSettings(){
  const grp=(key,legend,opts)=>`<fieldset class="set-group"><legend>${legend}</legend>${opts.map(o=>`<label class="set-opt"><input type="radio" name="set-${key}" value="${o[0]}" ${PREFS[key]===o[0]?'checked':''}><span class="set-name">${o[1]}</span>${o[2]?`<span class="set-note">${o[2]}</span>`:''}</label>`).join('')}</fieldset>`;
  $('#sheetTitle').textContent='Display';
  $('#sheetBody').innerHTML=grp('theme','Theme',THEME_OPTS)+grp('motion','Motion',MOTION_OPTS)+'<button class="set-reset" id="setReset" type="button">Reset to defaults</button>';
  $$('#sheetBody input[type=radio]').forEach(i=>{i.onchange=()=>{if(i.checked)setPref(i.name.slice(4),i.value);};});
  $('#setReset').onclick=()=>{resetPrefs();openSettings();};
  const sh=$('#sheet');sh.classList.add('show');sh.setAttribute('aria-hidden','false');sh.dataset.kind='settings';
  const cur=$('#sheetBody input:checked');
  if(cur){void getComputedStyle(cur).visibility;cur.focus();if(document.activeElement!==cur)setTimeout(()=>cur.focus(),60);}
}
try{const r=localStorage.getItem(PREFS_KEY);if(r)readPrefs(r);}catch(e){}
applyPrefs();
try{const dq=window.matchMedia('(prefers-color-scheme: dark)');const onScheme=()=>{if(PREFS.theme==='auto'){applyPrefs();rerender();}};
  (dq.addEventListener?dq.addEventListener('change',onScheme):dq.addListener(onScheme));}catch(e){}

/* ---------- Python-ish syntax highlighter (used when lang==='code') ---------- */
const KW=new Set(['import','from','as','def','return','if','else','elif','for','in','while','and','or','not','True','False','None','lambda','with','class','print','let','const','var','function','new','function']);
function hl(line){
  const ci=line.indexOf('#');let code=line,com='';
  if(ci>=0){const b=line.slice(0,ci);if((b.match(/"/g)||[]).length%2===0&&(b.match(/'/g)||[]).length%2===0){code=line.slice(0,ci);com=line.slice(ci);}}
  let out='';const toks=code.split(/(\s+|[=+\-*/<>!%|&\[\]\(\)\{\},:.])/);
  for(let i=0;i<toks.length;i++){let t=toks[i];if(t==='')continue;
    if(/^\s+$/.test(t)){out+=t;continue;}
    if(/^["']/.test(t)){out+=`<span class="tok-str">${esc(t)}</span>`;continue;}
    if(/^\d/.test(t)){out+=`<span class="tok-num">${esc(t)}</span>`;continue;}
    if(KW.has(t)){out+=`<span class="tok-kw">${esc(t)}</span>`;continue;}
    if(/^[=+\-*/<>!%|&,:]$/.test(t)||t==='.'){out+=`<span class="tok-op">${esc(t)}</span>`;continue;}
    const nxt=toks[i+1];const prev=toks.slice(0,i).reverse().find(x=>x.trim()!=='');
    if(nxt==='('){out+=`<span class="tok-fn">${esc(t)}</span>`;continue;}
    if(prev==='.'){out+=`<span class="tok-attr">${esc(t)}</span>`;continue;}
    out+=`<span class="tok-var">${esc(t)}</span>`;}
  if(com)out+=`<span class="tok-com">${esc(com)}</span>`;
  return out;
}

/* ===================== RENDERERS =====================
   contract: REND[name] = { build(anim)->html, update(root,anim,step,total) }
   step = current beat (0..total).  Reveal items with index < mapped(step). */
function mapCount(n,step,total){ if(step>=total)return n; return Math.max(0,Math.round(n*step/Math.max(1,total))); }
function revealN(root,n){root.querySelectorAll('[data-i]').forEach(e=>{const i=+e.dataset.i;const on=i<n;e.style.opacity=on?1:.16;e.style.transform=on?'none':(e.dataset.tf||'translateY(8px)');if(e.dataset.cur!==undefined)e.classList.toggle('is-cur',i===n-1);});}

    if(i>0)h+=`<div data-i="${i}" data-tf="scale(.6)" style="opacity:0;transition:all .35s;color:${C.faint};font-size:20px">→</div>`;
    h+=`<div data-i="${i}" data-cur style="opacity:0;transition:all .4s var(--ease);padding:11px 15px;background:var(--raised);border:1px solid var(--border);border-radius:11px;text-align:center;min-width:82px">
      <div style="font-size:13px;font-weight:600;color:var(--tx)">${esc(t)}</div>${d?`<div style="font-size:11px;color:var(--tx-dim);margin-top:2px">${esc(d)}</div>`:''}</div>`;});
  return h+'</div>'+(a.loop?cap('↺ often a loop: the end feeds the start'):'');},
  update:(r,a,s,t)=>{revealN(r,mapCount((a.stages||[]).length,s,t));r.querySelectorAll('.is-cur').forEach(e=>{e.style.borderColor=safeColor(a.accent,C.blue);e.style.boxShadow=`0 0 0 1px ${safeColor(a.accent,C.blue)}`;});}},

/* 4. CYCLE: circular stages */
cycle:{build:(a)=>`<div id="cyc"></div>`,
  update:(r,a,s,t)=>{const st=a.stages||[];const n=st.length;const R=88,cx=150,cy=130;const show=mapCount(n,s,t);
    let g='';for(let i=0;i<n;i++){const ang=-Math.PI/2+i*2*Math.PI/n;const x=cx+R*Math.cos(ang),y=cy+R*Math.sin(ang);const on=i<show;const t2=typeof st[i]==='string'?st[i]:st[i].t;
      if(i>0||n>1){const a2=-Math.PI/2+(i-0.02)*2*Math.PI/n;}
      g+=`<g opacity="${on?1:.2}" style="transition:opacity .4s"><circle cx="${x}" cy="${y}" r="26" fill="var(--raised)" stroke="${on?(safeColor(a.accent,C.blue)):C.bd}" stroke-width="2"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="10" fill="var(--tx)" font-family="var(--mono)">${esc(String(t2).slice(0,7))}</text></g>`;}
    // arrows between
    for(let i=0;i<n;i++){const a1=-Math.PI/2+i*2*Math.PI/n,a2=-Math.PI/2+(i+1)*2*Math.PI/n;const x1=cx+(R)*Math.cos(a1+0.5),y1=cy+(R)*Math.sin(a1+0.5);}
    const arrows=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${C.bd}" stroke-dasharray="4 5"/>`;
    r.querySelector('#cyc').innerHTML=svgWrap(arrows+g,300,260)+cap(a.caption||'a repeating cycle');}},

/* 5. TIMELINE */
timeline:{build:(a)=>`<div id="tl"></div>`,
  update:(r,a,s,t)=>{const ev=a.events||[];const n=ev.length;const show=mapCount(n,s,t);const W=470,pad=30,y=110;
    let g=`<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="${C.bd}" stroke-width="2"/>`;
    ev.forEach((e,i)=>{const x=pad+(W-2*pad)*(n===1?0.5:i/(n-1));const on=i<show;const up=i%2===0;const t2=typeof e==='string'?e:e.t;const d=typeof e==='string'?'':(e.d||'');
      g+=`<g opacity="${on?1:.2}" style="transition:opacity .4s"><circle cx="${x}" cy="${y}" r="6" fill="${on?(safeColor(a.accent,C.blue)):C.bd}"/>
        <line x1="${x}" y1="${y}" x2="${x}" y2="${up?y-30:y+30}" stroke="${C.bd}" stroke-width="1.5"/>
        <text x="${x}" y="${up?y-38:y+46}" text-anchor="middle" font-size="10.5" fill="var(--tx)" font-family="var(--sans)">${esc(t2)}</text>
        ${d?`<text x="${x}" y="${up?y-24:y+60}" text-anchor="middle" font-size="9.5" fill="${C.faint}" font-family="var(--mono)">${esc(d)}</text>`:''}</g>`;});
    r.querySelector('#tl').innerHTML=svgWrap(g,W,200)+cap(a.caption||'events in order');}},

/* 6. HIERARCHY: layered tree/pyramid */
hierarchy:{build:(a)=>`<div id="hi"></div>`,
  update:(r,a,s,t)=>{const nodes=a.nodes||[];const edges=a.edges||[];const n=nodes.length;
    // level by longest path from a root
    const lvl=nodes.map(()=>0);let changed=true,guard=0;
    while(changed&&guard++<50){changed=false;edges.forEach(([u,v])=>{if(lvl[v]<lvl[u]+1){lvl[v]=lvl[u]+1;changed=true;}});}
    const maxL=Math.max(0,...lvl);const byL={};lvl.forEach((L,i)=>{(byL[L]=byL[L]||[]).push(i);});
    const W=460,H=60+maxL*70,pad=40;const pos=[];
    for(let L=0;L<=maxL;L++){const row=byL[L]||[];row.forEach((idx,k)=>{const x=pad+(W-2*pad)*((k+1)/(row.length+1));const y=40+L*70;pos[idx]={x,y};});}
    const show=mapCount(n,s,t);
    let g='';edges.forEach(([u,v])=>{if(pos[u]&&pos[v]){const on=u<show&&v<show;g+=`<line x1="${pos[u].x}" y1="${pos[u].y+14}" x2="${pos[v].x}" y2="${pos[v].y-14}" stroke="${on?C.bd:C.bdOff}" stroke-width="1.6" opacity="${on?1:.3}" style="transition:opacity .4s"/>`;}});
    nodes.forEach((nd,i)=>{if(!pos[i])return;const on=i<show;const w=Math.max(54,String(nd).length*7+18);
      g+=`<g opacity="${on?1:.2}" style="transition:opacity .4s"><rect x="${pos[i].x-w/2}" y="${pos[i].y-14}" width="${w}" height="28" rx="8" fill="var(--raised)" stroke="${on?(safeColor(a.accent,C.blue)):C.bd}" stroke-width="1.8"/><text x="${pos[i].x}" y="${pos[i].y+4}" text-anchor="middle" font-size="10.5" fill="var(--tx)" font-family="var(--sans)">${esc(nd)}</text></g>`;});
    r.querySelector('#hi').innerHTML=svgWrap(g,W,H+20)+cap(a.caption||'a dependency structure');}},

/* 7. NUMBERLINE: scale with markers/fences/regions */
numberline:{build:(a)=>`<div id="nl"></div>`,
  update:(r,a,s,t)=>{const W=470,pad=34,y=95;const line=W-2*pad;const marks=a.marks||[];const regions=a.regions||[];
    const X=v=>pad+clamp(v,0,1)*line;const show=mapCount(marks.length,s,t);
    let g=`<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" class="axis-line"/>`;
    regions.forEach((rg,i)=>{if(i<show)g+=`<rect x="${X(rg.from)}" y="${y-8}" width="${X(rg.to)-X(rg.from)}" height="16" fill="${(safeColor(rg.color,C.blue))}22"/>`;});
    marks.forEach((m,i)=>{const on=i<show;const col=safeColor(m.color,C.blue);const x=X(m.at);
      g+=`<g opacity="${on?1:.2}" style="transition:opacity .4s"><line x1="${x}" y1="${y-11}" x2="${x}" y2="${y+11}" stroke="${col}" stroke-width="2.5" ${m.dash?'stroke-dasharray="4 3"':''}/><text x="${x}" y="${y-18}" text-anchor="middle" font-size="10.5" fill="${col}" font-family="var(--mono)">${esc(m.label||'')}</text></g>`;
      if(m.outlier&&on)g+=`<circle cx="${x}" cy="${y}" r="5" fill="${C.red}"/>`;});
    r.querySelector('#nl').innerHTML=svgWrap(g,W,180)+cap(a.caption||'');}},

/* 8. BARS */
bars:{build:(a)=>`<div id="ba"></div>`,
  update:(r,a,s,t)=>{const data=a.data||[];const mx=Math.max(...data.map(d=>d[1]),1)*1.15;const W=460,H=210,pad=34;const slot=(W-2*pad)/data.length;const bw=slot*0.62,gap=slot*0.38;const show=mapCount(data.length,s,t);
    let g=`<line x1="${pad}" y1="${H-24}" x2="${W-8}" y2="${H-24}" class="axis-line"/>`;
    // optional sort at final
    let arr=data.map((d,i)=>({d,i}));
    data.forEach((d,i)=>{const on=i<show;const grow=on?d[1]/mx:0;const bh=(H-58)*grow;const x=pad+i*slot+gap/2;const y=H-24-bh;const top=a.highlightTop&&on&&([...data].sort((p,q)=>q[1]-p[1]).slice(0,a.highlightTop).includes(d));
      g+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="3" fill="${top?C.teal:(safeColor(a.accent,C.blue))}" style="transition:all .5s var(--ease) ${i*.05}s"/>
        <text x="${x+bw/2}" y="${H-8}" text-anchor="middle" class="axis-lbl">${esc(d[0])}</text>${on?`<text x="${x+bw/2}" y="${y-5}" text-anchor="middle" class="val-lbl" style="font-size:10px">${esc(d[1])}</text>`:''}`;});
    r.querySelector('#ba').innerHTML=svgWrap(g,W,H)+cap(a.caption||'');}},

/* 9. PLOT: scatter/line + optional trendline */
plot:{build:(a)=>`<div id="pl"></div>`,
  update:(r,a,s,t)=>{const pts=a.points||[];const W=460,H=210,pad=36;const show=mapCount(pts.length,s,t);
    let g=`<line x1="${pad}" y1="${H-26}" x2="${W-10}" y2="${H-26}" class="axis-line"/><line x1="${pad}" y1="10" x2="${pad}" y2="${H-26}" class="axis-line"/>`;
    if(a.xlabel)g+=`<text x="${W/2}" y="${H-6}" text-anchor="middle" class="axis-lbl">${esc(a.xlabel)}</text>`;
    pts.forEach((p,i)=>{const on=i<show;const x=pad+p[0]*(W-pad-20),y=(H-26)-p[1]*(H-46);g+=`<circle cx="${x}" cy="${y}" r="5" fill="${safeColor(a.accent,C.blue)}" opacity="${on?1:.15}" style="transition:opacity .4s ${i*.03}s"/>`;});
    if(a.trend&&show>=pts.length)g+=`<line x1="${pad}" y1="${(H-26)-a.trend[0]*(H-46)}" x2="${W-10}" y2="${(H-26)-a.trend[1]*(H-46)}" stroke="${C.teal}" stroke-width="2" stroke-dasharray="5 4"/>${a.trendLabel?`<text x="${W-70}" y="40" class="axis-lbl" fill="${C.teal}">${esc(a.trendLabel)}</text>`:''}`;
    r.querySelector('#pl').innerHTML=svgWrap(g,W,H)+cap(a.caption||'');}},

/* 10. TRANSFORM: before → after */
transform:{build:(a)=>`<div id="tr"></div>`,
  update:(r,a,s,t)=>{const showAfter=s>=Math.ceil(t*0.6);const showArrow=s>=Math.ceil(t*0.35);
    const card=(label,body,col)=>`<div style="padding:14px 18px;background:var(--raised);border-radius:12px;border:1px solid ${safeColor(col,C.dim)}55;min-width:120px;text-align:center"><div style="font-size:11px;color:${safeColor(col,C.dim)};text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">${esc(label)}</div><div style="font-family:var(--mono);font-size:13px;color:var(--tx)">${body}</div></div>`;
    const h=`<div style="display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap">
      ${card(a.beforeLabel||'before',esc(a.before||'?'),C.dim)}
      <div style="color:${safeColor(a.accent,C.blue)};font-size:24px;opacity:${showArrow?1:.2};transition:opacity .4s">→</div>
      <div style="opacity:${showAfter?1:.15};transition:opacity .4s">${card(a.afterLabel||'after',esc(a.after||'?'),safeColor(a.accent,C.teal))}</div></div>`;
    r.querySelector('#tr').innerHTML=h+(a.op?cap(a.op):'');}},

/* 11. GRID: matrix cells reveal */
grid:{build:(a)=>{const rows=a.cells||[];const cols=a.cols||(rows[0]||[]).map((_,i)=>'C'+i);
  let h='<div style="overflow-x:auto"><table class="df-table" style="margin:0 auto"><thead><tr>';
  if(a.rowLabels)h+='<th></th>';cols.forEach(c=>h+=`<th>${esc(c)}</th>`);h+='</tr></thead><tbody>';
  let idx=0;rows.forEach((row,ri)=>{h+='<tr>';if(a.rowLabels)h+=`<th style="text-align:left">${esc(a.rowLabels[ri]||'')}</th>`;
    row.forEach((v,ci)=>{h+=`<td data-i="${idx++}" style="opacity:0;transition:all .3s;text-align:center">${esc(v)}</td>`;});h+='</tr>';});
  return h+'</tbody></table></div>'+(a.caption?cap(a.caption):'');},
  update:(r,a,s,t)=>{const total=r.querySelectorAll('[data-i]').length;revealN(r,mapCount(total,s,t));}},

/* 12. DIAGRAM: base figure + labelled callouts */
diagram:{build:(a)=>`<div id="dg"></div>`,
  update:(r,a,s,t)=>{const W=460,H=240;const parts=a.parts||[];const show=mapCount(parts.length,s,t);
    let g=a.base||`<rect x="140" y="70" width="180" height="100" rx="14" fill="var(--raised)" stroke="${C.bd}" stroke-width="2"/>`;
    parts.forEach((p,i)=>{const on=i<show;g+=`<g opacity="${on?1:.15}" style="transition:opacity .4s"><circle cx="${esc(p.x)}" cy="${esc(p.y)}" r="5" fill="${safeColor(a.accent,C.blue)}"/><line x1="${esc(p.x)}" y1="${esc(p.y)}" x2="${esc(p.lx)}" y2="${esc(p.ly)}" stroke="${C.bd}" stroke-width="1.4"/><text x="${esc(p.lx)}" y="${esc(p.ly+(p.ly<p.y?-6:14))}" text-anchor="${esc(p.anchor||'middle')}" font-size="11" fill="var(--tx)" font-family="var(--sans)">${esc(p.label)}</text></g>`;});
    r.querySelector('#dg').innerHTML=svgWrap(g,W,H)+(a.caption?cap(a.caption):'');}},

/* 13. BIGNUM: headline number(s) */
bignum:{build:(a)=>`<div id="bn"></div>`,
  update:(r,a,s,t)=>{const nums=a.nums||[];const show=mapCount(nums.length,s,t);
    let h='<div style="display:flex;gap:26px;justify-content:center;align-items:center;flex-wrap:wrap">';
    nums.forEach((nm,i)=>{const on=i<show;if(i>0)h+=`<div style="font-size:22px;color:${C.faint}">${esc(a.sep||'·')}</div>`;
      h+=`<div style="text-align:center;opacity:${on?1:.15};transition:all .4s"><div style="font-family:var(--mono);font-size:40px;font-weight:800;color:${safeColor(nm.color,safeColor(a.accent,C.blue))}">${on?esc(nm.v):'-'}</div><div style="font-size:12px;color:var(--tx-dim);margin-top:4px">${esc(nm.label||'')}</div></div>`;});
    r.querySelector('#bn').innerHTML=h+'</div>'+(a.caption?cap(a.caption):'');}},

/* 14. VENN: 2 or 3 sets */
venn:{build:(a)=>`<div id="vn"></div>`,
  update:(r,a,s,t)=>{const three=(a.sets||[]).length>=3;const W=460,H=240;const acc=safeColor(a.accent,C.blue);
    const sets=a.sets||[{label:'A'},{label:'B'}];const show=mapCount(sets.length+1,s,t);
    let g='';const cols=[C.blue,C.pink,C.teal];
    const circ=(cx,cy,i)=>`<circle cx="${cx}" cy="${cy}" r="70" fill="${cols[i]}22" stroke="${cols[i]}" stroke-width="2" opacity="${i<show?1:.15}" style="transition:opacity .4s"/><text x="${cx}" y="${cy-52}" text-anchor="middle" font-size="12" fill="${cols[i]}" font-family="var(--sans)" opacity="${i<show?1:.15}">${esc(sets[i]?sets[i].label:'')}</text>`;
    if(!three){g+=circ(180,120,0)+circ(280,120,1);if(show>2&&a.overlap)g+=`<text x="230" y="124" text-anchor="middle" font-size="10.5" fill="var(--tx)" font-family="var(--mono)">${esc(a.overlap)}</text>`;}
    else{g+=circ(200,100,0)+circ(260,100,1)+circ(230,160,2);}
    r.querySelector('#vn').innerHTML=svgWrap(g,W,H)+(a.caption?cap(a.caption):'');}},

/* 15. STACK: layers building up */
stack:{build:(a)=>{const layers=a.layers||[];const n=layers.length;
  return `<div style="display:flex;flex-direction:column-reverse;gap:5px;max-width:360px;margin:0 auto;width:100%">`+
    layers.map((L,i)=>{const t=typeof L==='string'?L:L.t;const d=typeof L==='string'?'':(L.d||'');const col=safeColor((typeof L==='object'&&L.color)||a.accent,C.blue);
      return `<div data-i="${i}" data-tf="translateY(14px)" style="opacity:0;transition:all .4s var(--ease);padding:11px 15px;background:var(--raised);border-radius:9px;border-left:4px solid ${col};display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:13px;font-weight:600;color:var(--tx)">${esc(t)}</span>${d?`<span style="font-size:11px;color:var(--tx-dim);font-family:var(--mono)">${esc(d)}</span>`:''}</div>`;}).join('')+`</div>`+(a.caption?cap(a.caption):'');},
  update:(r,a,s,t)=>revealN(r,mapCount((a.layers||[]).length,s,t))},

/* 16. GAUGE: value fills a meter */
gauge:{build:(a)=>`<div id="ga"></div>`,
  update:(r,a,s,t)=>{const target=clamp(a.value||0.5,0,1);const frac=clamp(s/Math.max(1,t),0,1)*target;const W=300,cx=150,cy=150,R=100;
    const ang=Math.PI*(1-frac);const x=cx+R*Math.cos(ang),y=cy-R*Math.sin(ang);

    const fg=`<path d="M ${cx-R} ${cy} A ${R} ${R} 0 0 1 ${x} ${y}" fill="none" stroke="${safeColor(a.accent,C.blue)}" stroke-width="16" stroke-linecap="round" style="transition:all .5s var(--ease)"/>`;
    const label=`<text x="${cx}" y="${cy-8}" text-anchor="middle" font-size="34" font-weight="800" fill="var(--tx)" font-family="var(--mono)">${Math.round(frac*100)}${esc(a.unit||'%')}</text>${a.label?`<text x="${cx}" y="${cy+18}" text-anchor="middle" font-size="12" fill="var(--tx-dim)">${esc(a.label)}</text>`:''}`;
    r.querySelector('#ga').innerHTML=svgWrap(bg+fg+label,W,180)+(a.caption?cap(a.caption):'');}},
};

      <div class="mod-card-foot"><span>${items.length} lessons</span><div class="mc-prog"><div class="mc-prog-bar"><div class="mc-prog-fill" style="width:${md/items.length*100}%"></div></div><span>${md}/${items.length}</span></div></div></button>`;});
  mount(`<section class="page home dir-${dir}">
    <div class="home-hero">
      <div class="home-badge"><span class="pulse"></span>${TOTAL} animated lessons</div>
      <h1>${textHTML(COURSE.title)}<br><span class="grad">${textHTML(COURSE.subtitle)}</span></h1>
      <p>Each lesson is its own screen. Press play and it walks the whole course for you, or tap a module to jump in.</p>
      ${nCav?`<p class="home-caveat">${nCav} lesson${nCav>1?'s carry':' carries'} a "not verified" note. Check ${nCav>1?'those':'it'} against a source you trust.</p>`:''}
      <div class="home-cta"><button class="btn-primary" id="playAll">${I.play}<span>${done>0?'Resume':'Play all '+TOTAL}</span></button></div>
    </div>
    <div class="mod-grid">${cards}</div>
  </section>`);
  $('#playAll').onclick=()=>play();
  $$('.mod-card').forEach(c=>c.onclick=()=>goModule(+c.dataset.mod,'right'));
  updateTop();
}

function goModule(mi,dir='right'){
  ST.view='module';ST.mod=mi;ST.cur=-1;setTransport(false);
  const m=MODULES[mi];const items=lessonsByMod(mi);
  $('#crumb').innerHTML=`<span class="c-mod">${textHTML(m.title)}</span>`;
  let cards='';
  items.forEach(({l,i})=>{cards+=`<button class="lcard ${ST.done.has(i)?'done':''}" data-idx="${i}">
    <span class="lcard-num">${i+1}</span>
    <span class="lcard-body"><span class="lcard-title">${textHTML(l.title)}</span><span class="lcard-tag">${textHTML(l.tag)}${l.caveat?' (not verified)':''}</span></span>
    <span class="lcard-check">${I.check}</span></button>`;});
  mount(`<section class="page module dir-${dir}">
    <div class="module-head" style="--accent:${safeColor(m.accent,C.blue)};--accent-bg:${safeColor(m.accent,C.blue)}22">
      <div class="mh-ico">${svg(m.icon)}</div>
      <div style="flex:1;min-width:0"><h2>${textHTML(m.title)}</h2><p>Module ${textHTML(m.n)} · ${items.length} lessons · ${textHTML(m.sub)}</p></div>
      <button class="btn-primary mh-play" id="playMod" style="height:42px;padding:0 18px;font-size:13.5px">${I.play}<span>Play module</span></button>
    </div>
    <div class="lesson-grid">${cards}</div>
  </section>`);
  $('#playMod').onclick=()=>{goLesson(items[0].i,'right');play();};
  $$('.lcard').forEach(c=>c.onclick=()=>goLesson(+c.dataset.idx,'right'));
  updateTop();
}

function goLesson(idx,dir='right'){
  ST.view='lesson';ST.cur=idx;ST.step=0;setTransport(true);
  const l=LESSONS[idx];const m=MODULES[l.m];const total=beatsOf(l);
  $('#crumb').innerHTML=`<button type="button" class="c-mod" data-gomod="${textHTML(l.m)}">${textHTML(m.title)}</button><span class="c-sep">/</span><span class="c-page">${textHTML(l.title)}</span>`;
  const exHTML=l.example&&l.example.length?`<div class="l-code side-order-code ${l.lang==='code'?'is-code':'is-text'}">${l.exLabel?`<div class="cc-label">${esc(l.exLabel)}</div>`:''}<div class="cc-body">${l.example.map((ln,i)=>l.lang==='code'?`<div class="code-line"><span class="code-ln">${i+1}</span><span class="code-txt">${hl(ln)}</span></div>`:`<div class="text-line">${esc(ln)}</div>`).join('')}</div></div>`:'';
  const notes=[];
  if(l.why)notes.push(`<div class="callout why">${I.bulb}<div class="callout-txt"><b>Why it matters: </b>${textHTML(l.why)}</div></div>`);
  if(l.trap)notes.push(`<div class="callout trap">${I.warn}<div class="callout-txt"><b>Trap: </b>${textHTML(l.trap)}</div></div>`);
  if(l.insight)notes.push(`<div class="callout insight">${I.spark}<div class="callout-txt"><b>Insight: </b>${textHTML(l.insight)}</div></div>`);
  if(l.caveat)notes.push(`<div class="callout caveat">${I.warn}<div class="callout-txt"><b>Not verified: </b>${textHTML(l.caveat)}</div></div>`);
  const hasNotes=notes.length>0;
  const notesHTML=hasNotes?`<div class="l-notes side-order-notes">${notes.join('')}</div>`:'';
  const chips=hasNotes?`<button class="dchip purple chip-notes" data-sheet="notes">${I.notes}Notes</button>`:'';
  const pips=Array.from({length:total},(_,i)=>`<span class="dpip" data-pip="${i}"></span>`).join('');
  mount(`<section class="page lesson dir-${dir}">
    <header class="l-head"><div class="l-kick"><span>${textHTML(l.tag)}</span><span class="lk-mod">· M${textHTML(m.n)} · ${idx+1}/${TOTAL}</span>${l.caveat?'<span class="lk-caveat">not verified</span>':''}</div><h2>${textHTML(l.title)}</h2></header>
    <div class="l-stage"><div class="anim-canvas" id="animCanvas"></div></div>
    <aside class="l-side">
      <div class="side-cap-wrap side-order-cap">
        <div class="side-pips" id="dockPips">${pips}</div>
        <div class="side-caption"><span class="dc-key" id="dcKey"></span><div class="dc-text" id="dcText"></div></div>
      </div>
      ${notesHTML}
      ${exHTML}
      <div class="side-chips side-order-chips">${chips}</div>
    </aside>
  </section>`);
  curRend=REND[l.anim.r]||REND.reveal;
  $('#animCanvas').innerHTML=curRend.build(l.anim);
  $$('.dchip').forEach(c=>c.onclick=()=>openSheet(c.dataset.sheet));
  const cm=$('.c-mod');if(cm)cm.onclick=()=>goModule(l.m,'left');
  applyStep(0);
  refreshDrawer();
  updateTop();
}

/* ---------- step engine (no layout growth → no scroll) ---------- */
function applyStep(s){
  const l=LESSONS[ST.cur];const total=beatsOf(l);ST.step=s;
  if(curRend&&curRend.update)curRend.update($('#animCanvas'),l.anim,s,total);
  $$('.dpip').forEach((p,i)=>{p.classList.toggle('active',i===s-1);p.classList.toggle('past',i<s-1);});
  const key=$('#dcKey'),txt=$('#dcText');
  if(key&&txt){
    if(s===0){key.textContent='start';txt.textContent=l.sub==null?'':String(l.sub);}
    else{const st=l.steps[s-1];key.textContent=st.k;txt.innerHTML=st.t;}
  }
  if(s>=total && !ST.done.has(ST.cur))markDone(ST.cur);
  fitStage();fitLabels();updateTransport();updateTop();
}
/* Labels inside a drawing shrink with it on a narrow screen. Hold each one at LABEL_MIN_PX on screen by
   raising its size in drawing units, by at most LABEL_MAX_GROW so that neighbouring labels do not collide.
   Positions and shapes are untouched; a label already large enough is left alone. Added 9 Oct 2026. */
const LABEL_MIN_PX=9.5,LABEL_MAX_GROW=1.3;
function fitLabels(){
  const cv=document.querySelector('#animCanvas');if(!cv)return;
  cv.querySelectorAll('svg text').forEach(t=>{
    const s=t.ownerSVGElement;if(!s||!s.viewBox||!s.viewBox.baseVal||!s.viewBox.baseVal.width)return;
    const k=s.getBoundingClientRect().width/s.viewBox.baseVal.width;if(!(k>0)||!isFinite(k))return;
    if(t.dataset.fs===undefined){t.dataset.fs=parseFloat(getComputedStyle(t).fontSize)||0;t.dataset.fi=t.style.fontSize||'';}
    const base=+t.dataset.fs;if(!base)return;
    const want=Math.min(LABEL_MIN_PX/k,base*LABEL_MAX_GROW);
    t.style.fontSize=want>base+0.01?want.toFixed(2)+'px':t.dataset.fi;
  });
}
function fitStage(){
  const stage=document.querySelector('.l-stage'),canvas=document.querySelector('#animCanvas');
  if(!stage||!canvas)return;
  canvas.style.transform='none';
  const ah=stage.clientHeight-10,aw=stage.clientWidth,ch=canvas.scrollHeight,cw=canvas.scrollWidth;
  if(!ch||!ah)return;
  const sc=Math.min(1,ah/ch,(aw&&cw)?aw/cw:1);
  if(sc<0.999&&isFinite(sc))canvas.style.transform='scale('+sc.toFixed(3)+')';
}
function setStep(s){applyStep(clamp(s,0,beatsOf(LESSONS[ST.cur])));}

function markDone(idx){
  const was=ST.done.has(idx);ST.done.add(idx);
  refreshDrawer();persist();
  if(!was){ if(ST.done.size===TOTAL)toast('🎉 All '+TOTAL+' done'); else if(!PLAY.on)toast('Nice: '+ST.done.size+'/'+TOTAL); }
}

/* ---------- sheets ---------- */
function openSheet(kind){
  const l=LESSONS[ST.cur];const sh=$('#sheet');
  $('#sheetTitle').textContent='Notes for this lesson';
  $('#sheetBody').innerHTML=[
    l.why?`<div class="callout why">${I.bulb}<div class="callout-txt"><b>Why it matters: </b>${textHTML(l.why)}</div></div>`:'',
    l.trap?`<div class="callout trap">${I.warn}<div class="callout-txt"><b>Trap: </b>${textHTML(l.trap)}</div></div>`:'',
    l.insight?`<div class="callout insight">${I.spark}<div class="callout-txt"><b>Insight: </b>${textHTML(l.insight)}</div></div>`:'',
    l.caveat?`<div class="callout caveat">${I.warn}<div class="callout-txt"><b>Not verified: </b>${textHTML(l.caveat)}</div></div>`:'',
  ].join('')||'<div class="callout-txt">No extra notes for this one.</div>';
  sh.classList.add('show');sh.setAttribute('aria-hidden','false');
}
function closeSheet(){const sh=$('#sheet');const was=sh.dataset.kind;sh.dataset.kind='';sh.classList.remove('show');sh.setAttribute('aria-hidden','true');if(was==='settings'){const b=$('#themeBtn');if(b)b.focus();}}
$('#sheetClose').onclick=closeSheet;
$('#sheet').addEventListener('click',e=>{if(e.target===$('#sheet'))closeSheet();});

/* ---------- drawer ---------- */
function buildDrawer(){
  const sc=$('#drawerScroll');sc.innerHTML='';
  MODULES.forEach((m,mi)=>{
    const items=lessonsByMod(mi);
    const mod=document.createElement('div');mod.className='dmod'+(mi===0?' open':'');mod.dataset.mod=mi;
    const head=document.createElement('button');head.type='button';head.className='dmod-head';head.setAttribute('aria-expanded',mi===0?'true':'false');
    head.innerHTML=`<span class="dmod-num">${textHTML(m.n)}</span><span class="dmod-title">${textHTML(m.title)}</span><svg class="dmod-chev" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    head.onclick=()=>{const o=mod.classList.toggle('open');head.setAttribute('aria-expanded',o?'true':'false');};
    const list=document.createElement('div');list.className='dmod-list';
    items.forEach(({l,i})=>{const it=document.createElement('button');it.type='button';it.className='ditem';it.dataset.idx=i;
      it.innerHTML=`<span class="ditem-dot"></span><span class="ditem-num">${i+1}</span><span class="ditem-name">${textHTML(l.title)}</span>`;
      it.onclick=()=>{goLesson(i, i>=ST.cur?'right':'left');continueIfPlaying();closeDrawer();};
      list.appendChild(it);});
    mod.appendChild(head);mod.appendChild(list);sc.appendChild(mod);
  });
  refreshDrawer();
}
function refreshDrawer(){
  $$('.ditem').forEach(it=>{const i=+it.dataset.idx;it.classList.toggle('active',i===ST.cur);it.classList.toggle('done',ST.done.has(i));});
  if(ST.cur>=0){const md=$(`.dmod[data-mod="${LESSONS[ST.cur].m}"]`);if(md){md.classList.add('open');const h=md.querySelector('.dmod-head');if(h)h.setAttribute('aria-expanded','true');}}
}
function openDrawer(){$('#drawer').classList.add('open');$('#scrim').classList.add('show');}
function closeDrawer(){$('#drawer').classList.remove('open');$('#scrim').classList.remove('show');}

/* ---------- top progress ---------- */
function updateTop(){
  const done=ST.done.size;
  $('#topProgTxt').textContent=done+'/'+TOTAL;
  const c=94.248;$('#topRingFill').setAttribute('stroke-dashoffset', c*(1-done/TOTAL));
}

/* ---------- autoplay / transport ---------- */
const PLAY={on:false,speed:1,timer:null};
const BEAT_MS=3000,LESSON_GAP=1400;
const beatMs=()=>BEAT_MS/PLAY.speed;
const schedule=(ms,fn)=>{clearTimeout(PLAY.timer);PLAY.timer=setTimeout(fn,ms);};
function tick(){
  if(!PLAY.on||ST.view!=='lesson'||ST.cur<0)return;
  const total=beatsOf(LESSONS[ST.cur]);
  if(ST.step<total){setStep(ST.step+1);schedule(ST.step>=total?LESSON_GAP/PLAY.speed:beatMs(),ST.step>=total?advanceLesson:tick);}
  else advanceLesson();
}
function advanceLesson(){
  if(!PLAY.on)return;
  const n=ST.cur+1;
  if(n<TOTAL){goLesson(n,'right');schedule(beatMs(),tick);}
  else{pause();toast('🎉 Course complete: all '+TOTAL);}
}
function play(){
  if(ST.cur<0)goLesson(firstUndone(),'right');
  setTransport(true);PLAY.on=true;
  const total=beatsOf(LESSONS[ST.cur]);
  if(ST.step>=total)advanceLesson();else schedule(beatMs(),tick);
  updateTransport();
}
function pause(){PLAY.on=false;clearTimeout(PLAY.timer);updateTransport();}
function togglePlay(){PLAY.on?pause():play();}
function continueIfPlaying(){if(PLAY.on&&ST.view==='lesson')schedule(beatMs(),tick);}
function setSpeed(sp){PLAY.speed=sp;if(PLAY.on)schedule(beatMs(),tick);updateTransport();}
function firstUndone(){for(let i=0;i<TOTAL;i++)if(!ST.done.has(i))return i;return 0;}

function updateTransport(){
  const p=$('#tpPlay');if(p){p.innerHTML=PLAY.on?I.pause:I.play;p.setAttribute('aria-label',PLAY.on?'Pause':'Play');}
  const meta=$('#tpMeta'),fill=$('#tpFill');
  if(ST.view==='lesson'&&ST.cur>=0){
    const l=LESSONS[ST.cur];const total=beatsOf(l);const m=MODULES[l.m];
    if(meta)meta.innerHTML=(PLAY.on?'<span class="auto-badge"><span class="adot"></span>PLAYING</span> · ':'')+'Lesson '+(ST.cur+1)+'/'+TOTAL+' · '+textHTML(m.title)+' · beat '+Math.min(ST.step,total)+'/'+total;
    if(fill)fill.style.width=(((ST.cur+Math.min(ST.step,total)/total)/TOTAL)*100)+'%';
  }else{ if(meta)meta.textContent='Ready'; if(fill)fill.style.width=(ST.done.size/TOTAL*100)+'%'; }
  $$('#tpSpeed button').forEach(b=>b.classList.toggle('on',+b.dataset.sp===PLAY.speed));
}
$('#tpPlay').onclick=togglePlay;
$('#tpNext').onclick=()=>{if(ST.cur<TOTAL-1){goLesson(ST.cur+1,'right');continueIfPlaying();}else pause();};
$('#tpPrev').onclick=()=>{if(ST.cur>0){goLesson(ST.cur-1,'left');continueIfPlaying();}};
$('#tpReplay').onclick=()=>{if(ST.cur>=0){setStep(0);continueIfPlaying();}};
$$('#tpSpeed button').forEach(b=>b.onclick=()=>setSpeed(+b.dataset.sp));

/* ---------- misc events ---------- */
let toastT;function toast(msg){const t=$('#toast');$('#toastMsg').textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400);}
$('#menuBtn').onclick=openDrawer;
$('#themeBtn').onclick=()=>{pause();openSettings();};
$('#scrim').onclick=closeDrawer;
$('#homeBtn').onclick=()=>{pause();goHome('up');};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeSheet();closeDrawer();return;}
  if(e.key===' '){e.preventDefault();if(ST.view!=='lesson'&&ST.cur<0)goLesson(firstUndone(),'right');togglePlay();return;}
  if(ST.view!=='lesson')return;
  if(e.key==='ArrowRight'){e.preventDefault();pause();const total=beatsOf(LESSONS[ST.cur]);if(ST.step<total)setStep(ST.step+1);else if(ST.cur<TOTAL-1)goLesson(ST.cur+1,'right');}
  else if(e.key==='ArrowLeft'){e.preventDefault();pause();if(ST.step>0)setStep(ST.step-1);else if(ST.cur>0)goLesson(ST.cur-1,'left');}
});

let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{fitStage();fitLabels();},120);});
try{const mq=window.matchMedia('(min-width:900px) and (min-height:560px)');(mq.addEventListener?mq.addEventListener('change',()=>setTimeout(fitStage,60)):mq.addListener(()=>setTimeout(fitStage,60)));}catch(e){}

/* ---------- persistence ---------- */
async function persist(){const d=JSON.stringify({done:[...ST.done]});
  try{if(window.storage&&window.storage.set){await window.storage.set(('percept:'+COURSE.title),d);return;}}catch(e){}
  try{localStorage.setItem(('percept:'+COURSE.title),d);}catch(e){}}
async function restore(){
  try{if(window.storage&&window.storage.get){const r=await window.storage.get(('percept:'+COURSE.title));if(r&&r.value){(JSON.parse(r.value).done||[]).forEach(i=>ST.done.add(i));return;}}}catch(e){}
  try{const r=localStorage.getItem(('percept:'+COURSE.title));if(r)(JSON.parse(r).done||[]).forEach(i=>ST.done.add(i));}catch(e){}}

/* ---------- boot ---------- */
(async function(){ document.title=COURSE.title; const dh=document.querySelector('#drawer .drawer-head h3'),dp=document.querySelector('#drawer .drawer-head p'); if(dh)dh.textContent=COURSE.title; if(dp)dp.textContent=COURSE.subtitle; await restore(); await restorePrefs(); applyPrefs(); buildDrawer(); goHome('up'); updateTransport(); })();


</script>
