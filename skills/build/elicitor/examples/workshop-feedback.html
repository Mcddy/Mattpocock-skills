<!doctype html>
<html lang="en" data-theme="paper" data-size="standard" data-density="comfortable" data-motion="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Questionnaire</title>
<!--
  Elicitor engine. One file, no build step, no outside requests.

  To make a questionnaire, change ONLY the data block: the object between the two marker lines
  "BEGIN INSTRUMENT DATA" and "END INSTRUMENT DATA" further down. Everything else is fixed.
  The data block is strict JSON (double quotes, no trailing commas, no comments), so that
  scripts/validate_instrument.py can read it. scripts/build_instrument.py writes it for you.

  Delivery notes:
  - No form element and no submit event. Buttons are type=button with click handlers, and Enter in
    a one-line field calls the same function. A sandboxed frame drops form submits.
  - No alert, confirm or prompt. Anything destructive is confirmed in the page.
  - Storage is optional. Order tried: a host storage object (window.storage with async get and
    set), then localStorage, then memory. The page says which one is in use.
  - Every export is shown in a text box as well as offered to the clipboard and as a download,
    because a frame can refuse both.
  - Text is put on the page with textContent. No markup is built from the data block or from answers.
-->
<style>
:root{
  color-scheme:light;
  --bg:#f4eee3;--surface:#fffbf3;--raised:#f9f2e4;--ink:#26211c;--muted:#5e554a;--line:#d6cab6;
  --accent:#1d5461;--on-accent:#fffbf3;--accent-soft:#d9e6e4;
  --warn:#8c2b1b;--warn-soft:#f6ddd2;--ok:#2a6042;--ok-soft:#dcebdd;--focus:#a34a12;
  --gap:1rem;--opt-pad:.7rem;--q-size:1.42rem;--target:2.75rem;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;
}
:root[data-theme="slate"]{
  --bg:#edf0f2;--surface:#fbfcfd;--raised:#f2f5f7;--ink:#1e282e;--muted:#4f5d66;--line:#c6d0d6;
  --accent:#34508a;--on-accent:#fbfcfd;--accent-soft:#dbe2f0;
  --warn:#8a2a22;--warn-soft:#f3dcd8;--ok:#27634a;--ok-soft:#d8eadf;--focus:#7a3c12;
}
:root[data-theme="dusk"]{
  color-scheme:dark;
  --bg:#221c18;--surface:#2c2520;--raised:#362d27;--ink:#f2e8db;--muted:#c3b4a3;--line:#5a4b40;
  --accent:#8fd0c8;--on-accent:#172221;--accent-soft:#2c4441;
  --warn:#ffac99;--warn-soft:#4c2a23;--ok:#9ed6b3;--ok-soft:#27402f;--focus:#f2c08a;
}
:root[data-theme="ink"]{
  color-scheme:dark;
  --bg:#0f1418;--surface:#171e24;--raised:#1f2830;--ink:#eef3f6;--muted:#aebcc6;--line:#3f4e5a;
  --accent:#f0c36a;--on-accent:#17120a;--accent-soft:#3a3220;
  --warn:#ffb0a3;--warn-soft:#452622;--ok:#9bd8b6;--ok-soft:#1f3a2c;--focus:#8cc4e8;
}
:root[data-density="compact"]{--gap:.65rem;--opt-pad:.4rem;--q-size:1.25rem}
:root[data-size="large"]{font-size:112.5%}
:root[data-size="larger"]{font-size:125%}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 var(--sans);overflow-wrap:anywhere}
.app{max-width:46rem;margin:0 auto;padding:0 1rem;min-height:100vh;display:flex;flex-direction:column}
[hidden]{display:none !important}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;overflow-wrap:normal}
button[aria-disabled="true"]{cursor:default;opacity:.55}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1:focus,h2:focus,main:focus,.fb:focus{outline:none}

.btn{min-height:var(--target);min-width:var(--target);padding:.35rem 1rem;border:1px solid var(--line);background:var(--surface);border-radius:.4rem;line-height:1.25}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.danger{border-color:var(--warn);color:var(--warn);font-weight:600}
.btn.quiet{border-color:transparent;background:transparent;text-decoration:underline;text-underline-offset:3px}
.seg{min-height:var(--target);padding:.3rem .85rem;border:1px solid var(--line);background:var(--surface);border-radius:.4rem}
.seg[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent);font-weight:600}
.seg[aria-pressed="true"]::before{content:"";display:inline-block;width:.45rem;height:.75rem;border:solid var(--ink);border-width:0 2px 2px 0;transform:rotate(45deg);margin:0 .5rem .1rem 0}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:.4rem;min-height:var(--target);padding:.55rem .75rem;width:100%}
textarea{display:block;resize:vertical;line-height:1.45}
textarea[readonly]{font:1rem/1.45 var(--mono);background:var(--raised)}
[aria-invalid="true"]{border-color:var(--warn) !important;border-width:2px !important}
label,.lab{display:block;font-size:.9rem;color:var(--muted);margin-bottom:.3rem}
.hint{font-size:.85rem;color:var(--muted);margin-top:.3rem}

/* top: title, progress as "17 of 60" and a strip with one cell per question */
.top{padding:.75rem 0 .6rem;border-bottom:2px solid var(--ink)}
.top-row{display:flex;gap:.75rem;align-items:center;justify-content:space-between}
#panel-toggle{flex:0 0 auto;white-space:nowrap;font-size:.92rem;padding:.35rem .7rem}
.doc-title{font:600 1rem/1.3 var(--sans);overflow-wrap:anywhere;min-width:0}
.progress{margin-top:.5rem}
.progress-text{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.progress-text b{color:var(--ink);font-weight:600}
.rail{display:flex;gap:1px;align-items:flex-end;height:.7rem;margin-top:.35rem}
.rail .grp{display:flex;gap:1px;align-items:flex-end;flex-grow:1;margin-right:.35rem;min-width:0}
.rail .grp:last-child{margin-right:0}
.cell{flex:1 1 0;min-width:1px;height:.35rem;background:var(--line);border-radius:1px}
.cell.done{background:var(--accent)}
.cell.skip{background:transparent;box-shadow:inset 0 0 0 1px var(--muted)}
.cell.cur{height:.7rem;background:var(--ink)}
:root[data-motion="on"] .cell{transition:height .12s ease,background-color .12s ease}

.status{min-height:1.5rem;margin:.5rem 0 0;font-size:.92rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:.25rem .75rem;align-items:center}
.status.bad{color:var(--warn);font-weight:600}
.status .btn{min-height:var(--target)}
.savebanner{margin:.6rem 0 0;padding:.55rem .75rem;background:var(--warn-soft);border:1px solid var(--line);font-size:.92rem;border-radius:.2rem}

main{flex:1 1 auto;padding:1rem 0 1.25rem}
.lead h1,.lead h2{font:600 1.75rem/1.2 var(--serif);letter-spacing:-.01em;margin-bottom:.5rem;overflow-wrap:anywhere}
.lead p{margin-top:.6rem;max-width:62ch}
.facts{margin:1rem 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.facts li{padding:.6rem 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:9.5rem minmax(0,1fr);gap:.75rem}
.facts .k{color:var(--muted);font-size:.9rem}
.facts .v{overflow-wrap:anywhere}
.how{margin:1rem 0 0;padding-left:1.2rem}
.how li{margin:.3rem 0}
.rowgap{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:.75rem}

/* a question */
.q{padding:.25rem 0 var(--gap)}
.q + .q{border-top:1px solid var(--line);padding-top:var(--gap)}
:root[data-motion="on"] .q.enter{animation:q-in .16s ease-out}
@keyframes q-in{from{transform:translateY(.4rem)}to{transform:none}}
.q-meta{display:flex;flex-wrap:wrap;gap:.2rem .75rem;align-items:baseline;font-size:.85rem;color:var(--muted)}
.q-id{font:.8rem var(--mono);letter-spacing:.02em;overflow-wrap:anywhere}
.q-req{color:var(--warn);font-weight:600}
.q-text{font:600 var(--q-size)/1.28 var(--serif);margin:.35rem 0 .2rem;overflow-wrap:anywhere}
.q-help{color:var(--muted);max-width:62ch;overflow-wrap:anywhere}
.q-control{margin-top:var(--gap)}
.q-err{color:var(--warn);font-weight:600;font-size:.95rem;margin-top:.5rem}
.q-err:empty{display:none}
.q-skipped{margin-top:.5rem;font-size:.92rem;color:var(--muted);font-style:italic}
.q-note{margin-top:var(--gap)}
.opts{display:grid;gap:.45rem}
.opt{display:flex;gap:.7rem;align-items:flex-start;min-height:var(--target);padding:var(--opt-pad) .8rem;margin:0;border:1px solid var(--line);border-radius:.4rem;background:var(--surface);color:var(--ink);font-size:1rem;cursor:pointer}
.opt:hover{border-color:var(--ink)}
.opt input{flex:0 0 auto;width:1.25rem;height:1.25rem;margin:.12rem 0 0;accent-color:var(--accent)}
.opt .t{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.opt .n{flex:0 0 auto;font:600 .95rem var(--mono);min-width:1.2rem}
.opt.on{border-color:var(--ink);box-shadow:inset .25rem 0 0 var(--accent);background:var(--accent-soft)}
.opt.locked{cursor:default}
.tag{display:inline-block;font-size:.78rem;font-weight:600;border:1px solid currentColor;border-radius:.25rem;padding:0 .35rem;margin-right:.4rem;white-space:nowrap}
.tag.ok{color:var(--ok)}
.tag.bad{color:var(--warn)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--target),1fr));gap:.4rem}
.chip{position:relative;display:grid;place-items:center;min-height:var(--target);margin:0;border:1px solid var(--line);border-radius:.4rem;background:var(--surface);color:var(--ink);font:600 1rem var(--mono);cursor:pointer}
.chip input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);text-decoration:underline;text-underline-offset:3px}
.chip:focus-within{outline:3px solid var(--focus);outline-offset:2px}
@supports selector(:has(a)){
  .chip:focus-within{outline:none}
  .chip:has(input:focus-visible),.opt:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
  .opt input:focus-visible{outline:none}
}
.ends{display:flex;justify-content:space-between;gap:1rem;margin-top:.45rem;font-size:.88rem;color:var(--muted)}
.ends span{max-width:48%;overflow-wrap:anywhere}
.ends span:last-child{text-align:right}
.slider{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.5rem;align-items:center}
.slider input[type=range]{width:100%;min-height:var(--target);accent-color:var(--accent)}
.slider-val{font:600 1.1rem var(--mono);margin-bottom:.4rem}
.numrow{display:flex;gap:.6rem;align-items:center}
.numrow input{max-width:11rem}
.unit{color:var(--muted)}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:.45rem}
.rank li{display:grid;grid-template-columns:1.6rem minmax(0,1fr) auto auto;gap:.5rem;align-items:center;padding:.3rem .3rem .3rem .7rem;border:1px solid var(--line);border-radius:.4rem;background:var(--surface)}
.rank .pos{font:600 1rem var(--mono)}
.rank .t{overflow-wrap:anywhere}
.mv{width:var(--target);height:var(--target);border:1px solid var(--line);border-radius:.4rem;background:var(--raised);display:grid;place-items:center;padding:0}
.mv svg{width:1.1rem;height:1.1rem}
.mv:hover{border-color:var(--ink)}

/* quiz feedback: every option with its explanation */
.fb{margin-top:var(--gap);padding:.75rem .9rem;border-radius:.3rem;border:1px solid var(--line);background:var(--ok-soft)}
.fb.bad{background:var(--warn-soft)}
.fb.passed{background:var(--raised)}
.fb-verdict{font-weight:600}
.fb ul{list-style:none;margin:.5rem 0 0;padding:0;display:grid;gap:.55rem}
.fb li{overflow-wrap:anywhere}
.fb .o{font-weight:600}
.fb .why{display:block}

/* review */
.sec-h{font:600 1.05rem var(--sans);margin:1.25rem 0 .25rem;padding-bottom:.3rem;border-bottom:1px solid var(--ink);overflow-wrap:anywhere}
.rv{list-style:none;margin:0;padding:0}
.rv li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.75rem;align-items:start;padding:.65rem 0;border-bottom:1px solid var(--line)}
.rv-q{font-weight:600;overflow-wrap:anywhere}
.rv-a{overflow-wrap:anywhere;white-space:pre-line;margin-top:.15rem}
.rv-a.none{color:var(--muted);font-style:italic}
.rv-a.need{color:var(--warn);font-weight:600;font-style:normal}
.rv-n{color:var(--muted);font-size:.92rem;overflow-wrap:anywhere;white-space:pre-line;margin-top:.15rem}
.errbox{margin:1rem 0 0;padding:.75rem .9rem;background:var(--warn-soft);border:1px solid var(--line);border-radius:.2rem}
.errbox p{font-weight:600;color:var(--warn)}
.errbox ul{margin:.4rem 0 0;padding-left:1.1rem}
.errbox .btn{overflow-wrap:anywhere;text-align:left}
.blank{padding:2rem .5rem;text-align:center;border-bottom:1px solid var(--line)}
.blank p{color:var(--muted);margin:.4rem auto .9rem;max-width:44ch}

/* results */
.score{margin-top:1rem;padding:1rem;border:1px solid var(--line);border-radius:.4rem;background:var(--surface)}
.score-main{font:600 1.5rem/1.25 var(--serif)}
.score-main b{font-family:var(--mono);font-size:1.6rem}
.tallies{margin:1rem 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.tallies li{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
.tallies .c{font:600 1rem var(--mono);white-space:nowrap}
.caveat{font-size:.9rem;color:var(--muted);margin-top:.5rem}
.sub-h{font:600 1.1rem var(--sans);margin:1.5rem 0 .4rem}
.missed{list-style:none;margin:0;padding:0}
.missed > li{padding:.75rem 0;border-bottom:1px solid var(--line)}

/* the bar of actions: within thumb reach on a phone */
.bar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:.6rem 0 calc(.6rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;align-items:stretch}
.bar:empty{display:none}
.bar.flow{position:static}
.bar .btn.primary{flex:1 1 auto}
.foot{padding:.6rem 0 1rem;font-size:.85rem;color:var(--muted)}

/* panel: saving, resume codes, import, display */
.panel{margin-top:.75rem;background:var(--raised);border:1px solid var(--line);border-radius:.5rem;padding:1rem;display:grid;grid-template-columns:minmax(0,1fr);gap:1.1rem}
.panel h2{font:600 1.05rem var(--sans)}
.panel h3{font:600 .98rem var(--sans);margin-bottom:.4rem}
.panel section{display:grid;grid-template-columns:minmax(0,1fr);gap:.5rem}
.choice{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.choice .lab{width:5.2rem;margin:0}
.confirm{display:grid;grid-template-columns:minmax(0,1fr);gap:.6rem;background:var(--warn-soft);border:1px solid var(--line);border-radius:.2rem;padding:.75rem .9rem}
.msg{font-size:.95rem}
.msg.bad{color:var(--warn);font-weight:600}
.msg:empty{display:none}
input[type=file]{font:inherit;color:var(--ink);width:100%;min-width:0;min-height:var(--target);padding:.4rem 0}

@media (min-width:44rem){
  .app{padding:0 1.5rem}
  .bar{position:static;justify-content:flex-end;border-top:1px solid var(--line);padding:.9rem 0}
  .bar .btn.primary{flex:0 0 auto;min-width:11rem}
  .bar .spacer{flex:1 1 auto}
  .lead h1,.lead h2{font-size:2.1rem}
  .opts.across{grid-template-columns:repeat(auto-fit,minmax(7.5rem,1fr))}
  .opts.across .opt{flex-direction:column;gap:.3rem}
}
@media (max-width:26rem){
  .facts li{grid-template-columns:1fr;gap:.1rem}
  .choice .lab{width:100%}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="top-row">
      <p class="doc-title" id="doc-title">Questionnaire</p>
      <button type="button" class="btn" id="panel-toggle" aria-expanded="false" aria-controls="panel">Save and display</button>
    </div>
    <div class="progress" id="progress" hidden>
      <p class="progress-text" id="progress-text"></p>
      <div class="rail" id="rail" aria-hidden="true"></div>
    </div>
  </header>

  <section class="panel" id="panel" hidden aria-labelledby="panel-h">
    <h2 id="panel-h" tabindex="-1">Save and display</h2>

    <section aria-labelledby="keep-h">
      <h3 id="keep-h">Your progress</h3>
      <p class="msg" id="store-note"></p>
      <div class="rowgap" style="margin-top:0">
        <button type="button" class="btn" id="resume-make">Get a resume code</button>
        <button type="button" class="btn" id="import-open" aria-expanded="false" aria-controls="import-box">Continue from a code or export</button>
        <button type="button" class="btn danger" id="reset-ask">Start again</button>
      </div>
      <div id="resume-box" hidden>
        <label for="resume-text">Resume code. Paste it into this same questionnaire, on any device, to carry on.</label>
        <textarea id="resume-text" readonly rows="5" spellcheck="false"></textarea>
        <div class="rowgap">
          <button type="button" class="btn primary" id="resume-copy">Copy the code</button>
          <button type="button" class="btn" id="resume-download">Download as a file</button>
        </div>
        <p class="msg" id="resume-msg" role="status"></p>
      </div>
      <div id="import-box" hidden>
        <label for="import-text">Paste a resume code, or a finished export from this questionnaire</label>
        <textarea id="import-text" rows="5" spellcheck="false" autocomplete="off" aria-describedby="import-msg"></textarea>
        <label for="import-file" style="margin-top:.6rem">Or choose a saved file</label>
        <input type="file" id="import-file" accept=".json,.md,.txt,application/json,text/plain,text/markdown">
        <div class="rowgap">
          <button type="button" class="btn primary" id="import-go">Load it</button>
        </div>
        <p class="msg" id="import-msg" role="alert"></p>
        <div class="confirm" id="import-confirm" hidden>
          <p id="import-confirm-text"></p>
          <div class="rowgap" style="margin-top:0">
            <button type="button" class="btn" id="import-keep">Keep my current answers</button>
            <button type="button" class="btn danger" id="import-continue">Load the answers that match</button>
          </div>
        </div>
      </div>
      <div class="confirm" id="reset-confirm" hidden>
        <p id="reset-text"></p>
        <div class="rowgap" style="margin-top:0">
          <button type="button" class="btn" id="reset-cancel">Keep my answers</button>
          <button type="button" class="btn" id="reset-export">Get a resume code first</button>
          <button type="button" class="btn danger" id="reset-go">Clear and start again</button>
        </div>
      </div>
    </section>

    <section aria-labelledby="disp-h">
      <h3 id="disp-h">Display</h3>
      <div class="choice" role="group" aria-label="Theme">
        <span class="lab">Theme</span>
        <button type="button" class="seg" data-set="theme" data-val="paper">Paper</button>
        <button type="button" class="seg" data-set="theme" data-val="slate">Slate</button>
        <button type="button" class="seg" data-set="theme" data-val="dusk">Dusk</button>
        <button type="button" class="seg" data-set="theme" data-val="ink">Ink</button>
      </div>
      <div class="choice" role="group" aria-label="Text size">
        <span class="lab">Text size</span>
        <button type="button" class="seg" data-set="size" data-val="standard">Standard</button>
        <button type="button" class="seg" data-set="size" data-val="large">Large</button>
        <button type="button" class="seg" data-set="size" data-val="larger">Larger</button>
      </div>
      <div class="choice" role="group" aria-label="Spacing">
        <span class="lab">Spacing</span>
        <button type="button" class="seg" data-set="density" data-val="comfortable">Comfortable</button>
        <button type="button" class="seg" data-set="density" data-val="compact">Compact</button>
      </div>
      <div class="choice" role="group" aria-label="Movement">
        <span class="lab">Movement</span>
        <button type="button" class="seg" data-set="motion" data-val="on">On</button>
        <button type="button" class="seg" data-set="motion" data-val="off">Off</button>
      </div>
      <div class="choice" role="group" aria-label="Questions shown" id="layout-choice">
        <span class="lab">Questions</span>
        <button type="button" class="seg" data-set="layout" data-val="one">One at a time</button>
        <button type="button" class="seg" data-set="layout" data-val="sections">A section at a time</button>
      </div>
      <div class="rowgap" style="margin-top:0">
        <button type="button" class="btn quiet" id="display-reset">Reset display</button>
        <span class="msg" id="display-note"></span>
      </div>
    </section>

    <div><button type="button" class="btn" id="panel-close">Close</button></div>
  </section>

  <p class="savebanner" id="save-banner" hidden></p>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <main id="main" tabindex="-1"></main>
  <div class="bar" id="bar"></div>
  <p class="foot" id="foot"></p>
</div>

<script>
/* ====== BEGIN INSTRUMENT DATA: edit only between this line and the END line. Strict JSON. ======
   Fields are described in references/modes.md. Question ids are permanent: when you revise, add
   new ids and raise "version"; never renumber or reuse an id. */
const INSTRUMENT = {
  "id": "workshop-feedback",
  "version": 1,
  "mode": "survey",
  "title": "Feedback on the afternoon workshop",
  "purpose": "Thirteen short questions about how the workshop went for you.",
  "minutes": 5,
  "disclosure": {
    "who": "The workshop organiser",
    "purpose": "To decide what to keep, cut or change before the workshop runs again.",
    "handling": "Your answers are read by the organiser only. They are kept in one spreadsheet with no names attached, and deleted once the next workshop has run. Nothing is passed on outside the organising group.",

            a,
            checked ? el('p', {class: 'rv-n', text: isCorrect(q) ? 'Marked: correct' : 'Marked: not correct'}) : null,
            note ? el('p', {class: 'rv-n', text: 'Note: ' + note}) : null
          ]),
          checked ? null : el('button', {type: 'button', class: 'btn', id: 'edit-' + q.id, 'aria-label': 'Change the answer to: ' + q.text, text: st === 'answered' ? 'Change' : 'Answer', on: {click: function () { editFrom(q); }}})
        ]));
      });
    }
    setBar([
      vis.length ? btn('btn-back', 'Back', '', function () { UI.finishTried = false; goTo(useSections() ? sectionQuestions(vis[vis.length - 1].section)[0].id : vis[vis.length - 1].id); }) : null,
      el('span', {class: 'spacer'}),
      btn('btn-finish', I.mode === 'quiz' ? 'Finish and see the score' : 'Finish', 'primary', function () {
        if (need.length) { UI.finishTried = true; render({focusId: 'need-box'}); return; }
        UI.finishTried = false; ST.stage = 'done'; ST.finished_at = nowIso();
        Q.forEach(function (q) { if (I.mode === 'quiz' && hasAnswer(q)) ST.ans[q.id].checked = true; });
        saveNow(); render({focus: true});
      })
    ]);
  }
  function download(name, text, msgEl) {
    try {
      var url = URL.createObjectURL(new Blob([text], {type: 'text/plain;charset=utf-8'}));
      var a = el('a', {href: url, download: name});
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) { /* nothing to free */ } }, 2000);
      msgEl.textContent = 'A download of ' + name + ' was requested. If no file arrives, this page is not allowed to save files here: copy the text from the box instead.';
    } catch (e) {
      msgEl.textContent = 'This page is not allowed to save files here. Copy the text from the box instead.';
    }
  }
  // Copy with the full text always present in a box. If the clipboard is refused, the box is selected and the page says so.
  function copyFrom(box, msgEl, okWords, button) {
    if (button.getAttribute('aria-disabled') === 'true') return;
    var label = button.textContent;
    button.setAttribute('aria-disabled', 'true'); button.textContent = 'Copying';
    var done = function (ok) {
      button.removeAttribute('aria-disabled'); button.textContent = label;
      if (ok) { msgEl.className = 'msg'; msgEl.textContent = okWords; return; }
      try { box.focus(); box.select(); } catch (e) { /* the box is still there to select by hand */ }
      msgEl.className = 'msg bad';
      msgEl.textContent = 'Copying is blocked here. The complete text is in the box and is selected: press and hold it, or right-click it, and choose Copy.';
    };
    var byCommand = function () {
      var ok = false;
      try { box.focus(); box.select(); ok = document.execCommand('copy') === true; } catch (e) { ok = false; }
      done(ok);
    };
    try {
      if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') { navigator.clipboard.writeText(box.value).then(function () { done(true); }, byCommand); return; }
    } catch (e) { /* fall through to the older command */ }
    byCommand();
  }
  function renderDone() {
    var main = $('main'), text = buildExport(), kids = [];
    var fname = I.id + (I.mode === 'survey' ? '-response.txt' : '-export.md');
    kids.push(el('h1', {tabindex: '-1', id: 'screen-h', text: I.mode === 'quiz' ? 'Your result' : 'Finished'}));
    main.appendChild(el('div', {class: 'lead'}, kids));
    if (I.mode === 'quiz') {
      var s = score();
      main.appendChild(el('div', {class: 'score', id: 'score'}, [
        el('p', {class: 'score-main', id: 'score-main'}, [el('b', {text: String(s.correct)}), ' correct of ', el('b', {text: String(s.attempted)}), ' attempted']),
        factsList([
          ['Out of all items', s.correct + ' of ' + s.total],
          ['Skipped', s.skipped + ' (not counted as wrong)'],
          ['Not answered', String(s.none)],
          ['Scoring rule', SCORE_RULE]
        ])
      ]));
      main.appendChild(el('h2', {class: 'sub-h', id: 'missed-h', text: 'Missed: ' + s.missed.length}));
      if (!s.missed.length) main.appendChild(el('p', {id: 'missed-none', text: s.attempted ? 'Nothing missed among the items you attempted.' : 'No items were attempted, so there is nothing to mark.'}));
      var listOf = function (items, id) {
        return el('ul', {class: 'missed', id: id}, items.map(function (q) { return el('li', {'data-missed': q.id}, [el('p', {class: 'rv-q', text: q.text}), feedbackBlock(q)]); }));
      };
      if (s.missed.length) main.appendChild(listOf(s.missed, 'missed-list'));
      if (s.passed.length) {
        main.appendChild(el('h2', {class: 'sub-h', text: 'Skipped or not answered: ' + s.passed.length}));
        main.appendChild(listOf(s.passed, 'passed-list'));
      }
    }
    var lines = text.split('\n').length - 1;
    var box = el('textarea', {id: 'export-text', readonly: true, rows: '12', spellcheck: 'false', 'aria-describedby': 'copy-status'});
    box.value = text;
    box.addEventListener('focus', function () { try { box.select(); } catch (e) { /* selection is a convenience only */ } });
    var msg = el('p', {class: 'msg', id: 'copy-status', role: 'status'});
    var who = I.mode === 'survey' ? oneLine(I.disclosure.who) : '';
    main.appendChild(el('h2', {class: 'sub-h', text: I.mode === 'survey' ? 'Send your answers back' : I.mode === 'quiz' ? 'A text copy of the result' : 'Copy your answers back'}));
    main.appendChild(el('p', {text: I.mode === 'survey'
      ? 'Nothing has been sent. To hand in your answers, copy the whole block below, first line to last, and send it the way you were asked. It goes to: ' + who + '.'
      : I.mode === 'quiz' ? 'Paste this into a chat or a note to keep the result. It lists every item with your answer and the correct one.'
      : 'Copy the text below and paste it into the chat. It holds every question with your answer and your notes.'}));
    var copyBtn = btn('copy-export', I.mode === 'survey' ? 'Copy the response block' : 'Copy the export', 'primary', function () {
      copyFrom(box, msg, I.mode === 'survey' ? 'Copied. Now paste it into a message. It goes to: ' + who + '.' : 'Copied. Paste it into the chat.', copyBtn);
    });
    main.appendChild(el('div', {class: 'rowgap'}, [copyBtn, btn('download-export', 'Download as a file', '', function () { download(fname, text, msg); })]));
    main.appendChild(msg);
    main.appendChild(el('label', {for: 'export-text', style: 'margin-top:.9rem', text: (I.mode === 'survey' ? 'The response block' : 'The full export') + ' (' + plural(lines, 'line', 'lines') + '). Everything is here even if copying fails.'}));
    main.appendChild(box);
    if (I.mode !== 'quiz' && I.tallies.length) {
      main.appendChild(el('h2', {class: 'sub-h', text: 'Counts'}));
      main.appendChild(el('ul', {class: 'tallies', id: 'tallies'}, tallies().map(function (t) {
        return el('li', {'data-tally': t.id}, [el('span', {text: t.label + (t.answered < t.of ? ' (' + t.answered + ' of ' + t.of + ' answered)' : '')}), el('span', {class: 'c', text: t.count + ' of ' + t.of})]);
      })));
      main.appendChild(el('p', {class: 'caveat', id: 'tally-caveat', text: TALLY_LINE}));
    }
    main.appendChild(el('div', {class: 'rowgap', style: 'margin-top:1.25rem'}, [
      I.mode === 'quiz' ? null : btn('change-answers', 'Change answers', '', function () { ST.stage = 'review'; save(); render({focus: true}); }),
      btn('start-again', 'Start again', '', function () { openPanel(true); askReset(); })
    ]));
    setBar([]);
  }
  function renderProblem() {
    var main = $('main');
    if (UI.dataProblems.length) {
      main.appendChild(el('div', {class: 'lead'}, [el('h1', {tabindex: '-1', id: 'screen-h', text: 'This questionnaire cannot open'}), el('p', {text: 'Its data block has a fault. Nothing you do here can lose answers, because none have been taken yet. Whoever built this file can find the fault with scripts/validate_instrument.py.'})]));
      main.appendChild(el('div', {class: 'errbox', id: 'data-problems', role: 'alert'}, [el('ul', {}, UI.dataProblems.slice(0, 12).map(function (p) { return el('li', {text: p}); }))]));
    } else {
      main.appendChild(el('div', {class: 'blank', id: 'no-questions'}, [el('h1', {tabindex: '-1', id: 'screen-h', class: 'sub-h', text: 'No questions yet'}), el('p', {text: 'The data block has an empty question list. Add questions between the two marker lines in this file, then open it again.'})]));
    }
    setBar([]);
    $('panel-toggle').hidden = true;
  }
  function render(opts) {
    opts = opts || {};
    var main = $('main'), keep = null;
    if (opts.keepFocus && document.activeElement && document.activeElement.id) keep = document.activeElement.id;
    main.textContent = '';
    main.removeAttribute('aria-busy');
    if (ST.stage === 'loading') {
      main.setAttribute('aria-busy', 'true');
      main.appendChild(el('div', {class: 'lead'}, [el('h1', {id: 'screen-h', text: I ? I.title : 'Questionnaire'}), el('p', {id: 'loading', text: 'Looking for saved answers.'})]));
      setBar([]); drawProgress(); return;
    }
    if (ST.stage === 'problem') { renderProblem(); drawProgress(); return; }
    lastVisKey = visKey();
    if (ST.stage === 'intro') renderIntro();
    else if (ST.stage === 'disclosure') renderDisclosure();
    else if (ST.stage === 'q') { if (useSections()) renderSection(); else renderQuestion(); }
    else if (ST.stage === 'review') renderReview();
    else renderDone();
    drawProgress();
    if (opts.focus || opts.focusId) {
      say('');
      window.scrollTo(0, 0);
      var target = (opts.focusId && $(opts.focusId)) || $('screen-h') || (ST.cur && $('qt-' + ST.cur)) || main;
      if (target) { try { target.focus({preventScroll: !opts.focusId}); } catch (e) { target.focus(); } if (opts.focusId && target.scrollIntoView) target.scrollIntoView({block: 'center'}); }
    } else if (keep && $(keep)) $(keep).focus();
  }

  // ------------------------------------------------------------------ display choices
  var display = {theme: 'paper', size: 'standard', density: 'comfortable', motion: 'on', layout: 'one'};
  function displayDefaults() {
    var calm = false;
    try { calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { calm = false; }
    return {theme: 'paper', size: 'standard', density: 'comfortable', motion: calm ? 'off' : 'on', layout: I ? I.layout : 'one'};
  }
  function applyDisplay() {
    var root = document.documentElement;
    root.setAttribute('data-theme', display.theme);
    root.setAttribute('data-size', display.size);
    root.setAttribute('data-density', display.density);
    root.setAttribute('data-motion', display.motion);
    document.querySelectorAll('[data-set]').forEach(function (b) { b.setAttribute('aria-pressed', String(display[b.getAttribute('data-set')] === b.getAttribute('data-val'))); });
    $('layout-choice').hidden = !I || I.mode === 'quiz';
  }
  function readDisplay(text) {
    var v = null;
    try { v = JSON.parse(text || 'null'); } catch (e) { v = null; }
    if (!v || typeof v !== 'object') return;
    if (THEMES.indexOf(v.theme) >= 0) display.theme = v.theme;
    if (SIZES.indexOf(v.size) >= 0) display.size = v.size;
    if (DENSITIES.indexOf(v.density) >= 0) display.density = v.density;
    if (v.motion === 'on' || v.motion === 'off') display.motion = v.motion;
    if (v.layout && typeof v.layout === 'object' && I && (v.layout[I.id] === 'one' || v.layout[I.id] === 'sections')) display.layout = v.layout[I.id];
  }
  var layoutMemo = {};
  function writeDisplay() {
    if (I) layoutMemo[I.id] = display.layout;
    store.set('elicitor:display', JSON.stringify({theme: display.theme, size: display.size, density: display.density, motion: display.motion, layout: layoutMemo}));
  }

  // ------------------------------------------------------------------ the panel: resume code, import, reset
  function openPanel(open) {
    $('panel').hidden = !open;
    $('bar').hidden = open;            // the question's buttons wait underneath while the panel is open
    $('panel-toggle').setAttribute('aria-expanded', String(open));
    if (open) { drawStoreNote(); $('panel-h').focus(); } else { $('panel-toggle').focus(); }
  }
  function showResume() {
    $('resume-box').hidden = false;
    $('resume-text').value = JSON.stringify(envelope());
    $('resume-msg').className = 'msg';
    $('resume-msg').textContent = 'This code holds your answers so far. It is as long as your answers are.';
  }
  function importMsg(text, bad) { var m = $('import-msg'); m.className = 'msg' + (bad ? ' bad' : ''); m.textContent = text; }
  function applyImport(res) {
    var before = snapshot(), n = Object.keys(res.state.ans).length;
    ST = res.state; UI.fromReview = false; UI.errors = {}; UI.raw = {}; UI.pendingImport = null; UI.finishTried = false;
    $('import-confirm').hidden = true; $('import-text').value = '';
    saveNow();
    openPanel(false);
    render({focus: true});
    say('Loaded the ' + res.kind + ': ' + plural(n, 'question', 'questions') + ' restored.' + (res.dropped.length ? ' Left out: ' + res.dropped.join('; ') + '.' : ''), false,
      function () { restore(before, 'The answers you had before loading are back.'); });
  }
  function tryImport(text) {
    $('import-confirm').hidden = true; UI.pendingImport = null;
    var res = readIncoming(text);
    if (!res.ok) { importMsg(res.why + ' Nothing was changed: your current answers are as they were.', true); $('import-text').setAttribute('aria-invalid', 'true'); $('import-text').focus(); return; }
    $('import-text').removeAttribute('aria-invalid');
    if (res.version !== I.version) {
      UI.pendingImport = res;
      importMsg('', false);
      $('import-confirm-text').textContent = 'This ' + res.kind + ' was made with version ' + res.version + ' of the questionnaire, and this page is version ' + I.version + '. '
        + plural(Object.keys(res.state.ans).length, 'question matches', 'questions match') + ' and can be loaded.'
        + (res.dropped.length ? ' These cannot: ' + res.dropped.join('; ') + '.' : ' Nothing would be left out.') + ' Loading replaces your current answers.';
      $('import-confirm').hidden = false;
      $('import-keep').focus();
      return;
    }
    if (res.dropped.length) {
      importMsg('The code does not fit this questionnaire (' + res.dropped.slice(0, 3).join('; ') + '). It may have been edited or cut. Nothing was changed: your current answers are as they were.', true);
      $('import-text').setAttribute('aria-invalid', 'true'); $('import-text').focus();
      return;
    }
    importMsg('', false);
    applyImport(res);
  }
  function askReset() {
    var c = counts(visible());
    $('reset-text').textContent = 'Starting again clears ' + plural(c.answered, 'answer', 'answers') + ', ' + plural(c.skipped, 'skip mark', 'skip marks') + ' and ' + plural(c.notes, 'note', 'notes') + ' from this page' + (store.kind === 'memory' ? '.' : ' and from its saved copy.') + ' Get a resume code first if you might want them back.';
    $('reset-confirm').hidden = false;
    $('reset-cancel').focus();
  }
  function wirePanel() {
    $('panel-toggle').addEventListener('click', function () { openPanel($('panel').hidden); });
    $('panel-close').addEventListener('click', function () { openPanel(false); });
    $('resume-make').addEventListener('click', showResume);
    $('resume-copy').addEventListener('click', function () { copyFrom($('resume-text'), $('resume-msg'), 'Copied. Keep it somewhere you can reach from the other device.', $('resume-copy')); });
    $('resume-download').addEventListener('click', function () { download(I.id + '-resume.json', $('resume-text').value, $('resume-msg')); });
    $('import-open').addEventListener('click', function () {
      var open = $('import-box').hidden;
      $('import-box').hidden = !open; this.setAttribute('aria-expanded', String(open));
      if (open) $('import-text').focus();
    });
    $('import-go').addEventListener('click', function () { tryImport($('import-text').value); });
    $('import-file').addEventListener('change', function () {
      var f = this.files && this.files[0], input = this;
      if (!f) return;
      if (f.size > 4000000) { importMsg('That file is larger than any export from this page (over 4 MB). Nothing was changed.', true); input.value = ''; return; }
      importMsg('Reading the file.', false);
      var r = new FileReader();
      r.onload = function () { input.value = ''; tryImport(String(r.result)); };
      r.onerror = function () { input.value = ''; importMsg('The file could not be read. Nothing was changed. Paste its text into the box instead.', true); };
      r.readAsText(f);
    });
    $('import-keep').addEventListener('click', function () { UI.pendingImport = null; $('import-confirm').hidden = true; importMsg('Nothing was loaded. Your current answers are as they were.', false); $('import-text').focus(); });
    $('import-continue').addEventListener('click', function () { if (UI.pendingImport) applyImport(UI.pendingImport); });
    $('reset-ask').addEventListener('click', askReset);
    $('reset-cancel').addEventListener('click', function () { $('reset-confirm').hidden = true; $('reset-ask').focus(); });
    $('reset-export').addEventListener('click', function () { showResume(); $('resume-text').focus(); });
    $('reset-go').addEventListener('click', function () {
      var before = snapshot();
      ST = freshState(); UI.fromReview = false; UI.errors = {}; UI.raw = {}; UI.finishTried = false; UI.filter = 'all';
      $('reset-confirm').hidden = true; $('resume-box').hidden = true;
      saveNow(); openPanel(false); render({focus: true});
      say('Cleared. The questionnaire is back at the start.', false, function () { restore(before, 'Your answers are back.'); });
    });
    document.querySelectorAll('[data-set]').forEach(function (b) {
      b.addEventListener('click', function () {
        var key = b.getAttribute('data-set'), val = b.getAttribute('data-val'), was = display.layout;
        display[key] = val; writeDisplay(); applyDisplay();
        if (key === 'layout' && was !== val && ST.stage === 'q') { UI.errors = {}; render({}); }
        else if (key === 'layout') drawProgress();
      });
    });
    $('display-reset').addEventListener('click', function () {
      var was = display.layout;
      display = displayDefaults(); writeDisplay(); applyDisplay();
      if (was !== display.layout && ST.stage === 'q') render({});
      $('display-note').textContent = 'Display is back to its defaults.' + (store.kind === 'memory' ? ' Choices last for this visit only.' : '');
    });
  }
  // Enter in a one-line field does what the main button does. There is no form to submit.
  document.addEventListener('keydown', function (ev) {
    var t = ev.target;
    if (ev.key !== 'Enter' || !t || t.tagName !== 'INPUT' || t.type !== 'text') return;
    ev.preventDefault();
    if (t.id === 'import-text') return;
    var main = $('btn-next') || $('btn-start');
    if (main && $('main').contains(t) && !(ST.stage === 'q' && useSections())) main.click();
  });
  window.addEventListener('pagehide', function () { if (saveTimer !== null) { clearTimeout(saveTimer); saveNow(); } });

  // ------------------------------------------------------------------ start
  function boot() {
    var probs = loadInstrument();
    if (probs.length || !Q.length) {
      UI.dataProblems = probs; ST = {stage: 'problem', ans: {}};
      if (I) { document.title = I.title; $('doc-title').textContent = I.title; }
      render({}); return;
    }
    document.title = I.title;
    $('doc-title').textContent = I.title;
    ST = {stage: 'loading', ans: {}, cur: null};
    display = displayDefaults();
    applyDisplay();
    render({});
    wirePanel();
    store.init().then(function () {
      return Promise.all([store.get('elicitor:display'), store.get(stateKey())]);
    }).then(function (got) {
      try { var memo = JSON.parse(got[0] || 'null'); if (memo && memo.layout && typeof memo.layout === 'object') layoutMemo = memo.layout; } catch (e) { layoutMemo = {}; }
      readDisplay(got[0]);
      applyDisplay();
      var res = got[1] ? readEnvelope(got[1]) : null;
      if (res && res.ok && res.version === I.version && !res.dropped.length) {
        ST = res.state;
        if (ST.stage === 'q' || ST.stage === 'review' || ST.stage === 'done') UI.justResumed = true;
      } else {
        ST = freshState();
        if (res && res.ok && Object.keys(res.state.ans).length) UI.pendingStale = got[1];
      }
      drawStoreNote();
      render({});
      if (UI.justResumed) say('Picked up where you left off. ' + store.words());
      else if (UI.pendingStale) say('Saved answers from another version of this questionnaire were found and not loaded. To load them, open Save and display: the saved code is already in the box there, so press Load it. They are replaced as soon as you answer or skip a question here.');
      if (UI.pendingStale) { $('import-box').hidden = false; $('import-open').setAttribute('aria-expanded', 'true'); $('import-text').value = UI.pendingStale; }
    });
  }
  boot();
})();
</script>
</body>
