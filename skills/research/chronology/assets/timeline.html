<!doctype html>
<html lang="en" data-theme="paper" data-density="comfortable" data-text="standard">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timeline</title>
<!--
  Timeline viewer. One file, no build step, no outside requests.
  The data block near the end of the body is filled in by scripts/build_timeline.py, which first
  runs scripts/chronology_check.py on the two CSV files. This page decides nothing about the data:
  it shows each date as precisely as it was recorded and never fills in a day or a month.

  Delivery notes:
  - No form element and no submit event. Controls are type=button with click handlers.
  - No alert, confirm or prompt.
  - Storage is optional. Display settings are kept by a host storage object if one is present,
    else by the browser, else for the visit only, and the page says which.
  - Exports are offered as text in the page as well as a download, because a sandboxed frame can
    refuse both downloads and the clipboard.
  - Text is always set as text. No markup is built from data.
  The page holds no work of the reader's: nothing is edited here, so there is nothing to import.
-->
<style>
:root{
  --bg:#f5efe4;--surface:#fffaf1;--raised:#fbf4e6;--ink:#2a2320;--muted:#62574d;--line:#d6c9b5;
  --accent:#8a3f17;--on-accent:#fffaf1;--accent-soft:#f0dccb;
  --warn:#8a2718;--warn-soft:#f6ddd3;--focus:#1b5a8a;
  --pad:12px;--gap:14px;--target:44px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;
}
:root[data-theme="slate"]{
  --bg:#eef1f3;--surface:#fbfcfd;--raised:#f3f6f8;--ink:#1f2a30;--muted:#4d5c66;--line:#c6d0d6;
  --accent:#225877;--on-accent:#fbfcfd;--accent-soft:#d6e4ec;
  --warn:#87271f;--warn-soft:#f3dcd8;--focus:#7a3c12;
}
:root[data-theme="ember"]{
  --bg:#231c18;--surface:#2d2520;--raised:#372d27;--ink:#f3e9dc;--muted:#c6b7a6;--line:#5a4b40;
  --accent:#f0a36b;--on-accent:#231c18;--accent-soft:#4a3528;
  --warn:#ffb3a1;--warn-soft:#4c2a23;--focus:#9fd0f2;
}
:root[data-theme="night"]{
  --bg:#12171c;--surface:#1a2128;--raised:#222b33;--ink:#e8eef2;--muted:#adbcc6;--line:#3f4d58;
  --accent:#8cc4e8;--on-accent:#12171c;--accent-soft:#243846;
  --warn:#ffb5a8;--warn-soft:#452622;--focus:#f2c08a;
}
:root[data-density="compact"]{--pad:5px;--gap:8px}
:root[data-text="large"]{font-size:112.5%}
:root[data-text="larger"]{font-size:125%}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 var(--sans)}
[hidden]{display:none !important}
.page{max-width:1120px;margin:0 auto;padding:20px 16px 64px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px}
.head{min-width:0;flex:1 1 180px}
h1{font:600 1.7rem/1.15 var(--serif);margin:0;letter-spacing:-.01em;overflow-wrap:anywhere}
.facts{color:var(--muted);margin:4px 0 0;font-size:.95rem}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn,.seg{min-height:var(--target);padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:6px}
.btn:hover,.seg:hover{border-color:var(--ink)}
.seg[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent);font-weight:600}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:0 6px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
label,.lab{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
input[type=search],input[type=text],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-height:var(--target);padding:0 10px;width:100%}
input[aria-invalid="true"]{border-color:var(--warn);border-width:2px}
textarea{padding:10px;font:.85rem/1.45 var(--mono);min-height:11rem;resize:vertical;white-space:pre;overflow:auto}

.panel{margin-top:12px;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:12px}
.panel h2{font:600 1rem var(--sans);margin:0}
.choice{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.choice .lab{width:100%;margin:0}
.note{color:var(--muted);font-size:.875rem;margin:0}

.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;margin-top:16px}
.tools{display:grid;gap:12px;align-content:start}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.tools .row .btn,.tools .row .seg{padding:0 12px}
.filters{display:grid;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.gapset{display:grid;grid-template-columns:auto minmax(0,7rem);gap:8px;align-items:end}
.err{color:var(--warn);font-size:.85rem;font-weight:600;margin:4px 0 0}
.err[data-show="no"]{display:none}
.statusrow{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:center;min-height:var(--target)}
.status{margin:0;color:var(--muted);font-size:.95rem;display:flex;flex-wrap:wrap;gap:2px 12px;align-items:center}
.status b{color:var(--ink);font-variant-numeric:tabular-nums}
.legend{color:var(--muted);font-size:.8rem;margin:0;display:flex;flex-wrap:wrap;gap:4px 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{position:static}

.year{font:600 1.5rem/1.2 var(--serif);margin:22px 0 0;padding-bottom:4px;border-bottom:1px solid var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.year small{font:400 .85rem var(--sans);color:var(--muted)}
.month{font:600 .8rem var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 0 7px;padding:14px 0 0 21px;border-left:2px solid var(--line)}
.event{position:relative;margin-left:7px;padding:var(--pad) 0 var(--pad) 21px;border-left:2px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr);gap:0 16px}
.mark{position:absolute;left:-8px;top:calc(var(--pad) + 13px);width:14px;height:14px;display:block;box-sizing:border-box}
.mark.day{border-radius:50%;background:var(--ink);border:2px solid var(--bg)}
.mark.month-p{height:8px;top:calc(var(--pad) + 16px);background:var(--bg);border:2px solid var(--ink);border-radius:2px}
.mark.year-p{background:var(--bg);border:2px solid var(--ink);border-radius:2px}
.mark.approx{border-radius:50%;background:var(--bg);border:2px dashed var(--ink)}
.mark.undated{background:var(--bg);border:2px dotted var(--muted);border-radius:2px}
.when{font:600 .95rem/1.4 var(--mono);font-variant-numeric:tabular-nums;padding-top:9px;overflow-wrap:anywhere}
.when span{display:block}
.when .clock{font-weight:400;font-size:.85rem}
.when small{display:block;font:400 .78rem var(--sans);color:var(--muted)}
.what{min-width:0}
.open{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:var(--target);padding:6px 0;margin:0;border:0;background:none;text-align:left;font-weight:600;font-size:1.02rem;line-height:1.35;overflow-wrap:anywhere}
.open::after{content:"+";flex:none;width:28px;height:28px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;font:400 1.1rem/1 var(--mono);color:var(--muted)}
.open[aria-expanded="true"]::after{content:"-"}
.open:hover::after{border-color:var(--ink);color:var(--ink)}
.meta{color:var(--muted);font-size:.875rem;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;overflow-wrap:anywhere}
.meta .src{color:var(--ink)}
.meta .loc{flex:1 1 100%}
.tag{font:600 .72rem var(--sans);letter-spacing:.05em;color:var(--ink);border:1px solid var(--ink);border-radius:3px;padding:1px 6px;white-space:nowrap}
.tag.REPORTED{border-style:dashed}
.tag.ASSESSMENT{border-style:dotted;font-style:italic}
.pair{margin:8px 0 2px;padding:8px 10px;border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:4px;background:var(--surface);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:.9rem}
.pair.open-q{border-left-color:var(--warn);background:var(--warn-soft)}
.pair p{margin:0;flex:1 1 220px;min-width:0;overflow-wrap:anywhere}
.pair b.cls{color:var(--warn)}
.pair:not(.open-q) b.cls{color:var(--ink)}
.pair .letter{font:600 .78rem var(--mono);border:1px solid var(--ink);border-radius:3px;padding:1px 6px;white-space:nowrap}
.more{margin:8px 0 4px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;font-size:.92rem}
.more dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
.more dt{font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.more dt:first-child{margin-top:0}
.more dd{margin:0;overflow-wrap:anywhere}
.more .addr{font:.82rem var(--mono);color:var(--muted)}
a.btn{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);margin-top:6px}
.gap{margin:6px 0 6px 7px;padding:10px 12px 10px 21px;border-left:2px dashed var(--muted);color:var(--muted);font-size:.9rem}
.gap b{color:var(--ink)}
.blank{padding:32px 12px;text-align:center;border:1px dashed var(--line);border-radius:8px;margin-top:16px}
.blank h2{font:600 1.2rem var(--serif);margin:0 0 6px}
.blank p{margin:0 auto 14px;color:var(--muted);max-width:52ch}
.blank.bad h2{color:var(--warn)}
.ghost{height:54px;border-left:2px solid var(--line);margin-left:7px;display:flex;align-items:center;gap:14px;padding-left:21px}
.ghost i{display:block;height:12px;border-radius:6px;background:var(--line)}
.foot{margin-top:28px;color:var(--muted);font-size:.85rem}
@media (max-width:640px){h1{font-size:1.4rem}}
@media (min-width:700px){
  .choice .lab{width:88px}
  .event{grid-template-columns:9.5rem minmax(0,1fr)}
  .more dl{grid-template-columns:6.5rem minmax(0,1fr);gap:6px 14px}
  .more dt{margin-top:2px}
}
@media (min-width:960px){
  .layout{grid-template-columns:340px minmax(0,1fr);align-items:start;gap:28px}
  .tools{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding:2px 4px 8px 2px}
}
@media (prefers-reduced-motion:no-preference){.btn,.seg,.open::after{transition:border-color .12s ease}}
@media print{.tools,#display-toggle,#display,#export,#clear,.open::after{display:none !important}.layout{display:block}}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="head">
      <h1 id="title">Timeline</h1>
      <p class="facts" id="facts">Reading the events.</p>
    </div>
    <button type="button" class="btn" id="display-toggle" aria-expanded="false" aria-controls="display">Display</button>
  </header>

  <section class="panel" id="display" hidden aria-label="Display settings">
    <div class="choice" role="group" aria-label="Theme">
      <span class="lab">Theme</span>
      <button type="button" class="seg" data-set="theme" data-value="paper">Paper</button>
      <button type="button" class="seg" data-set="theme" data-value="slate">Slate</button>
      <button type="button" class="seg" data-set="theme" data-value="ember">Ember</button>
      <button type="button" class="seg" data-set="theme" data-value="night">Night</button>
    </div>
    <div class="choice" role="group" aria-label="Spacing">
      <span class="lab">Spacing</span>
      <button type="button" class="seg" data-set="density" data-value="comfortable">Comfortable</button>
      <button type="button" class="seg" data-set="density" data-value="compact">Compact</button>
    </div>
    <div class="choice" role="group" aria-label="Text size">
      <span class="lab">Text size</span>
      <button type="button" class="seg" data-set="text" data-value="standard">Standard</button>
      <button type="button" class="seg" data-set="text" data-value="large">Large</button>
      <button type="button" class="seg" data-set="text" data-value="larger">Larger</button>
    </div>
    <div class="choice" role="group" aria-label="Date style">
      <span class="lab">Dates</span>
      <button type="button" class="seg" data-set="dates" data-value="words">12 Aug 2021</button>
      <button type="button" class="seg" data-set="dates" data-value="iso">2021-08-12</button>
    </div>
    <div class="choice" role="group" aria-label="Scrolling when jumping to an event">
      <span class="lab">Jumps</span>
      <button type="button" class="seg" data-set="motion" data-value="smooth">Smooth</button>
      <button type="button" class="seg" data-set="motion" data-value="instant">Instant</button>
    </div>
    <div class="choice">
      <button type="button" class="btn quiet" id="display-reset">Reset display</button>
      <p class="note" id="store-note"></p>
    </div>
  </section>

  <div class="layout" id="layout">
    <div class="tools" id="tools" role="search" aria-label="Find and filter events" hidden>
      <div>
        <label for="q">Search events and their sources</label>
        <input type="search" id="q" autocomplete="off" spellcheck="false">
      </div>
      <div class="row">
        <button type="button" class="btn" id="filters-toggle" aria-expanded="false" aria-controls="filters">Filters</button>
        <button type="button" class="seg" id="gaps-toggle" aria-pressed="false">Gaps</button>
        <button type="button" class="seg" id="open-all" aria-pressed="false">Open all</button>
        <button type="button" class="btn" id="export-toggle" aria-expanded="false" aria-controls="export">Export</button>
      </div>
      <div class="filters" id="filters" hidden>
        <div><label for="f-tag">Tag</label><select id="f-tag"></select></div>
        <div><label for="f-actor">Actor</label><select id="f-actor"></select></div>
        <div><label for="f-tier">Source tier</label><select id="f-tier"></select></div>
        <div role="group" aria-label="Status">
          <span class="lab">Status (none chosen shows all)</span>
          <div class="row">
            <button type="button" class="seg" data-status="FACT" aria-pressed="false">FACT</button>
            <button type="button" class="seg" data-status="REPORTED" aria-pressed="false">REPORTED</button>
            <button type="button" class="seg" data-status="ASSESSMENT" aria-pressed="false">ASSESSMENT</button>
          </div>
        </div>
        <div class="row"><button type="button" class="seg" id="conflicts-only" aria-pressed="false">Date conflicts only</button></div>
        <div>
          <label for="gap-days">Gaps: show when longer than (days)</label>
          <input type="text" id="gap-days" inputmode="numeric" autocomplete="off" aria-describedby="gap-err">
          <p class="err" id="gap-err" data-show="no">Enter a whole number of days from 1 to 36500. The last valid number is still in use.</p>
        </div>
      </div>
    </div>

    <main id="main">
      <div class="statusrow" id="statusrow" hidden>
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <button type="button" class="btn quiet" id="clear" hidden>Clear filters</button>
      </div>
      <p class="legend" id="legend" hidden>
        <span>Known to the</span>
        <span><i class="mark day"></i>day</span>
        <span><i class="mark month-p"></i>month</span>
        <span><i class="mark year-p"></i>year</span>
        <span><i class="mark approx"></i>or about</span>
      </p>
      <section class="panel" id="export" hidden aria-labelledby="export-h">
        <h2 id="export-h">Export this view</h2>
        <div class="choice" role="group" aria-label="Export format">
          <span class="lab">Format</span>
          <button type="button" class="seg" data-export="md" aria-pressed="true">Markdown</button>
          <button type="button" class="seg" data-export="csv" aria-pressed="false">CSV</button>
        </div>
        <p class="note" id="export-what"></p>
        <div>
          <label for="export-text">Exported text. It can be selected and copied by hand.</label>
          <textarea id="export-text" readonly spellcheck="false"></textarea>
        </div>
        <div class="row">
          <button type="button" class="btn" id="export-copy">Copy</button>
          <button type="button" class="btn" id="export-download">Download</button>
          <button type="button" class="btn quiet" id="export-close">Close export</button>
        </div>
        <p class="note" id="export-msg" role="status" aria-live="polite"></p>
      </section>
      <div id="timeline" aria-busy="true">
        <div class="ghost" aria-hidden="true"><i style="width:18%"></i><i style="width:44%"></i></div>
        <div class="ghost" aria-hidden="true"><i style="width:14%"></i><i style="width:52%"></i></div>
        <div class="ghost" aria-hidden="true"><i style="width:18%"></i><i style="width:36%"></i></div>
      </div>
    </main>
  </div>
  <p class="foot" id="foot"></p>
</div>

<script type="application/json" id="timeline-data">{"app":"chronology-timeline","schema":1,"title":"Timeline","built_from":{"events":"","sources":""},"gap_days":90,"approx_days":15,"order_rule":"","events":[],"sources":[],"conflicts":[]}</script>

<script>
(function () {
  'use strict';
  var APP = 'chronology-timeline', SCHEMA = 1, KEY = 'chronology-timeline:display';
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var MONTH = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var CLASS_TEXT = {precision: 'Different precision, compatible', timezone: 'Time zone: one moment, two local dates', announcement: 'Announcement against occurrence',
                    disagreement: 'Real disagreement', '': 'Not classified'};
  var PRECISION_NOTE = {day: '', month: 'day not recorded', year: 'month not recorded', approx: 'approximate', undated: 'not placed'};
  var CHOICES = {theme: ['paper', 'slate', 'ember', 'night'], density: ['comfortable', 'compact'], text: ['standard', 'large', 'larger'],
                 dates: ['words', 'iso'], motion: ['smooth', 'instant']};
  var COLS = ['event_id', 'date', 'date_precision', 'end_date', 'time', 'title', 'detail', 'actors', 'source_id', 'locator', 'status', 'conflicts_with', 'tags'];
  var D = null, byId = {}, srcById = {}, pairsOf = {};
  var S = {q: '', tag: '', actor: '', tier: '', status: {}, conflictsOnly: false, gaps: false, gapDays: 90, open: {}, openAll: false, exportKind: ''};
  var settings = defaults();
  var store = {kind: 'memory'};
  var $ = function (id) { return document.getElementById(id); };

  function systemMotion() {
    try { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth'; } catch (e) { return 'instant'; }
  }
  function defaults() { return {theme: 'paper', density: 'comfortable', text: 'standard', dates: 'words', motion: systemMotion()}; }

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'on') Object.keys(attrs.on).forEach(function (ev) { n.addEventListener(ev, attrs.on[ev]); });
      else if (attrs[k] !== false && attrs[k] != null) n.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }

  // ---------- display settings: host storage, then the browser, then this visit only ----------
  function hostStorage() {
    try { var h = window.storage; if (h && typeof h.get === 'function' && typeof h.set === 'function') return h; } catch (e) { /* not available */ }
    return null;
  }
  function readSaved(v) {
    try {
      if (typeof v === 'string') v = JSON.parse(v);
      if (v && typeof v === 'object' && !('app' in v) && 'value' in v) return readSaved(v.value);
      if (!v || v.app !== APP || v.schema !== SCHEMA || !v.data || typeof v.data !== 'object') return null;
      var out = defaults();
      Object.keys(CHOICES).forEach(function (k) { if (CHOICES[k].indexOf(v.data[k]) >= 0) out[k] = v.data[k]; });
      return out;
    } catch (e) { return null; }
  }
  function loadSettings(done) {
    var called = false;
    function finish(v) { if (!called) { called = true; done(v); } }
    function browser() {
      try {
        var raw = window.localStorage.getItem(KEY);
        window.localStorage.setItem(KEY + ':probe', '1');
        window.localStorage.removeItem(KEY + ':probe');
        store.kind = 'browser';
        finish(readSaved(raw));
      } catch (e) { store.kind = 'memory'; finish(null); }
    }
    var h = hostStorage();
    if (h) {
      try {
        Promise.resolve(h.get(KEY)).then(function (v) { store.kind = 'host'; finish(readSaved(v)); }, browser);
        return;
      } catch (e) { /* fall through to the browser */ }
    }
    browser();
  }
  function saveSettings() {
    var text = JSON.stringify({app: APP, schema: SCHEMA, content_id: 'display-settings', saved_at: new Date().toISOString(), data: settings});
    try {
      if (store.kind === 'host') {
        Promise.resolve(hostStorage().set(KEY, text)).then(null, function () { store.kind = 'memory'; storeNote(); });
      } else if (store.kind === 'browser') {
        window.localStorage.setItem(KEY, text);
      }
    } catch (e) { store.kind = 'memory'; }
    storeNote();
  }
  function storeNote() {
    $('store-note').textContent = store.kind === 'host' ? 'Display settings are saved by the app showing this page.'
      : store.kind === 'browser' ? 'Display settings are saved in this browser.'
      : 'Not saved: this page cannot store data here. Display settings last for this visit.';
  }
  function applySettings() {
    var root = document.documentElement;
    root.setAttribute('data-theme', settings.theme);
    root.setAttribute('data-density', settings.density);
    root.setAttribute('data-text', settings.text);
    document.querySelectorAll('[data-set]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(settings[b.getAttribute('data-set')] === b.getAttribute('data-value')));
    });
    storeNote();
  }

  // ---------- dates: shown exactly as precise as recorded ----------
  function fmt(s) {

    $('foot').textContent = (D.order_rule || '') + ' Approximate dates are widened by ' + D.approx_days + ' days each side (one month or one year for approximate months and years) when gaps are worked out.' +
      (D.built_from && D.built_from.events ? ' Built from ' + D.built_from.events + ' and ' + D.built_from.sources + '.' : '');
    $('tools').hidden = false; $('legend').hidden = false; $('statusrow').hidden = false;
    var wide = false;
    try { wide = window.matchMedia('(min-width: 960px)').matches; } catch (e) { wide = false; }
    $('filters').hidden = !wide;
    $('filters-toggle').setAttribute('aria-expanded', String(wide));
    render();
  }

  // ---------- wiring ----------
  var timer = null;
  $('q').addEventListener('input', function () {
    var v = this.value.trim();
    clearTimeout(timer);
    timer = setTimeout(function () { S.q = v; render(); }, 120);
  });
  [['f-tag', 'tag'], ['f-actor', 'actor'], ['f-tier', 'tier']].forEach(function (pair) {
    $(pair[0]).addEventListener('change', function () { S[pair[1]] = this.value; render(); });
  });
  document.querySelectorAll('[data-status]').forEach(function (b) {
    b.id = 'status-' + b.getAttribute('data-status');
    b.addEventListener('click', function () {
      var k = b.getAttribute('data-status');
      S.status[k] = !S.status[k];
      b.setAttribute('aria-pressed', String(!!S.status[k]));
      render();
    });
  });
  $('conflicts-only').addEventListener('click', function () { S.conflictsOnly = !S.conflictsOnly; this.setAttribute('aria-pressed', String(S.conflictsOnly)); render(); });
  $('gaps-toggle').addEventListener('click', function () { S.gaps = !S.gaps; this.setAttribute('aria-pressed', String(S.gaps)); render(); });
  $('open-all').addEventListener('click', function () {
    S.openAll = !S.openAll;
    if (!S.openAll) S.open = {};
    this.setAttribute('aria-pressed', String(S.openAll));
    render();
  });
  $('gap-days').addEventListener('input', function () {
    var v = this.value.trim(), ok = /^\d{1,5}$/.test(v) && parseInt(v, 10) >= 1 && parseInt(v, 10) <= 36500;
    this.setAttribute('aria-invalid', String(!ok));
    $('gap-err').setAttribute('data-show', ok ? 'no' : 'yes');
    if (ok) { S.gapDays = parseInt(v, 10); render(); }
  });
  $('filters-toggle').addEventListener('click', function () {
    var open = this.getAttribute('aria-expanded') !== 'true';
    this.setAttribute('aria-expanded', String(open));
    $('filters').hidden = !open;
  });
  $('display-toggle').addEventListener('click', function () {
    var open = this.getAttribute('aria-expanded') !== 'true';
    this.setAttribute('aria-expanded', String(open));
    $('display').hidden = !open;
  });
  document.querySelectorAll('[data-set]').forEach(function (b) {
    b.id = 'set-' + b.getAttribute('data-set') + '-' + b.getAttribute('data-value');
    b.addEventListener('click', function () {
      settings[b.getAttribute('data-set')] = b.getAttribute('data-value');
      applySettings(); saveSettings();
      if (D && D.events.length) render();
    });
  });
  $('display-reset').addEventListener('click', function () {
    settings = defaults();
    applySettings(); saveSettings();
    if (D && D.events.length) render();
  });
  $('export-toggle').addEventListener('click', function () { if (S.exportKind) closeExport(); else openExport('md'); });
  document.querySelectorAll('[data-export]').forEach(function (b) {
    b.id = 'export-kind-' + b.getAttribute('data-export');
    b.addEventListener('click', function () { openExport(b.getAttribute('data-export')); });
  });
  $('clear').addEventListener('click', function () { clearFilters(); render(); $('q').focus(); });
  $('export-close').addEventListener('click', closeExport);
  $('export-copy').addEventListener('click', copyExport);
  $('export-download').addEventListener('click', downloadExport);

  applySettings();
  loadSettings(function (saved) {
    if (saved) settings = saved;
    applySettings();
    if (D && D.events.length) render();
  });
  setTimeout(start, 0);
})();
</script>
</body>
</html>
