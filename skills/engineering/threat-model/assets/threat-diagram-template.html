<!doctype html>
<html lang="en" data-theme="paper" data-density="comfortable" data-text="standard" data-motion="smooth">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threat model drawing</title>
<!--
  A reading aid for one threat-model.json, written by scripts/threat_diagram.py. One file, no build
  step, no outside requests. The model and the checker's result are embedded as data below; the
  page draws them and decides nothing. To change what it shows, change the model and run the
  script again.

  Delivery notes:
  - No form element, no alert, confirm or prompt. Buttons are type=button with click handlers.
  - Every string from the model is set as text. Nothing is assembled as markup.
  - Storage is optional. Display choices are kept if the host or the browser allows it and still
    apply for the visit if not; the page says which.
  - Copying uses the clipboard if allowed; the same text is always in a box on the page.
-->
<style>
:root{
  --bg:#f6f0e6;--surface:#fffaf2;--raised:#fbf3e4;--zone:#efe6d6;--ink:#2b2420;--muted:#62574d;--line:#d2c4af;--line-strong:#8b7d6c;
  --accent:#8a3f17;--on-accent:#fffaf2;--accent-soft:#f1dccb;--warn:#8c2a1b;--warn-soft:#f6ddd3;--ok:#2a6144;--ok-soft:#dcecdf;
  --focus:#1d5a88;--wire:#6b5f53;--wire-dim:#c9bca8;
  --pad:14px;--gap:14px;--target:44px;--card-gap:14px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;
}
:root[data-theme="slate"]{
  --bg:#eef1f3;--surface:#fbfcfd;--raised:#f3f6f8;--zone:#e3e9ed;--ink:#1f2a30;--muted:#4f5e68;--line:#c5d0d7;--line-strong:#73838e;
  --accent:#1f5878;--on-accent:#fbfcfd;--accent-soft:#d6e4ec;--warn:#8a2a22;--warn-soft:#f3dcd8;--ok:#25614a;--ok-soft:#d9ebe2;
  --focus:#7a3c12;--wire:#55646e;--wire-dim:#bcc8cf;
}
:root[data-theme="ember"]{
  --bg:#221b17;--surface:#2c2420;--raised:#362c26;--zone:#281f1a;--ink:#f3e9dc;--muted:#c4b5a4;--line:#55473d;--line-strong:#9a8878;
  --accent:#f0a36b;--on-accent:#221b17;--accent-soft:#4a3528;--warn:#ffac99;--warn-soft:#4c2a23;--ok:#9ed6b3;--ok-soft:#24392d;
  --focus:#9fd0f2;--wire:#b9a998;--wire-dim:#5d4f44;
}
:root[data-theme="night"]{
  --bg:#12171c;--surface:#1a2128;--raised:#222b33;--zone:#161c22;--ink:#e8eef2;--muted:#a9b8c2;--line:#3a4853;--line-strong:#7d8f9b;
  --accent:#8cc4e8;--on-accent:#12171c;--accent-soft:#243846;--warn:#ffb0a3;--warn-soft:#452622;--ok:#9bd8b6;--ok-soft:#1f3a2e;
  --focus:#f2c08a;--wire:#a3b4bf;--wire-dim:#44535e;
}
:root[data-density="compact"]{--pad:9px;--gap:10px;--card-gap:8px}
:root[data-text="large"]{font-size:118%}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root[data-motion="smooth"]{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 var(--sans)}
.wrap{max-width:1240px;margin:0 auto;padding:18px 16px 96px}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:10px}
header.top>div{min-width:0}
.eyebrow{margin:0 0 2px;color:var(--muted);font-size:.85rem}
h1{font:600 1.4rem/1.2 var(--serif);margin:0;overflow-wrap:anywhere}
.tally{color:var(--muted);margin:6px 0 0;font-size:.93rem}
button{font:inherit;color:inherit;cursor:pointer}
.btn{min-height:var(--target);max-width:100%;padding:6px 14px;border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;overflow-wrap:break-word}
header.top .btn{flex:0 0 auto}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[hidden]{display:none !important}

.panel{margin-top:12px;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:12px}
.choice{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.choice .lab{width:84px;color:var(--muted);font-size:.9rem}
.seg{min-height:var(--target);padding:0 14px;border:1px solid var(--line-strong);background:var(--surface);border-radius:6px}
.seg[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent);font-weight:600}
.note{color:var(--muted);font-size:.9rem;margin:0}
.banner{margin:12px 0 0;padding:10px 12px;border:2px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:6px}
.banner b{color:var(--warn)}
.banner ul{margin:6px 0 0;padding-left:20px}

.tools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:14px 0 4px}
.tools .lab{color:var(--muted);font-size:.9rem}
.status{min-height:1.6em;margin:6px 0 8px;color:var(--muted);font-size:.93rem}

.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:900px){
  .layout{grid-template-columns:minmax(0,7fr) minmax(0,5fr);align-items:start}
  .detail{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
  .peek,.back-row{display:none !important}
}
.drawing h2,.detail h2{font:600 1.1rem/1.25 var(--serif);margin:0 0 8px}
.canvas{position:relative;z-index:0}
.wires{position:absolute;left:0;top:0;z-index:1;pointer-events:none;overflow:visible}
.wire{fill:none;stroke:var(--wire);stroke-width:1.5}
.wire.boundary{stroke-width:3}
.head{fill:var(--wire);stroke:none}
.wires.has-sel .wire:not(.hot){stroke:var(--wire-dim)}
.wires.has-sel .head:not(.hot){fill:var(--wire-dim)}
.wire.hot{stroke:var(--accent);stroke-width:2.5}
.wire.boundary.hot{stroke-width:4}
.head.hot{fill:var(--accent)}

.zone{background:var(--zone);border:2px dashed var(--line-strong);border-radius:10px;padding:6px var(--gut) 12px}
.zone-name{position:relative;z-index:2;display:inline-flex;align-items:center;min-height:var(--target);max-width:100%;padding:0 10px;margin:0 0 4px -4px;
  border:0;border-radius:6px;background:transparent;font:600 .95rem var(--sans);text-align:left;text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere;
  text-shadow:0 0 3px var(--zone),0 0 3px var(--zone),0 0 4px var(--zone),0 0 5px var(--zone)}
.zone-name[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--ink);text-shadow:none}
.zone-empty{position:relative;z-index:2;margin:0;color:var(--muted);font-size:.9rem}
.row{display:grid;gap:12px}
.row.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.row.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.arcs{height:0}
.corridor{height:30px}
.node{position:relative;z-index:2;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:64px;width:100%;padding:var(--pad) 10px;text-align:left;
  background:var(--surface);border:1.5px solid var(--ink);border-radius:4px}
.node.k-process{border-radius:16px}
.node.k-store{border-left-color:transparent;border-right-color:transparent;border-top-width:3px;border-bottom-width:3px;border-radius:0}
.node.k-human{border-style:dotted;border-width:2px}
.node .kind{font:.72rem/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.node .nm{font-weight:600;font-size:.92rem;line-height:1.25;overflow-wrap:anywhere}
.node .ct,.chip .ct{font-size:.78rem;line-height:1.2;color:var(--muted)}
.node .ct.has,.chip .ct.has{color:var(--warn);font-weight:600}
.node[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--accent-soft);box-shadow:0 0 0 3px var(--ink)}
.chip{position:absolute;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:54px;min-height:var(--target);padding:2px 8px;
  background:var(--surface);border:1.5px solid var(--ink);border-radius:22px;white-space:nowrap;transform:translate(-50%,-50%)}
.chip .fid{font:600 .86rem/1.2 var(--mono)}
.chip.boundary{border-width:4px;border-style:double}
.legend{margin:10px 0 0;color:var(--muted);font-size:.86rem}
.legend b{color:var(--ink);font-weight:600}

.detail{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.facts{margin:0 0 10px;padding:0;list-style:none;font-size:.93rem}
.facts li{padding:3px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.facts .k{color:var(--muted)}
.jump{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.jump.tight{margin:8px 0 0}
.note.lead{margin:0 0 10px}
.cards{list-style:none;margin:0;padding:0;display:grid;gap:var(--card-gap)}
.card{border:1px solid var(--line-strong);border-radius:6px;padding:var(--pad) 12px;background:var(--bg)}
.card h3{font:600 .98rem/1.3 var(--sans);margin:0 0 4px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.card h3 .tid{font-family:var(--mono)}
.tag{display:inline-block;padding:1px 8px;border-radius:4px;font-size:.82rem;font-weight:600;border:1px solid currentColor}
.tag.open{color:var(--warn);background:var(--warn-soft)}
.tag.done{color:var(--ok);background:var(--ok-soft)}
.tag.other{color:var(--ink);background:var(--raised)}
.card p{margin:4px 0;overflow-wrap:anywhere}
.cards.index{gap:6px}
.trow{display:block;width:100%;min-height:var(--target);padding:8px 12px;text-align:left;border:1px solid var(--line-strong);border-radius:6px;background:var(--bg)}
.trow-top{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-weight:600}
.trow-top .tid{font-family:var(--mono)}
.trow-where{display:block;color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.card .k{color:var(--muted)}
.mits{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.mits li{border-top:1px solid var(--line-strong);padding:6px 0 0;font-size:.93rem;overflow-wrap:anywhere}
.mits .ver{display:block;color:var(--muted);font-size:.88rem}
.blank{padding:18px 8px;text-align:center}
.blank h3{font:600 1.05rem var(--serif);margin:0 0 6px}
.blank p{margin:0 auto 12px;color:var(--muted);max-width:46ch}
.back-row{margin:0 0 10px}

.peek{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:10px;align-items:center;padding:8px 16px;background:var(--surface);border-top:2px solid var(--ink)}
.peek p{margin:0;flex:1 1 auto;min-width:0;font-size:.9rem;line-height:1.3;overflow-wrap:anywhere}
.peek .btn{flex:0 0 auto;min-width:64px}
.extra{margin-top:22px;display:grid;gap:10px}
.extra .panel{margin-top:0}
.extra ul{margin:0;padding-left:20px}
.extra h3{font:600 .95rem var(--sans);margin:0}
textarea{font:.85rem/1.45 var(--mono);color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;width:100%;min-height:220px;padding:10px;resize:vertical}
label{display:block;font-size:.88rem;color:var(--muted);margin-bottom:4px}
.foot{margin-top:24px;color:var(--muted);font-size:.86rem}
.fatal{margin:24px 0;padding:16px;border:2px solid var(--warn);background:var(--warn-soft);border-radius:8px}
.fatal h2{font:600 1.15rem var(--serif);margin:0 0 6px}
@media (max-width:520px){h1{font-size:1.2rem}}
@media (prefers-reduced-motion:no-preference){:root[data-motion="smooth"] .node,:root[data-motion="smooth"] .chip,:root[data-motion="smooth"] .seg,:root[data-motion="smooth"] .wire{transition:background-color .12s ease,stroke .12s ease}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow" id="eyebrow">Threat model drawing</p>
      <h1 id="system">Loading the model.</h1>
      <p class="tally" id="tally"></p>
    </div>
    <button type="button" class="btn" id="display-toggle" aria-expanded="false" aria-controls="display">Display</button>
  </header>

  <section class="panel" id="display" hidden aria-label="Display choices">
    <div class="choice" role="group" aria-label="Theme">
      <span class="lab">Theme</span>
      <button type="button" class="seg" data-set="theme" data-val="paper">Paper</button>
      <button type="button" class="seg" data-set="theme" data-val="slate">Slate</button>
      <button type="button" class="seg" data-set="theme" data-val="ember">Ember</button>
      <button type="button" class="seg" data-set="theme" data-val="night">Night</button>
    </div>
    <div class="choice" role="group" aria-label="Spacing">
      <span class="lab">Spacing</span>
      <button type="button" class="seg" data-set="density" data-val="comfortable">Comfortable</button>
      <button type="button" class="seg" data-set="density" data-val="compact">Compact</button>
    </div>
    <div class="choice" role="group" aria-label="Text size">
      <span class="lab">Text size</span>
      <button type="button" class="seg" data-set="text" data-val="standard">Standard</button>
      <button type="button" class="seg" data-set="text" data-val="large">Large</button>
    </div>
    <div class="choice" role="group" aria-label="Motion">
      <span class="lab">Motion</span>
      <button type="button" class="seg" data-set="motion" data-val="smooth">Smooth</button>
      <button type="button" class="seg" data-set="motion" data-val="still">Still</button>
    </div>
    <div class="choice">
      <button type="button" class="btn quiet" id="display-reset">Reset display</button>
      <p class="note" id="display-note"></p>
    </div>
  </section>

  <div id="banner" class="banner" hidden></div>
  <div id="fatal" class="fatal" hidden>
    <h2>The drawing could not be built</h2>
    <p id="fatal-text">The model embedded in this page could not be read. Run threat_diagram.py on the model file again.</p>
  </div>

  <div id="app" hidden>
    <div class="tools" role="group" aria-label="Which threats to show">
      <span class="lab">Show</span>
      <button type="button" class="seg" data-filter="all" aria-pressed="true">All</button>
      <button type="button" class="seg" data-filter="open" aria-pressed="false">Open</button>
      <button type="button" class="seg" data-filter="unverified" aria-pressed="false">Unverified</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <div class="layout">
      <section class="drawing" aria-labelledby="drawing-h">
        <h2 id="drawing-h">Data flows and trust boundaries</h2>
        <div class="canvas" id="canvas"></div>
        <p class="legend" id="legend"></p>
      </section>
      <section class="detail" id="detail" aria-labelledby="detail-h">
        <h2 id="detail-h" tabindex="-1"></h2>
        <div class="back-row" id="back-row" hidden><button type="button" class="btn" id="back">Back to the drawing</button></div>
        <div id="detail-body"></div>
      </section>
    </div>

    <div class="extra">
      <div><button type="button" class="btn" id="scope-toggle" aria-expanded="false" aria-controls="scope">Assumptions and what is out of scope</button></div>
      <section class="panel" id="scope" hidden aria-label="Assumptions and what is out of scope"></section>
      <div><button type="button" class="btn" id="text-toggle" aria-expanded="false" aria-controls="textver">Text version</button></div>
      <section class="panel" id="textver" hidden aria-label="Text version">
        <div>
          <label for="text-box">The threats now shown, as plain text. Read-only.</label>
          <textarea id="text-box" readonly spellcheck="false"></textarea>
        </div>
        <div class="choice">
          <button type="button" class="btn primary" id="text-copy">Copy this text</button>
          <p class="note" id="copy-note" role="status" aria-live="polite"></p>
        </div>
      </section>
    </div>
    <p class="foot" id="foot"></p>
  </div>
</div>

<noscript><p class="fatal">This page draws the model with a script, and scripting is switched off here. The same content is in the model file, and threat_check.py prints its summary.</p></noscript>

<div class="peek" id="peek" hidden>
  <p id="peek-text"></p>
  <button type="button" class="btn primary" id="peek-read">Read</button>
</div>

<script type="application/json" id="model-data">__THREAT_MODEL_DATA__</script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var SVGNS = 'http://www.w3.org/2000/svg';
  var DEFAULTS = {theme: 'paper', density: 'comfortable', text: 'standard', motion: 'smooth'};
  var CHOICES = {theme: ['paper', 'slate', 'ember', 'night'], density: ['comfortable', 'compact'], text: ['standard', 'large'], motion: ['smooth', 'still']};
  var APP = 'threat-model-drawing';
  var KEY = APP + ':display';
  var CATEGORY = {spoofing: 'Spoofing', tampering: 'Tampering', repudiation: 'Repudiation', information_disclosure: 'Information disclosure',
    denial_of_service: 'Denial of service', elevation_of_privilege: 'Elevation of privilege'};
  var STATE = {mitigated_verified: 'Mitigated and verified', mitigated_claim_unsupported: 'Marked mitigated, but not shown to work',
    open_partly_mitigated: 'Open: partly mitigated', open_built_unverified: 'Open: built, not verified', open_nothing_built: 'Open: nothing built',
    accepted: 'Accepted', transferred: 'Transferred', unknown: 'Status not recognised'};
  var MIT = {verified: 'Verified', unverified: 'Built, not verified', failing: 'A verification is failing', not_built: 'Not built'};
  var KIND = {process: 'Process', store: 'Store', external: 'Outside party', human: 'Person'};
  var VKIND = {automated_test: 'Automated test', manual_check: 'Manual check', review: 'Review', config_scan: 'Config scan'};
  var RESULT = {pass: 'passed', fail: 'FAILED', not_run: 'not run'};
  var FILTER_WORD = {all: 'All', open: 'Open', unverified: 'Unverified'};

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'on') Object.keys(attrs.on).forEach(function (ev) { n.addEventListener(ev, attrs.on[ev]); });
      else if (attrs[k] !== false && attrs[k] != null) n.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function svg(tag, attrs) {
    var n = document.createElementNS(SVGNS, tag);
    Object.keys(attrs || {}).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    return n;
  }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

  // ---------- display choices: storage is optional; the page says which store is in use ----------
  var display = {theme: DEFAULTS.theme, density: DEFAULTS.density, text: DEFAULTS.text, motion: DEFAULTS.motion};
  var store = {mode: 'memory'};
  function clean(v) {
    var out = {};
    Object.keys(DEFAULTS).forEach(function (k) { out[k] = (v && CHOICES[k].indexOf(v[k]) >= 0) ? v[k] : DEFAULTS[k]; });
    return out;
  }
  function parseStored(raw) {
    if (raw && typeof raw === 'object' && 'value' in raw) raw = raw.value;
    if (typeof raw !== 'string') return null;
    // Saved as one envelope: {app, schema, content_id, saved_at, data}. Anything else is ignored.
    try {
      var env = JSON.parse(raw);
      if (!env || env.app !== APP || env.schema !== 1 || env.content_id !== 'display' || !env.data || typeof env.data !== 'object') return null;
      return env.data;
    } catch (e) { return null; }
  }
  function readLocal() {
    try { var raw = localStorage.getItem(KEY); store.mode = 'local'; return parseStored(raw); } catch (e) { store.mode = 'memory'; return null; }
  }
  function loadDisplay(done) {
    var systemStill = false;
    try { systemStill = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { systemStill = false; }
    if (systemStill) DEFAULTS.motion = 'still';
    var finish = function (v) { display = clean(v); applyDisplay(); done(); };
    try {
      var host = window.storage;
      if (host && typeof host.get === 'function' && typeof host.set === 'function') {
        var p = host.get(KEY);
        if (p && typeof p.then === 'function') {
          var settled = false;
          var once = function (fn) { return function (raw) { if (settled) return; settled = true; fn(raw); }; };
          p.then(once(function (raw) { store.mode = 'host'; finish(parseStored(raw)); }), once(function () { finish(readLocal()); }));
          setTimeout(once(function () { finish(readLocal()); }), 1500);
          return;
        }
      }
    } catch (e) { /* fall through to the browser's own storage */ }
    finish(readLocal());
  }
  function saveDisplay() {
    var text = JSON.stringify({app: APP, schema: 1, content_id: 'display', saved_at: new Date().toISOString(), data: display});
    if (store.mode === 'host') {
      try { var p = window.storage.set(KEY, text); if (p && typeof p.then === 'function') p.then(null, function () { store.mode = 'memory'; noteStore(); }); return; }
      catch (e) { store.mode = 'memory'; }
    }
    if (store.mode !== 'host') {
      try { localStorage.setItem(KEY, text); store.mode = 'local'; } catch (e) { store.mode = 'memory'; }
    }
  }
  function noteStore() {
    $('display-note').textContent = store.mode === 'host' ? 'Display choices are saved by the app showing this page.'
      : store.mode === 'local' ? 'Display choices are saved in this browser.'
      : 'Not saved: this page cannot store data here, so display choices last for this visit.';
  }
  function applyDisplay() {

  function stateTag(t) {
    var st = DER.threat_state[t.id] || 'unknown';
    var cls = st === 'mitigated_verified' ? 'done' : (st.indexOf('open') === 0 || st === 'mitigated_claim_unsupported') ? 'open' : 'other';
    return el('span', {'class': 'tag ' + cls, text: STATE[st]});
  }
  function threatRow(t) {
    var where = kindOf(t.target) === 'flow' ? t.target + ', ' + flowTitle(byId[t.target]) : name(t.target);
    return el('li', {'data-threat': t.id}, [el('button', {type: 'button', 'class': 'trow', 'data-jump': t.target, 'data-fk': 'row-' + t.id,
      'aria-label': t.id + ', ' + (CATEGORY[t.category] || t.category) + ' on ' + where + '. ' + STATE[DER.threat_state[t.id] || 'unknown'] + '. Show it on the drawing.',
      on: {click: function () { pick(t.target, true); }}}, [
      el('span', {'class': 'trow-top'}, [el('span', {'class': 'tid', text: t.id}), el('span', {text: CATEGORY[t.category] || t.category}), stateTag(t)]),
      el('span', {'class': 'trow-where', text: 'on ' + where})])]);
  }
  function renderDetail() {
    var body = $('detail-body'), head = $('detail-h');
    var keep = document.activeElement && body.contains(document.activeElement) ? document.activeElement.getAttribute('data-fk') : null;
    body.textContent = '';
    var all = threatsFor(S.sel), list = all.filter(shown), kids = [];
    if (!S.sel) {
      head.textContent = S.filter === 'all' ? 'All threats (' + all.length + ')' : FILTER_WORD[S.filter] + ' threats (' + list.length + ' of ' + all.length + ')';
      kids.push(el('p', {'class': 'note lead', text: 'In the order of the model file. Choose a threat here, or an element, a flow label or a zone name in the drawing, to read it in full.'}));
    } else {
      var x = byId[S.sel], k = kindOf(S.sel);
      head.textContent = titleOf(S.sel);
      var facts = [];
      if (k === 'flow') {
        facts.push(fact('Carries', assetList(x.data)));
        facts.push(fact('How', x.protocol));
        facts.push(fact('Authenticated', x.authenticated ? 'yes' : 'no'));
        facts.push(fact('Trust boundary', DER.boundary[x.id] ? 'crosses: ' + (x.crosses || []).map(name).join(', then ') : 'stays inside ' + name(byId[x.from].zone)));
      } else if (k === 'element') {
        facts.push(fact('Kind', (KIND[x.kind] || x.kind) + ', in the zone ' + name(x.zone)));
        if ((x.holds || []).length) facts.push(fact('Holds', assetList(x.holds)));
      } else {
        facts.push(fact('Trust', x.trust));
        facts.push(fact('Holds', plural(M.elements.filter(function (e) { return e.zone === x.id; }).length, 'element', 'elements') + '; ' + plural(zoneFlows(x.id).length, 'flow touches it', 'flows touch it')));
      }
      facts.push(fact('Threats', FILTER_WORD[S.filter] === 'All' ? plural(all.length, 'threat', 'threats') + ', ' + all.filter(isOpen).length + ' open'
        : list.length + ' of ' + all.length + ' shown (' + FILTER_WORD[S.filter].toLowerCase() + ')'));
      kids.push(el('ul', {'class': 'facts'}, facts));
      var jumps = [];
      if (k === 'element') M.flows.forEach(function (f) { if (f.from === x.id || f.to === x.id) jumps.push(jumpButton(f.id, f.id + (f.from === x.id ? ' to ' + name(f.to) : ' from ' + name(f.from)))); });
      if (k === 'flow') { jumps.push(jumpButton(x.from, 'From: ' + name(x.from))); jumps.push(jumpButton(x.to, 'To: ' + name(x.to))); }
      jumps.push(el('button', {type: 'button', 'class': 'btn quiet', 'data-fk': 'clear', id: 'clear-sel', text: 'Show the whole model', on: {click: function () { pick(null, true); }}}));
      kids.push(el('div', {'class': 'jump'}, jumps));
    }
    var compact = !S.sel || kindOf(S.sel) === 'zone';
    if (list.length) kids.push(el('ul', {'class': 'cards' + (compact ? ' index' : ''), id: 'cards'}, list.map(compact ? threatRow : threatCard)));
    else if (!all.length) kids.push(el('div', {'class': 'blank', id: 'blank'}, [
      el('h3', {text: S.sel ? 'No threats are recorded here' : 'The model records no threats'}),
      el('p', {text: S.sel ? 'The checker asks for an entry only on flows that cross a trust boundary and on stores holding a high-sensitivity asset. Nothing recorded is not the same as nothing possible.'
        : 'That is a result only if every flow and store was walked. Run threat_check.py on the model file.'})]));
    else kids.push(el('div', {'class': 'blank', id: 'blank'}, [
      el('h3', {text: 'Nothing here is ' + FILTER_WORD[S.filter].toLowerCase()}),
      el('p', {text: (S.filter === 'unverified' ? 'Unverified means a mitigation is built and its recorded verification set is incomplete or contains a failure. ' : '') + 'There ' + (all.length === 1 ? 'is 1 threat' : 'are ' + all.length + ' threats') + (S.sel ? ' on ' + titleOf(S.sel) : ' in the model') + ' in other states.'}),
      el('button', {type: 'button', 'class': 'btn', 'data-fk': 'show-all', id: 'show-all', text: 'Show all threats', on: {click: function () { setFilter('all'); var b = document.querySelector('[data-filter="all"]'); if (b) b.focus(); }}})]));
    kids.forEach(function (n) { body.appendChild(n); });
    $('back-row').hidden = !S.sel;
    if (keep) { var again = body.querySelector('[data-fk="' + keep + '"]'); if (again) again.focus(); }
    var c = S.sel ? {all: all.length, open: all.filter(isOpen).length, unverified: all.filter(isUnverified).length} : null;
    showPeek();
    if (S.sel) $('peek-text').textContent = titleOf(S.sel) + '. ' + countWords(c) + '.';
    renderText(list);
  }
  var detailSeen = false;
  function showPeek() { $('peek').hidden = !S.sel || detailSeen; }
  function watchDetail() {
    if (!('IntersectionObserver' in window)) return;
    try {
      new IntersectionObserver(function (entries) { detailSeen = entries[entries.length - 1].isIntersecting; showPeek(); }, {rootMargin: '0px 0px -80px 0px'}).observe($('detail-h'));
    } catch (e) { detailSeen = false; }
  }
  function renderText(list) {
    var L = [M.system, 'Threat model as of ' + M.as_of + '. ' + (S.sel ? 'Showing: ' + titleOf(S.sel) + '. ' : '') + 'Filter: ' + FILTER_WORD[S.filter] + '. ' + plural(list.length, 'threat', 'threats') + '.', ''];
    list.forEach(function (t) {
      L.push(t.id + ' [' + STATE[DER.threat_state[t.id] || 'unknown'] + '] ' + (CATEGORY[t.category] || t.category) + ' on ' + (kindOf(t.target) === 'flow' ? t.target + ' (' + flowTitle(byId[t.target]) + ')' : name(t.target)));
      L.push('  ' + t.scenario);
      L.push('  Impact: ' + t.impact);
      L.push('  Likelihood: ' + t.likelihood);
      (t.mitigations || []).forEach(function (mid) {
        var m = byId[mid];
        L.push('  ' + mid + ' (' + MIT[DER.mitigation_state[mid]] + '): ' + m.what + ' Where: ' + m.where);
        (m.verified_by || []).forEach(function (vid) { var v = byId[vid]; L.push('    ' + vid + ' ' + RESULT[v.last_result] + (v.last_run ? ' ' + v.last_run : '') + ': ' + v.how); });
      });
      if (!(t.mitigations || []).length) L.push('  Mitigation: none recorded');
      if (t.status === 'accepted' || t.status === 'transferred') L.push('  ' + (t.status === 'accepted' ? 'Accepted by ' + (t.accepted_by || '?') : 'Transferred') + ': ' + (t.accepted_why || 'no reason recorded'));
      L.push('');
    });
    L.push('A reading aid. Not a penetration test, a compliance audit or a guarantee.');
    $('text-box').value = L.join('\n');
    $('copy-note').textContent = '';
  }

  // ---------- actions ----------
  function say(text) { $('status').textContent = text; }
  function pick(id, fromDetail) {
    S.sel = (id && S.sel === id && !fromDetail) ? null : id;
    paintCounts();
    paintSelection();
    renderDetail();
    var all = threatsFor(S.sel);
    say(S.sel ? 'Selected ' + titleOf(S.sel) + '. ' + plural(all.filter(shown).length, 'threat', 'threats') + ' shown in the details.' : 'Showing the whole model: ' + plural(all.filter(shown).length, 'threat', 'threats') + '.');
    if (fromDetail) {
      var target = S.sel ? document.querySelector('#canvas [data-pick="' + S.sel + '"]') : $('detail-h');
      if (target) { target.focus({preventScroll: false}); }
    }
  }
  function setFilter(f) {
    S.filter = f;
    document.querySelectorAll('[data-filter]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-filter') === f)); });
    paintCounts();
    layoutWires();
    renderDetail();
    var n = M.threats.filter(shown).length;
    say(f === 'all' ? 'Showing all ' + plural(n, 'threat', 'threats') + '.' : 'Showing ' + n + ' of ' + M.threats.length + ' threats: ' + FILTER_WORD[f].toLowerCase()
      + (f === 'unverified' ? ' (a mitigation is built and its recorded verification set is incomplete or contains a failure).' : '.'));
  }
  function fillStatic() {
    document.title = 'Threat model: ' + M.system;
    $('eyebrow').textContent = 'Threat model as of ' + M.as_of + (DATA.source ? ', drawn from ' + DATA.source : '');
    $('system').textContent = M.system;
    var open = M.threats.filter(isOpen).length, done = M.threats.filter(function (t) { return DER.threat_state[t.id] === 'mitigated_verified'; }).length;
    var other = M.threats.length - open - done;
    $('tally').textContent = plural(M.threats.length, 'threat', 'threats') + ': ' + open + ' open, ' + done + ' mitigated and verified' + (other ? ', ' + other + ' accepted, transferred or unsupported' : '')
      + '. Checker: ' + plural(CHECK.errors.length, 'error', 'errors') + ', ' + plural(CHECK.advisories.length, 'advisory note', 'advisory notes') + '.';
    document.querySelectorAll('[data-filter]').forEach(function (b) {
      var f = b.getAttribute('data-filter');
      var n = f === 'all' ? M.threats.length : M.threats.filter(f === 'open' ? isOpen : isUnverified).length;
      b.textContent = FILTER_WORD[f] + ' ' + n;
      b.addEventListener('click', function () { setFilter(f); });
    });
    if (CHECK.errors.length) {
      var b = $('banner');
      b.hidden = false;
      b.appendChild(el('b', {text: 'The checker found ' + plural(CHECK.errors.length, 'error', 'errors') + ' in this model. '}));
      b.appendChild(document.createTextNode('The drawing shows the file as written. Fix the model before relying on it.'));
      b.appendChild(el('ul', {}, CHECK.errors.slice(0, 5).map(function (e) { return el('li', {text: e.message}); })));
    }
    $('legend').textContent = '';
    [['Dashed box', 'a zone; its edge is a trust boundary. '], ['Thick line and double-edged label', 'a flow that crosses a trust boundary. '],
      ['Rounded box', 'a process. '], ['Box with heavy top and bottom', 'a store. '], ['Square box', 'an outside party. '], ['Dotted box', 'a person. '],
      ['The arrow', 'points the way the data moves.']].forEach(function (pair) { $('legend').appendChild(el('b', {text: pair[0] + ': '})); $('legend').appendChild(document.createTextNode(pair[1])); });
    var scope = $('scope');
    [['Assumptions', M.assumptions], ['Out of scope', M.out_of_scope]].forEach(function (pair) {
      scope.appendChild(el('h3', {text: pair[0]}));
      scope.appendChild((pair[1] || []).length ? el('ul', {}, pair[1].map(function (s) { return el('li', {text: s}); })) : el('p', {'class': 'note', text: 'None recorded.'}));
    });
    $('foot').textContent = 'A reading aid drawn from the model file by threat_diagram.py. It shows what the file says and decides nothing. It is not a penetration test, a compliance audit or a guarantee.';
  }
  function toggle(buttonId, panelId) {
    $(buttonId).addEventListener('click', function () {
      var open = this.getAttribute('aria-expanded') !== 'true';
      this.setAttribute('aria-expanded', String(open));
      $(panelId).hidden = !open;
    });
  }
  function copyText() {
    var box = $('text-box'), note = $('copy-note');
    function fallback() { box.focus(); box.select(); note.textContent = "Copying was refused here. The text is selected: use your device's own copy."; }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(box.value).then(function () { note.textContent = 'Copied ' + box.value.length + ' characters.'; }, fallback);
        return;
      }
    } catch (e) { /* use the box */ }
    fallback();
  }

  var resizeTimer = null;
  function relayout() {
    var cols = $('canvas').clientWidth >= 560 ? 3 : 2;
    if (cols !== S.cols) buildCanvas(); else layoutWires();
  }
  fillStatic();
  toggle('scope-toggle', 'scope');
  toggle('text-toggle', 'textver');
  $('text-copy').addEventListener('click', copyText);
  $('peek-read').addEventListener('click', function () { $('detail').scrollIntoView({block: 'start'}); $('detail-h').focus({preventScroll: true}); detailSeen = true; showPeek(); });
  watchDetail();
  $('back').addEventListener('click', function () {
    var target = S.sel ? document.querySelector('#canvas [data-pick="' + S.sel + '"]') : $('canvas');
    if (target) { target.scrollIntoView({block: 'center'}); if (target.focus) target.focus({preventScroll: true}); }
  });
  wireDisplay(function () { relayout(); });
  window.addEventListener('resize', function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(relayout, 120); });
  $('app').hidden = false;
  loadDisplay(function () { buildCanvas(); renderDetail(); say('Showing all ' + plural(M.threats.length, 'threat', 'threats') + '.'); });
})();
</script>
</body>
</html>
